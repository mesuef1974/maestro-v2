متعدد المدارس بعد onboarding وإغلاق N-095 | RLS جاهز |\n| O8 | استكمال سلاسل الاعتماد للنقل الداخلي (مستويات 3..7) | docstring `transfer_decision.py` |\n| O9 | الاستفادة من نمط الجودة لتوليد تقييمات الموظفين | `quality` + احتياج sanctions |\n| O10 | تفعيل التحليلات والمؤشرات للإدارة | `analytics` (13 مساراً) |\n\n### التهديدات\n\n| # | البند | الدليل |\n|---|---|---|\n| T1 | بقاء التجميد يجعل المنتج بلا قيمة للأسر | D-268م، `notifications/frozen.py` |\n| T2 | تفعيل محرك الحكم دون إدخال حرمان/غش قد يعطي أحكاماً ناقصة | القسم 2.8 |\n| T3 | تسرب بين المدارس عبر `core_customuser` العام | تدقيق 2026-10-05، `behavior/views.py:867` |\n| T4 | عدم وصول أي بريد في الإنتاج | `UndeliveredEmailBackend` |\n| T5 | تراكم PRs مفتوحة وفروع معلّقة | #1218 و#1204 وفرع referrals-038 |\n| T6 | قيود PDPPL على بيانات صحية دون اكتمال العيادة | SPECIAL_UNRESOLVED لـ `core_healthrecord` |\n| T7 | منافسون ناضجون في تجربة الأسرة وLMS | القسم 9 (تقدير) |\n| T8 | اعتماد متكرر على قرارات المالك لفتح المسارات | مستويات 3..7 معلّقة؛ N-095 وغيره محجوب |\n| T9 | تغيّر لوائح الوزارة سنوياً مع ترميز صلب | `conduct_2026.py` مربوط بعام 2026 |\n| T10 | تعقيد: 28 تطبيقاً و419 هجرة يرفعان كلفة الصيانة | القسم 1 |\n\n## 12. أهم عشر فجوات بالأثر على المدرسة\n\n1. تجميد أولياء الأمور وغياب مزوّد بريد وخط تسليم مفعّل: لا يصل أي إخطار غياب أو سلوك أو عيادة إلى الأسرة (`notifications/frozen.py`, `production.py:14`).\n2. محرك الحكم مطفأ وبلا إدخال للحرمان والغش: لا نتائج ترقية/دور ثانٍ مؤتمتة (`base.py:846`, `assessments/models.py:695,745`).\n3. طلبات أولياء الأمور خارج main (#1218) وبلا قناة إدخال من البوابة.\n4. لا مسار ترقية ونهاية عام وتخرّج: عمل يدوي كل صيف.\n5. بحث المستخدمين بلا مرشّح مدرسة (`behavior/views.py:867`, `api/views.py:*`) يمنع توسيع التعدد بأمان (N-095 محجوب).\n6. العيادة بلا دواء وإحالات وعزل ومخزون: سلامة الطلبة (CLN-13..19 مخططة).\n7. لا جزاءات تأديبية للموظفين: تعطل قواعد التقييم الوظيفي (`quality/evaluation_services.py:276`).\n8. ستة نماذج موظفين غائبة (مباشرة، تحديث بيانات، إفادة، عودة، إخلاء، تحقيق).\n9. لا تصدير/رفع للوزارة ولا تكامل مع نور؛ التقارير تُسلَّم يدوياً.\n10. الإرشاد والتعليم الخاص (18 نموذج أخصائي، IEP، تسهيلات اختبارية) غائبة تماماً، وتسعة أدوار بلا قدرات.\n\n## 13. ما تغيّر عن التقرير القديم (مُثبَت على الرأس الحالي)\n\nأُثبت إصلاحه أو بناؤه:\n- القبول والنقل (النموذج 07): مبنيّان (`transfer_chain.py`, `admission_models.py`, #1159).\n- فترة التجربة: مكتملة، مع واجهة ونتيجة مُدقَّقة (`probation.py`, #1203).\n- خطاب العذر (04): منفَّذ بمراحله وقائمة مغلقة ومهلة (`attendance.py:355+`, `excuses.py`).\n- تغيير الصف الداخلي: صار جزئياً بدل الغياب (`transfer_decision.py`).\n- دور منسّق شؤون الطلبة (`student_affairs_coordinator`) أُضيف؛ الأدوار 35 صارت 37.\n- حزمة الصلاحيات: 99 صلاحية بدل ~70، و`core/capabilities/` حزمة.\n- العيادة: من سجل صحي بسيط إلى زيارات مرمَّزة وسجل مشفّر موسَّع وتدفق تأكيد إحالة (#1208, #1217).\n- نصاب لجنة السلوك (`committee_services.py`) وتوحيد شاشتَي المخالفات (#1178).\n- سجلات متابعة الغياب الإلحاقية وإشعارات خصم الموظفين.\n- نماذج الأولياء 01 و02 و05 و06 و08: بُنيت لكنها في PR #1218 المفتوح فقط (ليست على main).\n\nبقي كما هو أو لم يتغيّر:\n- محرك الحكم مطفأ افتراضياً؛ التجميد قائم؛ لا مزوّد بريد في الإنتاج.\n- لا جزاءات موظفين؛ النماذج 04/05/06/09/10/11 للموظفين غائبة.\n- تسع أدوار بلا قدرات حقيقية؛ بحث المستخدمين عبر المدارس؛ سبع صفحات هيكلية؛ لا ترقية/نهاية عام؛ لا أخصائي نفسي/اجتماعي؛ لا تسهيلات؛ لا رفع للوزارة؛ سلّم التأخر معروض لا منفَّذ؛ لا حقل لغة في الإشعارات؛ تتبّع النقل بلا خريطة.\n\nتصحيح للتقرير القديم: عدد التطبيقات 28 لا 23، والنماذج الغائبة من 19 لم تعد 13 بل أقل بعد بناء 07 و04 و03 جزئياً، ولا يصح تكرار تقدير الامتثال 55-60% دون إعادة قياس.\n\n---\n\n# الملحق و — محور الأداء والبيانات وقابلية التوسّع (محلّل Sonnet، قراءة فقط على الرأس 6f7ec0608)\n\n# محور الأداء والبيانات وقابلية التوسّع — تقرير SWOT لمنصّة SchoolOS\n\nالشجرة المفحوصة: `C:\\Users\\mesue\\wt_swot` (تساوي origin/main عند الرأس 6f7ec0608). الفحص قراءةٌ فقط: لم يُعدَّل ملفّ، ولم يُشغَّل خادمٌ أو قاعدة بيانات، ولم يُقرأ `D:\\shschool_mvp`.\n\nمفتاح الوسوم المستعملة في كلّ بندٍ:\n- [تحقّق] ما قرأتُه في الشيفرة فعلًا مع مرجع ملفّ:سطر.\n- [تعليق] رقمٌ أو زمنٌ ورد في تعليقٍ داخل الشيفرة، وليس قياسي أنا.\n- [تقدير] استنتاجٌ أو حسابٌ مبنيٌّ على معرفةٍ بالمكتبات أو على أرقامٍ تقريبيّة؛ لم يُقَس.\n- [غير معلوم] لا يمكن معرفته من الشيفرة (مثل قيم الإنتاج الفعلية).\n\n---\n\n## الملخّص (عشرة أسطر)\n\n1. المنتج مصمَّمٌ فعليًّا لمدرسةٍ واحدة لكلّ دور قاعدة بيانات: هويّة المستأجر في RLS تُقرأ من دور الاتصال، وبذرها يعمل فقط حين يكون في `core_school` صفٌّ واحد (core/migrations/0037:73-79)؛ هذا العائق الأول أمام «مئة مدرسة في نشرٍ واحد».\n2. وضع Celery الافتراضي متزامن (`CELERY_ASYNC_ENABLED` افتراضيه False، production.py:210,234)؛ قيمة الإنتاج [غير معلوم] وتوثيق 2026-08-08 يقول إنه كان معطَّلًا.\n3. التصدير المركزي غير المتزامن يغطّي ستّة أنواعٍ فقط؛ نحو 35 عرضًا آخر لـPDF/Excel ما زال متزامنًا داخل الطلب.\n4. إعادة احتساب درجات الصفّ كاملًا (assessments/services.py:562) تُستدعى متزامنةً من العرض (assessments/views.py:690-701) وتحفظ صفًّا بصفّ.\n5. الفهرسة جيّدة نسبيًّا للحضور والدرجات والإشعارات (attendance.py:305-314)، لكن لا تقسيم (partitioning) ولا أرشفة لـ`core_auditlog` ولا للحضور؛ يُحتفظ بهما بلا حدّ.\n6. `CONN_MAX_AGE=0` (production.py:23) مع daphne بعمليّةٍ واحدة وبلا pgbouncer، وكلّ طلب يدفع استدعاءات DB إضافية (RLS مرتين + جلسة).\n7. Redis واحدٌ للتخزين المؤقّت والوسيط والنتائج وطبقة القنوات والخنق، وسياسة الإخلاء [غير معلوم].\n8. الخصوصية: `national_id` و`phone` ما زالا مخزَّنين نصًّا صريحًا بجوار النسخة المشفَّرة (user.py:35,44,160,165)، والاستضافة في us-west2 خارج قطر، ومستودع النسخ الاحتياطي عامّ (النسخ مشفَّرة GPG).\n9. المراقبة جيّدة (Sentry + /health/ + QCC + نبض العامل) لكن بلا معرّف ارتباط للطلب ولا سجلّات JSON، و`/metrics` خلف مصادقة staff فلا يكشطها Prometheus غالبًا [تقدير].\n10. أهمّ التوصيات: ضبط متغيّرات S3 في railway.ts، تحويل التصدير الثقيل وإعادة الاحتساب إلى مهامّ خلفيّة، تجميع الاتصالات، فصل Redis، جدولة مُصالِح الإشعارات، وحسم نموذج المستأجر قبل أيّ وعدٍ بالتوسّع.\n\n---\n\n## 1. استعلامات ORM (N+1 وselect_related/prefetch_related)\n\nالحكم العام: وعيٌ جيّد بالمشكلة مع بقاء جيوبٍ.\n\n[تحقّق] وجود اختبارات تحمي من N+1: `tests/test_n_plus_one_queries.py` (تسعة اختبارات استعلامات ثابتة العدد) و`tests/test_admin_changelist_queries.py`، ومهارة `.claude/skills/nplus1-hunter` في المستودع.\n\n[تحقّق] لوحات القيادة تعتمد استعلاماتٍ كثيرة منفصلة: `core/dashboard_selectors.py` (أسطر ~143-187 و360-410 و450-497 و603-653) تستدعي `.count()` مرّاتٍ عديدة بدل تجميعٍ واحد. ليس N+1 بالمعنى الصارم (العدد ثابت لا يتناسب مع البيانات) لكنه يضاعف زمن الصفحة بقدر الرحلات إلى DB، وخصوصًا مع اتصالٍ جديد لكلّ طلب (CONN_MAX_AGE=0).\n\n[تحقّق] معالج السياق `core/context_processors.py` يعمل في كلّ عرضٍ HTML: يستعلم المدرسة والقسم والتقويم الأكاديمي (مع تخزين مؤقّت داخل الطلب) ولجنة الجودة، ويستدعي `get_accessible_modules_from_registry` مرّتين عبر `permissions_context`. التكلفة تتراكم على كلّ صفحة.\n\n[تحقّق] إشارات الحوكمة `core/signals.py:19` (`_log`) تكتب صفّ AuditLog متزامنًا عند `post_save` لعشرة نماذج (HealthRecord, BehaviorInfraction, ClinicVisit, ParentStudentLink, BookBorrowing, ConsentRecord, StudentAssessmentGrade, StudentSubjectResult, Membership, CustomUser). قراءة `instance.school` قد تُطلق استعلامًا كسولًا إضافيًّا لكلّ حفظ.\n\n[تحقّق] `assessments/services.py:562-602` — `recalculate_full_class` حلقةٌ على الطلاب، لكلٍّ منهم `select_for_update` وحفظ نتيجة الفصل والسنة. عدد الاستعلامات يتناسب خطّيًّا مع عدد طلاب الشعبة [تقدير: عدّة استعلامات لكلّ طالب؛ لم يُقَس].\n\n[تحقّق] `parents/views.py:211-214` و`:263-267` — حلقةٌ على أبناء وليّ الأمر بثلاثة استعلاماتٍ فأكثر لكلّ ابن؛ محدودة بعدد الأبناء فالخطر صغير.\n\n[تحقّق] `Session.present_count` (operations/models/attendance.py) خاصّية تُجري استعلامًا؛ لم أجد استعمالها داخل حلقة.\n\n[تحقّق] `student_affairs/views.py:300-400` استعلام ضخم (annotate وSubquery وبحث `arabic_key(...)__icontains`) لكنه مُرقَّم بالصفحات.\n\n[تحقّق] البحث: `core/views_search.py` يستعمل `icontains` على `full_name` (له فهرس GIN trigram من core/migrations/0012) وعلى البريد (بلا فهرس). و`core/privacy.py:62-73` يبحث بـ`national_id__icontains` للقيادات بلا فهرس trigram. [تقدير] على عشرات آلاف الصفوف قد يتحوّل إلى مسحٍ كامل؛ لم يُقَس.\n\n---\n\n## 2. الفهارس وتصميم الجداول\n\n[تحقّق] الحضور `StudentAttendance` (operations/models/attendance.py:138-317): مفتاح UUID v4، فهارس (school,session) و(student,status) و(student,status,marked_at) وفهرسٌ جزئي للخروج (الأسطر 305-314)، وقيد فريد (session,student). لا عمود تاريخ في الصفّ نفسه؛ التاريخ يأتي بالربط مع `Session` التي لها فهارس (school,date) و(teacher,date) و(class_group,date). التقييم: جيّد لنمط الاستعلام الحالي. [تقدير] مفاتيح UUID v4 العشوائية تُضعف محلّية الكتابة في B-tree على جداولٍ كبيرة.\n\n[تحقّق] سجلّ الحضور الإضافي `AttendanceEntry` (attendance_ledger.py:73) append-only بفهرس.\n\n[تحقّق] `core/models/audit.py:184-294` — `AuditLog`: مفاتيح أجنبية إلى المدرسة والمستخدم (فهارس افتراضية)، `timestamp` بـdb_index، وفهارس (school,timestamp) و(model_name,object_id) و(user,timestamp) (الأسطر 246-250). الجدول غير قابلٍ للتعديل، و`save()` يُجري `exists()` قبل الحفظ (استعلامٌ إضافي لكلّ كتابة). فُحصت فرضية فهرسٍ مكرَّر وتبيّن أنّ core/migrations/0013 أزال المكرَّر.\n\n[تحقّق] الدرجات: `assessments/models.py:352-420` فيها فهارس مناسبة لنتائج الطلاب.\n\n[تحقّق] الإشعارات: `notifications/models.py:335-417` — `InAppNotification` بفهرس (user,is_read,-created_at) و(school,event_type). `NotificationLog` يبدأ عند السطر 86.\n\n[تحقّق] لا تقسيم جداول: لا يوجد `PARTITION BY` في أيّ ملفّ.\n\n[تحقّق] المرفقات: `StudentAttendance.excuse_file` (attendance.py:259-264) بلا فهرس، وهو يدخل في حلقة المحلِّل `governance/media_selectors.py:29-130` التي تجري حتى نحو سبعة استعلاماتٍ متتالية `filter(...).first()` على حقول FileField غير مفهرسة لكلّ طلب ملفّ (`governance/views_media.py:55`). [تقدير] يتدهور مع نموّ الجداول.\n\n[غير مُتحقَّق منه كليًّا] المفاتيح الأجنبية غير المفهرسة: لم أُجرِ مسحًا آليًّا لها (Django ينشئ فهرسًا افتراضيًّا لكلّ ForeignKey ما لم يُعطَّل بـdb_index=False).\n\n---\n\n## 3. التخزين المؤقّت (Cache)\n\n[تحقّق] المواضع: `CACHES` في production.py:180-188 — Redis إن توفّر `REDIS_URL`، وإلا ذاكرة محلّية `locmem` (ذاكرةٌ لكلّ عمليّةٍ منفصلة وغير متّسقة بين النسخ).\n\n[تحقّق] عشرة عروض تحليلات تستعمل `@cache_page(300)` مع `@vary_on_cookie` (analytics/views.py:40-41 وتسعة مواضع أخرى). المفتاح يتضمّن الكوكي فيعزل المستخدمين، وبالتالي المدارس، لكنه يعني نسخةً مخزَّنة لكلّ جلسةٍ (نسبة إصابة أضعف).\n\n[تحقّق] تخزين «الحيّ» لعشرين ثانية بمفاتيح تتضمّن المدرسة (`live:{school}:{day}` في operations/day_selectors.py:470-498 و`cglive:...` في operations/services/class_grid_live.py:50-73) مع قفل `cache.add` يمنع العاصفة (stampede). تصميمٌ جيّد.\n\n[تحقّق] الإبطال: بالمدّة (TTL) فقط؛ لا إبطال حدثيّ. يعني بياناتٍ قديمةً حتى خمس دقائق في التحليلات.\n\n[تحقّق] `operations/middleware.py` يولّد حصص اليوم عند أول طلب في اليوم (`_DONE_TODAY` + مفتاح كاش لأربع ساعات). مع `locmem` أو عدّة نسخ قد يتكرّر التوليد؛ تخفّفه الطبيعة التكرارية (idempotent) في `operations/services/schedule_sessions.py:63-123`.\n\n[تقدير] عزل المدارس في الكاش يعتمد على أن تتضمّن المفاتيح المدرسة أو الكوكي؛ لم أراجع كلّ استعمالات `cache.get/set` في المشروع.\n\n---\n\n## 4. المهامّ الخلفيّة (Celery)\n\n[تحقّق] `CELERY_TASK_ALWAYS_EAGER = not CELERY_ASYNC_ENABLED` (production.py:234) و`CELERY_ASYNC_ENABLED` افتراضيه False (production.py:210) و`CELERY_TASK_EAGER_PROPAGATES=False` (production.py:238). أي أنّ أيّ نشرٍ لا يضبط المتغيّر صراحةً ينفّذ كلّ المهامّ داخل الطلب نفسه ويبتلع الاستثناءات.\n\n[غير معلوم] قيمة الإنتاج. `scripts/railway-beat.sh:16` يشترط أن تكون true، و`docs/monitoring/P1_PRODUCTION_VERIFICATION_2026-08-08.md:43` يقول إنها كانت معطَّلة بذلك التاريخ، وتعليق `operations/middleware.py` يذكر أنّ Beat كان متوقفًا، بينما تعليقات `.railway/railway.ts:118-119` و`scripts/railway-beat.sh:2-4` تقول إنه أُضيف. والمتغيّر مدرجٌ في `SHARED_VARIABLES` (railway.ts:42) أي مضبوطٌ على الأرجح لكن قيمته لا تظهر في الشيفرة.\n\n[تحقّق] أثر الوضع المتزامن: `operations/views_schedule.py:861` يستدعي `generate_schedule_v2_task.delay(...)`؛ تعليق المصدر يذكر أنّ التوليد استغرق بين 42 و279 ثانية في تلك المدرسة [تعليق] وأنّ gunicorn/nginx تقطع عند 120 ثانية. في الوضع المتزامن يعني هذا انقطاع الطلب. حدّ التوليد الناعم 3600 والصلب 3660 ثانية (`operations/scheduler_v2/limits.py:18-19`).\n\n[تحقّق] حدود الزمن متناقضة: `shschool/celery.py:172-173` يضع soft=300 وhard=600، بينما production.py:228 يضع `CELERY_TASK_TIME_LIMIT=300`. أيّهما يفوز [تقدير] يعتمد على ترتيب التحميل؛ والأهم أنّ مهمة التوليد (3600) تتجاوز الحدّ العامّ ما لم تُعطَ حدودًا خاصّة بها.\n\n[تحقّق] الاعتمادية: `task_acks_late=True` و`task_reject_on_worker_lost=True` (celery.py:168-169) و`max_retries=3` و`worker_max_memory_per_child=300_000` (celery.py:177). مهامّ الإرسال (بريد، SMS، واتساب) `max_retries=3` وتأخير 60 ثانية (notifications/tasks.py). مع acks_late قد تُنفَّذ المهامّ غير المتكافئة (غير idempotent) مرّتين عند موت العامل.\n\n[تحقّق] **مُصالِح الإشعارات غير مجدول**: `reconcile_deliveries_task` (notifications/tasks.py:1320) لا تظهر في `beat_schedule`، ودوكسترنغها يقول إنّ BEAT_DEPLOY غير مصرَّح به، وتعليق tasks.py:239 يُحيل التسليمات المستنفَدة إلى «المصالِح». النتيجة: تسليماتٌ فاشلة تبقى بلا معالجة.\n\n[تحقّق] المهامّ الدوريّة عالية التواتر: `revoke-expired-temp-permissions` كلّ دقيقة (celery.py:95)، `qcc-collect-local` كلّ دقيقة (celery.py:137)، `qcc-collect-remote` كلّ 4 دقائق، `worker-heartbeat` (celery.py:125) و`reap-stuck-schedule-generations` و`finalize-period-exits` كلّ 5 دقائق، `refresh-backup-status` كلّ 30 دقيقة، `purge-expired-export-jobs` كلّ ساعة، `enforce-data-retention-weekly` الجمعة 03:30. مسح الحضور (`ATTENDANCE_SWEEP_BEAT` celery.py:187) وتنبيهات المعلّم (`TEACHER_ALERTS_BEAT` celery.py:197) وتقارير الغياب (`ABSENCE_REPORTS_BEAT`) معطَّلة افتراضيًّا بأمر المالك.\n\n[تحقّق] العامل: تزامن افتراضي 2 (`scripts/railway-worker.sh:36`) وطابورٌ افتراضيٌّ واحد؛ مهمة توليد جدولٍ طويلة قد تحجز نصف السعة وتؤخّر الإشعارات والتصدير. [تقدير] لا عزل بين الطوابير.\n\n[تحقّق] قاعدة 300ms: غير مُطبَّقة في عدّة مسارات (إعادة الاحتساب، التصدير المتزامن، AuditLog المتزامن).\n\n---\n\n## 5. الترقيم وحجم الاستجابة والتصدير الثقيل\n\n[تحقّق] واجهة DRF: `PAGE_SIZE=50` (base.py:380) و`StandardPagination` (api/pagination.py: 50 وحدّ أقصى 200). نحو 15 عرض HTML يستعمل `Paginator`.\n\n[تحقّق] آليّة التصدير المركزيّة (`core/exports/services.py` و`registry.py` و`timeouts.py`): لا يُسجَّل نوعٌ بوضع المزامنة ما لم يُقَس p95؛ فالمتاح عمليًّا وضع «job». حدود: ثلاث مهامّ نشطة كحدٍّ أقصى للمستخدم، إزالة تكرار 60 ثانية، حدّ زمن المهمة 170 ثانية، `EXPORT_JOB_TIMEOUT` ثلاث دقائق، وتنظيف كلّ ساعة (`purge_expired_export_jobs`).\n\n[تحقّق] المسجَّل ستّة أنواعٍ فقط: schedule.pdf وschedule.xlsx وschedule.pages_pdf وabsence_followup_pdf وreports.class_certificates وstudents_pdf (operations/apps.py:18-33 وreports/apps.py وstudent_affairs/apps.py). والأرقام في تعليقات التسجيل [تعليق] (8.3 ثانية لقائمة الطلاب PDF، 2.9 للشهادات، 19.9 لأثقل تصدير جدول) ليست قياسي.\n\n[تحقّق] نحو 35 عرض PDF/Excel آخر ما زال متزامنًا (مثال: student_affairs/views.py:487 تصدير Excel مع فكّ تشفير الهاتف صفًّا بصفّ، و:1389). [تقدير] يحتجز الخيط المتزامن لـdaphne خلال التصدير (القسم 9).\n\n[تحقّق] ثلاثة محرّكات PDF (weasyprint وreportlab وxhtml2pdf) مع playwright وopenpyxl في requirements.txt: ثقلٌ في الصورة وفي الذاكرة وتنوّعٌ في الجودة.\n\n---\n\n## 6. الهجرات (Migrations)\n\n[تحقّق] 419 هجرة: operations 96، core 85، roadmap 82، quality 25، behavior 25، assessments 20، notifications 19، وغيرها. مئة وخمس عشرة هجرة تحتوي RunPython وسبع وخمسون RunSQL.\n\n[تحقّق] هجرات roadmap الاثنتان والثمانون (نحو 20%) هي مزامنةٌ لبيانات خارطة طريق المشروع داخل سلسلة هجرات المنتج: ضجيجٌ يبطئ إنشاء القواعد الجديدة والاختبارات ويزيد مخاطرة التعارض.\n\n[تحقّق] البناء المتزامن للفهارس نادر: ملفّان فقط يستعملان CONCURRENTLY: `operations/migrations/0055_attendance_exit_partial_index.py` (AddIndexConcurrently مع atomic=False) و`operations/migrations/0092_attendance_unique_constraints.py` (CREATE UNIQUE INDEX CONCURRENTLY). في المقابل `operations/migrations/0045_supervisor_attendance_pilot.py` أضاف عمود `source` بـdb_index=True وقيمة افتراضية على `studentattendance` بفهرسٍ غير متزامن. التعليق في 0091 يبرّر ذلك: «الجدولان صغيران (الإنتاج: 297 خروجاً)» [تعليق]، وهذا مقبول اليوم لكنه خطر عند الحجوم الكبيرة.\n\n[تحقّق] الحماية: django-migration-linter في `quality-gate.yml:327-396` والتحقّق `makemigrations --check` في CI، والهجرات تُنفَّذ في preDeploy (`scripts/railway-predeploy.sh`: migrate ثم البذر ثم retire_past_year_records ثم collectstatic ثم provision_rls_role).\n\n[تقدير] إضافة فهرسٍ أو عمودٍ بقيمة افتراضية على جدول الحضور بعد بلوغه عشرات الملايين من الصفوف ستحتاج نافذة صيانة ما لم تُكتب بصيغة CONCURRENTLY.\n\n---\n\n## 7. النسخ الاحتياطي والاستعادة والاحتفاظ وPDPPL والتشفير\n\n[تحقّق] النسخ: `.github/workflows/backup.yml` — جدولة يوميّة (cron: 0 1 * * *، السطر 21)، مهلة 30 دقيقة، pg_dump ثم gzip ثم GPG AES-256 ثم رفع إلى R2؛ وعند غياب R2 يُرفع كأرتيفاكت GitHub بمدّة 90 يومًا (backup.yml:93-98). مدّة الاحتفاظ في R2: 400 يوم (docs/privacy/data_retention.md:36-38).\n\n[تحقّق] تمرين الاستعادة الأسبوعي: `backup-restore-test.yml` السبت 02:30 UTC بمهلة 45 دقيقة. هذا من أقوى ما في المشروع. كما توجد حاوية `Postgres-PITR` في railway.ts:131 [تحقّق] (لكن إعدادات PITR وفعاليتها [غير معلوم]).\n\n[تحقّق] المستودع عامّ (railway.ts:12)؛ النسخ مشفَّرة، لكن بديل الأرتيفاكت على GitHub يُبقي نسخةً مشفَّرة من بيانات طلاب في خدمةٍ خارجيّة؛ مفتاح GPG هو خطّ الدفاع الوحيد.\n\n[تحقّق] الاحتفاظ بالبيانات: `governance/retention.py` (والمهمة الأسبوعية `core.enforce_data_retention`) تحذف على دفعات 1000 والافتراضي `PDPPL_DATA_RETENTION_DAYS=730`، وصفر يعطّل. `docs/privacy/data_retention.md:40-77` يسرد ما يُحذف و:81-140 ما يُحتفظ به، و:85 يثبت أنّ `core_auditlog` يُحتفظ به إلى الأبد، والحضور والدرجات والسلوك كذلك.\n\n[تحقّق] التشفير: Fernet/MultiFernet (`FERNET_KEY` و`FERNET_OLD_KEYS`) في `core/models/crypto.py`، وأمر تدوير المفتاح `governance/management/commands/rotate_fernet_key.py`. نقطة ضعف: HMAC المستعمل في البحث يستعمل `FERNET_KEY` نفسه (مفتاحٌ واحد لغرضين). وفشل فكّ التشفير يُعيد النصّ المشفَّر (fail-open) بدل أن يرفع خطأ.\n\n[تحقّق] **`national_id`** (core/models/user.py:35): عمود نصّي صريح، فريد، مفهرس، وهو `USERNAME_FIELD`، بجوار `national_id_encrypted` (:160) و`national_id_hmac` (:165). كذلك `phone` (:44) نصٌّ صريح بجوار `phone_hmac` (:56). الحفظ (`save()` عند :200-215) يملأ النسخ المشفَّرة لكنه لا يُفرغ النصّ الصريح. وسياسة الخصوصية نفسها تعترف («ونعمل على استكمال تشفير الرقم الشخصيّ والجوّال» — docs/privacy/privacy_notice_ar.md:33-47). إذن التشفير غير مكتمل ولا يحمي من تسرّب قاعدة البيانات. هذا أخطر ما في المحور.\n\n[تحقّق] `EncryptedTextField` (core/fields.py) يفكّ التشفير صفًّا بصفّ؛ في التصدير يضاعف الزمن مع عدد الصفوف.\n\n[تحقّق] النقل عبر الحدود: خدمات الإنتاج كلّها في `us-west2` (DEPLOYMENT-RAILWAY.md:168) والإقليم `sjc` ثابت (railway.ts:14). الإشعار (privacy_notice_ar.md:33-36) يقرّ بالنقل إلى الخارج وفيه عناصر نائبة `[يُحدَّث ...]` لم تُستكمل. هذا مخاطرة امتثال لقانون 13 لسنة 2016 [تقدير قانوني؛ التقييم النهائي للمستشار القانوني].\n\n[تحقّق] عزل المستأجر: `docs/privacy/tenant_isolation_audit_2026-10-05.md` موجود.\n\n---\n\n## 8. المراقبة والسجلّات\n\n[تحقّق] Sentry (core/sentry_config.py:136-165): معدّل تتبّع 0.3 لـCelery و0.15 للـAPI و0.1 لغيرها، `profiles_sample_rate` 0.1 (production.py:87)، `send_default_pii=False` و`before_send`. [غير معلوم] DSN الفعلي وحصّة الأحداث.\n\n[تحقّق] نقاط الصحّة: `/health/` تفحص DB والكاش والملفات الثابتة، و`/ready/` تفحص DB فقط (core/views_health.py)، و`/status/` داخلية فقط. فحص Railway على `/health/` بمهلة 100 ثانية (railway.ts:104-105).\n\n[تحقّق] طبقات إضافية: لوحة القيادة QCC (command_center/collectors/database.py: الاتصالات وأطول استعلام والحجم)، Sentry Uptime، `monitor.yml` كلّ 15 دقيقة (ثانوي)، `worker-heartbeat.yml`، وdjango_prometheus (وسيطان PrometheusBefore/After).\n\n[تحقّق] `/metrics` ملفوفة بـ`internal_only(staff_member_required(...))` (shschool/urls.py:84-88) فلن يستطيع كاشطٌ بلا جلسة staff الوصول [تقدير]. وقائمة `METRICS_ALLOWED_IPS` (production.py:44).\n\n[تحقّق] السجلّات: نصّية مع `PIIMaskingFilter`، ومعالجات ملفّات على حاويات مؤقتة؛ بلا معرّف ارتباط للطلب (لم أجد request-id)، والسجلّات المنظَّمة JSON وثيقة فقط (`docs/monitoring/structured-logging.md`).\n\n[تحقّق] تحديد المعدّل: `@ratelimit` على عروض المصادقة فقط وعلى `operations/api_views.py:22`. الخنق العامّ في DRF: 30 في الدقيقة للمجهول و120 للمستخدم (base.py:386). النطاقات `login` و`burst` و`sensitive` معرَّفة لكن لا يُستعمل `throttle_scope` في أيّ مكان. و`RATELIMIT_FAIL_OPEN=True` (base.py:830) فعند تعطّل Redis يتوقف تحديد المعدّل. نظام axes (base.py:527) يحمي الدخول. إعدادات nginx (5r/m للدخول و60r/m للـAPI) تخصّ مسار docker-compose لا Railway.\n\n---\n\n## 9. قابلية التوسّع (100 مدرسة وعشرات آلاف الطلاب)\n\nأرقام النطاق الواردة في الشيفرة [تعليق]: 176 حصة يوميًّا و845 حصة قديمة (schedule_sessions.py)، و735 طالبًا مسجَّلًا و881 عضوية (student_affairs/views.py ~310)، و297 خروجًا (هجرة 0091). هي مدرسة واحدة فقط.\n\n1. عائق المستأجر: `app_rls_school()` يقرأ `app_rls_role_school` بحسب `session_user`؛ الهجرة 0037 تبذر دور `shschool_app` الوحيد فقط حين يكون عدد صفوف `core_school` يساوي 1 (:73-79). و`school_rls_scope` (core/celery_tasks.py:72-107) يؤكّد المستأجر مقابل الدور ويرفع ValueError لمدرسةٍ غريبة (:89-104). النتيجة [تحقّق]: دورٌ واحد = مدرسة واحدة؛ ومهامّ كثيرة تدور على كلّ المدارس بـ`school_rls_scope(school.id)` فتفشل مع أكثر من مدرسة (بعضها فيه try/except لكلّ مدرسة). `core_school` نفسه بلا `school_id` فلا RLS عليه. للتوسّع لمئة مدرسة: إمّا قاعدة/نشر لكلّ مدرسة (تكلفة تشغيل) أو إعادة تصميم RLS إلى متغيّر جلسة لكلّ معاملة.\n2. الاتصالات: `CONN_MAX_AGE=0` (production.py:23) رغم أنّ base.py:189-206 ضبط 600 مع فحوص صحّة (يُلغيه الإنتاج). لا pgbouncer. [تقدير] كلفة تأسيس اتصال TLS إلى Postgres في كلّ طلب، وحدّ اتصالات Postgres سيُستنفد مبكّرًا مع عدّة نسخ.\n3. RLS في كلّ طلب: `core/middleware_rls.py:55-70` يستدعي `set_config` مرّتين (ضبط وإعادة). والجلسة في DB (`USE_REDIS_SESSIONS=False`، production.py:198-199) فكلّ طلب مصادَق يقرأ جدول الجلسات؛ الكتابة محدودة بتحديث كلّ 5 دقائق (`SESSION_SAVE_EVERY_REQUEST=False`، production.py:163، ونبض session-guard.js).\n4. عمليّة واحدة: daphne بعمليّةٍ واحدة بلا gunicorn (Procfile:1، scripts/railway-release.sh:44). عروض Django المتزامنة تعمل تحت `sync_to_async` بخيطٍ حسّاسٍ موحَّد فتُسلسَل [تقدير مبنيّ على معرفة المكتبة وتعليق في production.py؛ لم يُقَس]. أي تصدير متزامن من 8-20 ثانية [تعليق] يحجب بقية المستخدمين على تلك النسخة.\n5. Redis واحد للكاش والوسيط والنتائج وطبقة القنوات (السعة 1500 والانتهاء 30 ثانية — base.py:153,168) والخنق (REDIS_URL واحد؛ production.py:177). سياسة الإخلاء [غير معلوم]؛ إخلاء خاطئ قد يحذف رسائل الوسيط.\n6. WebSocket: `notifications/consumers.py:30+` — كلّ اتصال يجري فحص سياسة الجلسة وبحث المدرسة وعدّ غير المقروء؛ مع احتياطي استطلاع كلّ 30 ثانية (static/js/base.js:285-305). [تقدير] عاصفة اتصالات صباح الأحد؛ لم تُقَس.\n7. الملفات المرفوعة: التخزين الافتراضي `core.db_storage.DatabaseStorage` (base.py:320) يخزّن الملفات كـBinaryField في Postgres (`core/models/stored_file.py`)؛ الإنتاج يشترط S3 (production.py:404). وحدّ الرفع 5MB (base.py:564-565). لكن `railway.ts` لا يسرد متغيّرات `AWS_*` وقاعدته (أسطر 10-13) تعدّ غير المذكور هدف حذف عند `apply` — خطر تشغيلي عند أول `apply`.\n8. حجم الحضور [تقدير]: بافتراض نحو 5 آلاف صفّ يوميًّا لكلّ مدرسة (مشتقّ من 176 حصة و735 طالبًا)، فمئة مدرسة تعني نحو تسعين مليون صفّ سنويًّا. بلا تقسيم أو أرشفة، وبمفاتيح UUID v4، ستحتاج صيانةً مبكّرة. الرقم تقريبيّ وغير مقيس.\n9. الكاش المحلي: غياب REDIS_URL يعيد `locmem` بصمت (production.py:180-188).\n10. زمن الوصول: الاستضافة في us-west2 [تقدير] تضيف زمن ذهاب وإياب كبيرًا من قطر؛ لم يُقَس. تزيده `CONN_MAX_AGE=0` بإعادة المصافحة.\n\n---\n\n## تحليل SWOT\n\n### نقاط القوّة (Strengths)\n\n1. عزل المستأجر على مستوى قاعدة البيانات (RLS) مع تأكيد في Celery وحارس إقلاع يرفض دور superuser — core/migrations/0037:73-79، core/celery_tasks.py:89-104، scripts/railway-release.sh:24-47.\n2. نسخ احتياطي يومي مشفَّر GPG مع تمرين استعادة أسبوعي مؤتمت — .github/workflows/backup.yml:21، backup-restore-test.yml.\n3. فهرسة مدروسة لجداول الحضور بما فيها فهرس جزئي وقيد فريد، وبناء CONCURRENTLY في موضعين — operations/models/attendance.py:305-314، operations/migrations/0055 و0092.\n4. حماية من العواصف في الكاش الحيّ بقفل cache.add ومفاتيح مفصولة بالمدرسة — operations/day_selectors.py:470-498، operations/services/class_grid_live.py:50-73.\n5. آلية تصدير مركزيّة بحدود نشاط وإزالة تكرار ومهلة وتنظيف — core/exports/services.py، registry.py، timeouts.py.\n6. مراقبة متعدّدة الطبقات: Sentry بقواعد عيّنات، /health و/ready، QCC، Uptime، نبض العامل — core/sentry_config.py:136-165، core/views_health.py، .github/workflows/monitor.yml.\n7. سياسة احتفاظ بيانات PDPPL منفَّذة بمهمة أسبوعية على دفعات مع توثيق صريح لما يُحذف وما لا يُحذف — governance/retention.py، docs/privacy/data_retention.md:40-140.\n8. بنية تشفير قابلة للتدوير (MultiFernet) مع أمر تدوير موثَّق — core/models/crypto.py، governance/management/commands/rotate_fernet_key.py.\n9. حواجز جودة الهجرات في CI (migration-linter وmakemigrations --check) — quality-gate.yml:327-396.\n10. بنية نشر كشيفرة (IaC) تفصل الويب والعامل وBeat بمتغيّرات مفصَّلة لكلّ خدمة وفحص صحّة — .railway/railway.ts:97-126.\n\n### نقاط الضعف (Weaknesses)\n\n1. national_id وphone نصٌّ صريح بجوار المشفَّر، والبحث بـicontains بلا فهرس — core/models/user.py:35,44,160,165؛ core/privacy.py:62-73.\n2. التصميم عمليًّا مدرسة واحدة لكلّ دور DB — core/migrations/0037:73-79؛ core/celery_tasks.py:89-104.\n3. الوضع الافتراضي لـCelery متزامن ويبتلع الاستثناءات — production.py:210,234,238.\n4. أغلب التصدير (نحو 35 عرضًا) متزامن ويحجب الخيط الوحيد — student_affairs/views.py:487,1389؛ مقابل ستة أنواع فقط مسجَّلة.\n5. إعادة احتساب الصفّ كاملًا متزامنة وبحلقة حفظ لكلّ طالب — assessments/services.py:562-602؛ assessments/views.py:690-701.\n6. CONN_MAX_AGE=0 بلا pgbouncer، مع RLS يضيف استدعاءين لكلّ طلب — production.py:23؛ core/middleware_rls.py:55-70.\n7. كتابة AuditLog متزامنة في كلّ حفظ مع exists() سابق — core/signals.py:19؛ core/models/audit.py:246-250.\n8. مُصالِح التسليم غير مجدول وسقف المحاولات ثلاث — notifications/tasks.py:1320 و:239.\n9. حدود الزمن متناقضة بين celery.py:172-173 (300/600) وproduction.py:228 (300) وحدّ التوليد 3600 — operations/scheduler_v2/limits.py:18-19.\n10. بلا معرّف ارتباط للطلب ولا سجلّات JSON، و/metrics خلف مصادقة staff، ونطاقات الخنق الثلاثة غير مستعملة — shschool/urls.py:84-88؛ base.py:386.\n\n### الفرص (Opportunities)\n\n1. ترحيل التصدير الثقيل إلى بنية job الموجودة بإضافة أنواعٍ إلى السجلّ — core/exports/registry.py.\n2. تفعيل CELERY_ASYNC_ENABLED وتقسيم الطوابير (توليد الجداول، الإشعارات، التصدير) — scripts/railway-worker.sh:36؛ production.py:210.\n3. تقسيم جدولي الحضور والتدقيق بحسب الشهر أو السنة الدراسية وإسقاط الأقسام القديمة بدل DELETE — governance/retention.py؛ docs/privacy/data_retention.md:85.\n4. خفض عدد الاستعلامات في اللوحات بتجميع aggregate(Count(filter=...)) — core/dashboard_selectors.py:143-187 و360-410.\n5. تفعيل الجلسات في Redis (USE_REDIS_SESSIONS) أو الكاش المدعوم بالقاعدة لتخفيف قراءات DB — production.py:198-199.\n6. جدولة المُصالِح وإضافة طابور إعادة محاولة متأخّر — notifications/tasks.py:1320.\n7. استكمال تشفير الحقول الحسّاسة وحذف النصوص الصريحة، مع مفتاح HMAC مستقلّ — core/models/user.py:160-215؛ docs/privacy/privacy_notice_ar.md:33-47.\n8. تحويل السجلّات إلى JSON وإضافة request-id ليتكامل مع Sentry — docs/monitoring/structured-logging.md.\n9. فصل هجرات roadmap عن سلسلة هجرات المنتج وضغط الهجرات القديمة (squash) — roadmap/migrations (82 ملفًّا).\n10. الاستفادة من حاوية PITR الموجودة لتوثيق هدفَي الاستعادة (RPO وRTO) وتمرينهما — .railway/railway.ts:131.\n\n### التهديدات (Threats)\n\n1. تسرّب قاعدة البيانات يكشف الرقم الشخصي والهاتف نصًّا صريحًا — core/models/user.py:35,44.\n2. مخالفة PDPPL: الاستضافة في us-west2 مع إشعار خصوصية بعناصر نائبة — DEPLOYMENT-RAILWAY.md:168؛ privacy_notice_ar.md:33-36.\n3. عند أول مدرسة ثانية يفشل بذر الدور (0037) ومهامّ الحلقة على المدارس — core/migrations/0037:73-79؛ core/celery_tasks.py:89-104.\n4. railway الشجرة المحلية المتباعدة عن origin). أبرز ما فيه: فحص الاعتماد يعدّ أي سطر يحمل البطاقة والرأس موافقة حتى لو نصّه رفض (جُرّب فمرّ)، والدفتر يُلحق بلا قفل ولا fsync، ومفتاح إيقاف المضخّة يقرؤه الخطاف وحده لا المضخّة نفسها فتدور من مشغّلات أخرى رغم التجميد، و22 وحدة بلا اختبار ولا CI. لم يُرصد أثر لهذه الدورات على GitHub بعد التجميد.\n- زمن الاستعادة (MTTR) ونسبة فشل التغيير لا تُحسب مباشرة لغياب طوابع الحوادث؛ استُعملت بدائل مسمّاة.\n- الدفتر يبدأ في 28 سبتمبر، فالمتاح أربعة أسابيع لا ستّة.\n\n## الأرقام المقيسة\n| المؤشّر | القيمة |\n|---|---|\n| البطاقات في الدفتر | 637: منشورة 457 (71.7%)، مغلقة 70، ملتقَطة 46، موجَّهة 22، جاهزة للمعاينة 13، مدموجة غير منشورة 10، مؤجَّلة 6، معتمَدة 5، قيد العمل 3 |\n| الدمج على main | 685 في 30 يوماً (نحو 22.8 يومياً)، وسيط فتح الطلب إلى الدمج 1.83 ساعة (المئين 85: 9.5) |\n| زمن الدورة الكامل (التقاط إلى نشر) | وسيط 20.6 ساعة، المئين 85: 212.9 ساعة |\n| أطول مرحلة | موجَّهة إلى قيد العمل: المئين 85 نحو 236 ساعة؛ والتقاط إلى توجيه: المئين 85 نحو 72 ساعة |\n| الرؤوس المعتمَدة لكلّ بطاقة | 1.53 وسيط 1، و28.1% من البطاقات بأكثر من رأس؛ إعادة العمل 11% |\n| أسئلة المالك | 1,318 في 14 يوماً (نحو 94 يومياً)؛ تفويض D-443م 74 صفّاً (5.2%) مقابل 745 إقراراً مباشراً |\n| المضخّة | 146 تشغيلاً بلا خطأ في 48 ساعة، أثرها نحو 28 دفعاً و38 دمجاً و31 نشراً |\n| حمل الرسائل | 0101 عند 206 من 300 في 16:38 (نحو 19 في الساعة) |\n| الانتهاكات المسجَّلة | 92 (91 في أكتوبر): الأكثر مسار بلاغ المالك واللغة العربية والإبلاغ في حينه |\n| النشر | يدوي خارج Actions منذ 18 سبتمبر، التراجع لم يُجرَّب، تأخّر الإنتاج عن main بين 6.5 و13.7 ساعة |\n\n## الخلاصة التنفيذية\nالفلو يملك أساساً نادراً: دفتر واحد بآلة حالات تُفرض في الشيفرة، واعتماد مربوط بالرأس مع إعفاءات تُتحقَّق آلياً، وأثر حرفي لقول المالك، ومضخّة تنقل البطاقة آلياً من المصدر بدل الرسائل. النضج الإجمالي 3 من 5 على سلّم CMMI: تعريف العملية 4، وإنفاذ الحوكمة وفصل المهامّ 2 إلى 2.5. وأكبر مشكلة أنّ الإنفاذ متأخّر عن التعريف، وأنّ القيد الحقيقي في المقدّمة (الالتقاط والتوجيه) لا في المؤخّرة (الدفع والدمج).\n\n## المخاطر الأعلى\n1. **الإنفاذ متأخّر عن التعريف.** نحو 72% من القرارات الحديثة التزام يدوي، وأربعة مفاتيح مكتوبة مطفأة بالافتراض (premerge وprepush وPR المفتوحة وحدّ الأدوار) والتوصية بتفعيلها تتكرّر منذ 17 أكتوبر.\n2. **فصل المهامّ إداري لا تقني.** حساب GitHub واحد، وحقل «من» نصّ حرّ، ولا CODEOWNERS ولا مراجعات مطلوبة؛ الحارس الفعلي للدمج بالرأس في أداة 0601 لا في المستودع.\n3. **نقطة الفشل الواحدة صارت 0101.** 501 حدث في 7 أيام مقابل 234 لـ0501 و222 لـ0601، والمضخّة توقّع باسمها، وهي نافذة المالك الوحيدة.\n4. **القيد في المقدّمة.** 104 بطاقات مفتوحة، 45 ملتقَطة و40 بلا حامل، مقابل WIP متوقَّع بقانون ليتل بين 3 و7؛ والمئين 90 لدفع المعتمَد ثمّ دمجه نحو ساعتين ونصف فقط.\n5. **إعادة الاعتماد المزمنة.** 28% من البطاقات برأسين أو أكثر، والجذر أنّ «جاهز للمعاينة» يُعلَن قبل اكتمال الفحوص، فيتكرّر الاعتماد بعد الإصلاح.\n6. **إدارة تغيير القواعد مخروقة.** ست مسوّدات إصدار غير مبلَّغة منذ 2 أكتوبر، ورقمان مكرّران، ولا إصدار مرقّم منذ 14 أكتوبر رغم قرارات جوهرية جديدة؛ والوثائق الحيّة متخلّفة عن القرارات (مثل صيغة «الدمج لـ0601 وحدها» بعد توسيعها).\n7. **اعتماد على نموذج واحد.** كلّ الأدوار تعمل بنموذج واحد فلا مراجع مستقلّ غير CI، مع ضغط سياق جلسة 0101 وزحف التفويض، وأتمتة بلا مالك تشغيلي (المهامّ المجدولة معطّلة إلّا واحدة).\n8. **النشر اليدوي.** الإنتاج متأخّر عن main والتراجع لم يُجرَّب، وتوقّف Railway الحالي يعطّل كلّ ما بعد الدمج.\n9. **عبء المالك.** نحو 94 سؤالاً يومياً، ثلثاها يصل إلى 0101، مع ذروة 136 في يوم واحد.\n\n## أهمّ نقاط القوّة\n- دفتر وآلة حالات مفروضة بالشيفرة، فلا قفز فوق مراحل.\n- اعتماد مربوط بالرأس (D-146م) وإعفاءات تُتحقَّق آلياً (D-154م وD-155م وD-451م) وأثر مالك حرفي وحارس أصل (D-422م).\n- مضخّة تدفّق تستبدل الرسائل بقراءة المصدر، ورصد دوري (pr_watch وwake_monitor وdigest).\n- إيقاع تسليم عالٍ: نحو 23 دمجاً يومياً، ووسيط الطلب ساعتان تقريباً.\n- تقييم ذاتي دوري صادق يكشف العيوب بدل إخفائها.\n\n## أولويات العمل المقترحة (مرتّبة بالأثر ثمّ الجهد)\n| # | الإجراء | الجهد | الأثر |\n|---|---|---|---|\n| 1 | تفعيل المفاتيح الأربعة المطفأة (premerge وprepush وPR المفتوحة وحدّ الأدوار) | ساعات، بلا قرار مالك | عالٍ جداً |\n| 2 | حدّ WIP على الملتقَط والموجَّه (15 بلا حامل كحدّ أقصى) وتأجيل آلي للراكد | يوم | عالٍ |\n| 3 | فصل الهويّات: حساب أو GitHub App لكلّ دور نواة، وCODEOWNERS، ومراجعة مطلوبة | أيام وقرار مالك | عالٍ (أمن وفصل مهامّ) |\n| 4 | مطابقة sha8 في بوّابة الدمج الآلي كمهمّة CI مطلوبة | يوم | عالٍ |\n| 5 | سجلّ تفويضات واحد يولّد الوثائق ويحلّ تعارض D-443م مع D-366م وD-367م | يومان | متوسّط |\n| 6 | استئناف إصدارات الفلو المرقّمة بحارس lint | يوم | متوسّط |\n| 7 | تخفيف نقطة الفشل 0101: مضخّة بهويّة مستقلّة وتفويض الخفيف المنخفض لـ0501 | أيام | عالٍ |\n| 8 | قياس نسبة فشل التغيير وزمن الاستعادة بطوابع حوادث | يومان | متوسّط |\n| 9 | حارس الزمن في الاختبارات لإنهاء سقّاطة الساعة المتكرّرة | يوم | متوسّط |\n| 10 | تقرير ما بعد الحادث لحوادث أكتوبر مع حارس لكلّ حادث؛ وتجربة تراجع Railway | أيام | متوسّط |\n\n---\n# الملحق أ — تصميم العملية والحوكمة (محلّل مستقلّ، مفصَّل كما سُلِّم)\n# تقييم تصميم العمليّة والحوكمة في «الفلو المؤتمت» لمنظومة تسليم SchoolOS\n\nالتاريخ: 2026-10-21 (الدوحة). الطبيعة: قراءةٌ فقط، لا تعديل. المنظور: هندسة العمليّات والحوكمة (ITIL 4، ISO/IEC 20000، DevOps/DORA، تدفّق Lean/SAFe، نظريّة القيود، ISO 9001) وتصميم المنظومات متعدّدة الوكلاء.\n\nالمصادر المقروءة فعلاً: `operating_model.md`، `docs/tab_charters.md`، `projects/schoolos/tabs.json` (session_policy كاملةً)، `role_cards/*.md` و`role_cards/details/*.md`، `skills/maestro-*/SKILL.md` (intake، incident، spawn، load-check، approvals)، `decisions.md` مع `ledger/decisions_meta.jsonl`، `flow_changelog.md`، `violations.md`، `owner_confirmations.md` (البنية لا الأسماء)، `docs/approvals_policy.md`، `tools/` (ledger.py، approval_check.py، flow_pump.py وجرد الأدوات)، `ledger/events.jsonl` (8425 حدثاً، 637 بطاقة، قياسٌ مباشر اليوم)، `digest/latest.md`، `board_state.md`، تقارير 0102/0103: تقييم 8 ساعات (10-20)، سقّاطات التكويد (10-20)، SWOT المكوَّد (10-17)، اختناقات الفلو (10-16) وردود 0501/0702 عليها، تدقيق الأتمتة (10-18)، مراجعة المواثيق (10-18)، عصف خفض الجلسات (10-18)، تدقيق ادّعاءات المايسترو، بيانات الحِمل (10-20)، مذكّرة تسليم 0101 الخفيفة (10-20).\n\nوسمُ الأدلّة: «مقروء» = من ملفّ أو أداة بسطرٍ أو رقم قرار؛ «مقيس» = حسبتُه اليوم من الدفتر؛ «استنتاج» = حكمي.\n\n---\n\n## 0) الحكم في عشرة أسطر\n\n1. المنظومة تملك ما تفتقر إليه أغلب فرق البشر: دفترٌ واحدٌ مصدرُ الحقيقة بآلة حالاتٍ مفروضةٍ في الكود (ledger.py)، واعتمادٌ مربوطٌ برأس الإيداع (D-146م)، وسجلّ قراراتٍ مرقَّم (452 قراراً في 25 يوماً)، وأثرُ مالكٍ حرفيّ (owner_confirmations.md)، وتقييمٌ ذاتيٌّ دوريٌّ صريحٌ وصادق.\n2. لكنّ نحو 72% من القرارات الحديثة التزامٌ يدويّ بلا أثرٍ آليّ (سقّاطات 10-20 §5)، وأربع سقّاطاتٍ مكتوبةٍ تعمل «في الظلّ» إنذاراً لا منعاً (PREMERGE/PREPUSH/OPEN_PR/ROLE_WIP).\n3. الفصلُ بين المهامّ (SoD) مكتوبٌ لا مفروض: حسابُ GitHub واحدٌ لكلّ الجلسات (operating_model.md:81)، ولا CODEOWNERS ولا مراجعاتٌ مطلوبة، وحقلُ `--by` في الدفتر نصٌّ حرّ (سقّاطات §3).\n4. التدفّق اليوم يحرّكه 0101 الخفيفة ومضخّة flow_pump: في آخر 7 أيّام سجّلت 0101 وحدها 501 حدثاً مقابل 234 لـ0501 و222 لـ0601 (مقيس)، أي أنّ نقطةَ الفشل الواحدة انتقلت من المالك إلى 0101.\n5. إعادةُ الاعتماد مزمنة: 266 حدثَ «approved» مقابل 196 «ready_for_review» في 7 أيّام (نسبة 1.36، مقيس)، و33% تاريخيّاً (97/290 في 10-16).\n6. الالتقاطُ والتوجيه هما الذيلُ الطويل: 104 بطاقات مفتوحة منها 45 captured و22 routed و40 بلا حامل (مقيس اليوم)، ووسيط «التقاط ← جاهز» 72.7 ساعة (10-16).\n7. إدارةُ تغيير القواعد نفسها متعثّرة: سجلّ الفلو أُعيد بناؤه بعد ثلاث تغييراتٍ في ثلاث ساعات (flow_changelog.md:2)، وإصدارٌ أُبلغ قبل كتابته (v2.10)، وستّة إصداراتٍ «مسوّدة لم تُبلَّغ بعد» (v2.20–v2.25)، ورقمان مكرّران (v2.14 وv2.27).\n8. تكلفةُ التنسيق ضُبطت بالسقوف (300 رسالة، 10 رسائل متتالية، 1000 حرف، إيقاظ ≤20، تزامن 2) لا بتقليل الحاجة إلى الرسائل؛ وflow_pump أوّلُ خطوةٍ صحيحة في الاتّجاه الثاني.\n9. الحوكمةُ تُنتج وثائقَ أكثر ممّا تُنتج حرّاساً: 0301 تملك سجلّ مخالفاتٍ غلبت عليه مخالفاتُ اللغة، بينما خروقاتُ الفلو الجوهريّة (دمجٌ في نافذةٍ ممنوعة، تسجيلٌ بعد الفعل) تُكتشف في تقارير التقييم لا في السجلّ.\n10. النضجُ الإجماليّ: المستوى 3 (مُعرَّف) مع جيوبٍ من 4 (الدفتر والقياس) وجيوبٍ من 2 (الإنفاذ، السعة، إدارة التغيير). الطريقُ إلى 4 قصير وتقنيّ: تشغيلُ ما كُتب، وفصلُ الهويّات، ووضعُ حدّ WIP حقيقيّ على الالتقاط.\n\n---\n\n## 1) خريطةُ العمليّة من الالتقاط إلى النشر\n\n### 1.1 الرسم النصّي\n\n```\n[المالك] ──قول──▶ (02 التقاط) ──بطاقة──▶ (03 مواصفة/توجيه) ──spawn/إسناد──▶ (04 تنفيذ في شجرة)\n   │                   0101 الخفيفة            0101 (ميثاق 0301 المدمَج)         04SS (≤10 جلسات)\n   │                   ledger.py add            ledger.py spec --tier             إيداع محلّي، make prepush\n   │                   حارس الأصل D-422م        بوّابة المنطق + سؤال الصفر         لا دفع قبل الاعتماد\n   │                                                                                  │\n   │                                                                          «جاهزٌ للمعاينة» + الرأس\n   │                                                                                  ▼\n   │        (05ب أدلّة) ◀──────────────────────────────────── (05أ تثبيت على 8500)\n   │         0502: حزمة أدلّة/لقطات/حسابات دور                  0501: preview.sh pin (≤30 د)\n   │         visual_gate (رمز 4 إن غابت)                         نافذتا 15:30/20:30\n   │                                                                                  │\n   ▼                                                                                  ▼\n[اعتماد] ◀── (إمّا المالك في نافذة المراجعة  أو 0101 بتكليف D-443م بعد مراجعة الفرق)\n   │           record_owner_confirmation --head ؛ ledger move approved --head --note\n   │           إيداعٌ جديد = إبطال (D-146م) إلّا waive-head (D-154م/D-155م/D-451م)\n   ▼\n(06أ دفع) ──▶ (06ب طلب دمج) ──▶ (06ج دمج) ──▶ (06د نشر) ──▶ (07 خارطة/قياس/أرشفة)\n push_approved     gh pr create (0601)     gh pr merge --auto     Railway بعد الدمج      0701: roadmap، flow_metrics\n فرع claude/*      سطر الاعتماد بالرأس     طابور main + CI         دفعتان 14:30/1 # 2.1 الأدوار الرسميّة اليوم (tabs.json بعد إعادة ترقيم 2026-10-21 14:02)\n\nالنواة 8: 0101 التوجيه والاعتماد (الخفيفة)، 0201 الرصد والتقييم (الثقيلة)، 0301 الحوكمة (كانت 0103 ودُمج فيها 0102)، 0104 الأمان (مؤرشفة 10-20 بحسب مذكّرة التسليم رغم بقائها في core_sessions)، 0501 المعاينة والاعتماد، 0502 الأدلّة، 0601 الإصدار، 0701 الجودة (دُمج فيها 0702). وإلى جانبها 0703 «معاون 2» بلا ميثاق، لا يراها session_directory ولا wake_monitor (role_cards/0703.md l.26).\n\n### 2.2 مصفوفة RACI المكتوبة مقابل المصفوفة الفعليّة\n\n| النشاط | المكتوب (operating_model.md l.46-55 + المواثيق) | الفعليّ (الدفتر 7 أيّام، مقيس) | ملاحظة |\n|---|---|---|---|\n| الالتقاط | R: 0101 الخفيفة؛ A: المالك | 0101 (190 routed في 7 أيّام) | متّسق |\n| المواصفة والتسمية | R: 0101 (ميثاق 0301 المدمَج)؛ C: 0301 الحوكمة | 0101 و0301 الحوكمة (held_by 7 بطاقات) | تداخل: الحوكمة تحمل بطاقات تنفيذ خارج اختصاصها (23 بطاقة عند 0103 يوم 10-20) |\n| الاعتماد | A: المالك؛ R: 0501 تسجّل؛ 0101 بتكليف D-443م | 266 حدث approved: 0101 الغالب اليوم (digest 13:47-15:53 كلّها 0101) | انتقل العبء من المالك إلى 0101 دون تعديل RACI المكتوب |\n| الدفع | R: الجلسة المنفّذة فور الاعتماد (D-429م) | flow_pump باسم 0101 (SENDER = \"0101\") | المنفّذ لم يعد يدفع فعليّاً؛ الدور الكتابيّ قديم |\n| فتح الطلب والدمج | R: 0601 وحدها (D-88م، D-321م) | flow_pump (0101) تدمج بـ--auto؛ 0601 تدمج الهجرات والمستثنى | تناقض نصّي مع D-88م؛ D-450م وسّع فعليّاً، وCOMMON.md l.43 ما زال يقول «0601 وحدَها» |\n| النشر | R: 0601؛ A: المالك في النافذة | Railway آليّ؛ 0601 متابعة | متّسق |\n| الحادث S1 | A: المالك؛ R: 0101 قيادة؛ 0601 رجوع | مهارة maestro-incident | متّسق |\n| تغيير القواعد | A: المالك؛ R: 0101 يقترح ويسجّل؛ C: 0301 خلال ساعتين بعد التسجيل | القرارات تُسجَّل عند 0702/0201 (D-445م «لم يوثَّق بعد عند 0702») | المراجعة بعد التسجيل لا قبله: الحوكمة تلحق لا تحرس |\n\n### 2.3 الوضوح والتداخل\n\n- وضوحٌ جيّد في الحدود السلبيّة («ما لا أفعله») لكلّ بطاقة دور، وهي أقوى من الحدود الإيجابيّة. مثال: 0104 قارئٌ لا كاتب (D-101م)، 0502 تجهّز ولا تعت قراراً/40 د) ولم تُحدَّث منذ D-443م الذي غيّر طبيعة قراراته.\n\n### 2.6 التفويضات وحدودها\n\nسلسلة التفويض تذبذبت: منح 0501 الاعتماد (D-316م) ثمّ سُحب (D-319م/D-320م)؛ منح 0601 الدمج الآليّ ثمّ سُحب (D-321م/D-322م)؛ ثمّ تفويض 0101 الخفيفة (D-366م بنطاقٍ ومدّة) ثمّ توسيعه الدائم (D-442م/D-443م) الذي تعارض نصّاً مع D-367م (مراجعة الحوكمة 10-18 §تعارض). الاستثناءات المكتوبة في D-443م واضحة (حذف نهائيّ، مال، صلاحيّات التطبيق، الملفّات الحاكمة، هجرات، أمن)، لكن لا يحرسها كود: الملفّات الحاكمة تُرفض في waive-head فقط (ledger.py:1210-1252) لا في approval نفسه.\n\n---\n\n## 3) الحوكمة\n\n### 3.1 سلسلة الاعتماد\n\nأربعة مصادر للاعتماد بترتيبٍ محدَّد (approval_check.py رأس الملف): حالة الدفتر، أحداث approval، سطر الوصف، owner_confirmations.md. قوّة التصميم أنّ التحقّق «من المصدر لا من سؤال المالك أو الجلسات» (أمر المالك 10-02). ضعفه أنّ المصدر الثالث (سطر الوصف) لا يُطابَق آليّاً مع رأس الطلب في CI (auto_merge_gate يتحقّق من الشكل والتاريخ فقط، سقّاطات §3)، وأنّ المصدر الأوّل يقبل `--by` نصّاً حرّاً.\n\n### 3.2 فصل المهامّ\n\nالمكتوب: المنفّذ لا يدفع قبل الاعتماد ولا يفتح طلباً؛ المراجع الأمنيّ لا يعتمد؛ من يدفع لا يراجع (0104 في عصف 10-18). المفروض: حارس git محلّيّ (guard_git.py) يتجاوزه GUARD_GIT_ALLOW؛ وحماية main على GitHub بلا مراجعاتٍ مطلوبة ولا CODEOWNERS؛ والحساب واحد. بمعايير ISO 27001 (A.5.3 فصل الواجبات)، هذا ضابطٌ إداريٌّ لا تقنيّ: يمنع الخطأ غير المقصود ولا يمنع الالتفاف. ومع نموذج LLM واحدٍ يشغّل كلّ الأدوار، فإنّ «المراجع المستقلّ» هو النموذج نفسه بسياقٍ مختلف؛ الاستقلال الحقيقيّ الوحيد هو المالك وCI.\n\n### 3.3 أثر التدقيق\n\nقويّ: 8425 حدثاً بطابعٍ زمنيٍّ وفاعل؛ 330 قراراً بمواقع تسجيل في decisions_meta.jsonl؛ اقتباساتٌ حرفيّةٌ من المالك (D-110م). ثغرتان: (1) 151 حدثاً في 7 أيّام بفاعل «غير مُعلَن» و1583 بلا حقل by في data (مقيس) تضعف نسبة الأثر إلى الفاعل؛ (2) التسجيل بعد الفعل: تقييم 8 ساعات وثّق «إذناً سُجّل بعد الدمج» و«دفعةً سُجّلت 12:10 متأخّرة 4 ساعات»، وflow_unannounced يعدّ ولا يمنع.\n\n### 3.4 الوثائق الحيّة\n\nالمولَّد من tabs.json (role_cards، tab_charters، INDEX) مبدأٌ صحيح (مصدرٌ واحد)، لكنّ tab_charters.md ما زال يحمل أرقام ما قبل إعادة الترقيم (0103، 0102، 0702 كمواثيق مستقلّة)، وboard_state.md «آخر تحديث 2026-09-29» (l.6) بينما قسمه الآليّ 10-09؛ وCOMMON.md l.43 يخالف D-450م. أي أنّ «فجوة CLAUDE.md عن الفلو = 0» (هدف 0301 الثالث) غير متحقّق فعليّاً.\n\n### 3.5 إدارة تغيير القواعد\n\nقواعد التغيير الأربع في flow_changelog.md §قواعد التغيير سليمة (قرارٌ مسجَّل، سطرٌ، رقم، صيغةٌ واحدة، استثناءٌ بتاريخ انتهاء). التطبيق متعثّر: v2.10 أُبلغ قبل كتابته؛ v2.20–v2.25 «مسوّدة لم تُبلَّغ بعد» منذ 10-02؛ v2.14 وv2.27 مكرّران؛ آخر إصدارٍ مرقَّم 10-14 بينما صدرت بعده قراراتٌ هيكليّة (D-443م، D-446م–D-452م، إعادة الترقيم) بلا رقم إصدار. بمقياس ITIL 4 (Change Enablement) هذا «تغييرٌ قياسيٌّ بلا CAB فعليّ»: المالك يقرّر، 0301 تراجع خلال ساعتين بعد التسجيل، ولا أحدَ يملك حقّ الاعتراض قبل السريان.\n\n### 3.6 أنماط المخالفات\n\nviolations.md (172 سطراً) يغلب عليه نوعٌ واحد: «العربيّة وحدها» (قياس lang_audit لخمس جلسات 26/24/18/16/56 مخالفة). المخالفات الجوهريّة للفلو موثَّقة في تقارير التقييم لا في السجلّ: دمج 41 و47 بنصّ بطاقةٍ قديم (10-18)، قفزتان إلى pushed بلا ready_for_review (10-18)، بطاقة بلا أمرٍ حرفيّ «للمرّة الثانية أو الثالثة» (10-18)، مخالفات 10-17 في الذاكرة لا في السجلّ (SWOT 10-17). النمط: السجلّ يلتقط ما يسهل قياسه آليّاً (lang_audit) لا ما يهمّ.\n\n### 3.7 التعلّم من الحوادث\n\nمهارة maestro-incident ناضجة: تصنيف S1/S2/S3، إيقاع 15/30 د، قناة واحدة، استعادة قبل تشخيص، مراجعة بلا لوم خلال 48 ساعة بقالب، و«فخاخ حقيقيّة» مؤرَّخة من حوادث فعليّة (09-26، 09-28). لكن لم أجد سجلّ post-mortem منفَّذاً لحوادث أكتوبر (انهيار 8500 بـKeyError 10-20، تثبيت 717 د، موت watch 4 مرّات)، فالمهارة مكتوبة والممارسة غير مثبتة.\n\n---\n\n## 4) اقتصاد التدفّق (Lean)\n\n### 4.1 حدود WIP\n\n| الحدّ | القيمة | نوع الإنفاذ | الواقع |\n|---|---|---|---|\n| بطاقات غير منشورة لكلّ دور | 3 (ledger.py:694) | إنذار | 0701: 11، 0101: 8 |\n| بطاقتان جاريتان لجلسة | 1 in_progress | رفض (ledger.py:690) إلّا P0/--waive-wip | 6 waive-wip في 7 أيّام (10-20) |\n| جلسات 04 | 0–10 | سياسة | 7 أعضاء اليوم |\n| طابور المالك في النافذة | ≤8 | سياسة | غير مقيس بعد D-443م |\n| إيقاظ متزامن | 2 (tabs.json max_concurrent_wakes) | «افتراضيّ حتى يقرّر المالك» | غير مقيس |\n| إجمالي WIP في المنظومة | لا حدّ | — | 104 بطاقات مفتوحة؛ ليتل يتوقّع 2.7–6.7 (board_state §2، operating_model l.19) أي تراكم 4.5× إلى 15× |\n\n### 4.2 حجم الدفعة\n\nدفعتا نشرٍ يوميّاً (D-429م) تجمّع الدمج، وهو قرارٌ واعٍ لحماية ساعات الدوام المدرسيّ. لكنّ التجميع ينتقل إلى الأمام: 7 طلبات معتمدة حُجبت باختبارٍ زمنيٍّ واحد (W-20261016-008)، وتسعة طلبات أُعيدت دفعةً بعد إصلاحٍ واحد (حادث 09-26). حجم الدفعة الفعليّ في «الاعتماد» صغير (بطاقة/رأس)، وفي «الدمج» متوسّط (3–7 في الدفعة)، وفي «الالتقاط» ضخم (batch_capture؛ 50 captured في 10-20).\n\n### 4.3 الطوابير وزمن الانتظار مقابل زمن العمل\n\nمن تقرير 10-16 و10-17 واليوم:\n\n| الانتقال | وسيط | p90 | طبيعته |\n|---|---|---|---|\n| captured → routed/in_progress | 4.3 س | 274 س | انتظار خالص |\n| routed → ready_for_review | ~72.7 س (n=5) | 183.8 س | عملٌ + انتظار غير مفصولين |\n| ready → approved | 0.1 س | 16.5 س | انتظار النافذة |\n| approved → pushed | — | 32.26 س | انتظار (قبل flow_pump) |\n| pushed → merged | 0.95 س | 2.43 س | انتظار CI/النافذة |\n| merged → published | 0 | 0.21 س | آليّ |\n\nنسبة كفاءة التدفّق (Flow Efficiency) تقريبيّة: زمن اللمس الفعليّ بضع ساعات مقابل دورةٍ وسيطها 1.1–1.7 س للسريع وp90 17–25 س، والذيل حتى 80–326 س. أي أنّ المنظومة ثنائيّة النمط: مسارٌ سريع (أقلّ من يومين) ومسارٌ راكد (أكثر من أسبوع) لا يفرّق بينهما القياس. بنظريّة القيود، القيدُ الحقيقيّ ليس الاعتماد (الذي استُثمر فيه أكثر) بل «routed بلا حركة» حيث 12 بطاقة بلا حركة فوق 30 دقيقة منها اثنتان منذ 131 ساعة (digest اليوم §4).\n\n### 4.4 إعادة العمل وتعدّد الرؤوس\n\n- إعادة الاعتماد: 33% (97/290) في 10-16؛ 49 في 7 أيّام (10-20)؛ 44 ذكراً صريحاً + فائض 70 حدث approved على ready في الأسبوع الأخير (مقيس). الجذور (ردّ 0501): إصلاح CI بعد الدفع، دمج main، أخطاء توثيق سطر الاعتماد. D-451م وwaive-head auto في flow_pump يعالجان الصنفين الأوّلين.\n- أربعة رؤوس لبطاقة واحدة (W-020-005 في تقييم 8 ساعات)؛ #1084 رسب ثلاث مرّات بلقطةٍ مختلفة (ردّ 0702).\n- الجذر البنيويّ: «جاهز» يُعلن قبل اكتمال الفحوص (PREMERGE_GATE_ENFORCE مطفأ؛ 48 إنذار ظلّ) فيُكتشف العيب بعد الاعتماد.\n\n### 4.5 تكلفة التنسيق\n\n- سقف الرسائل رُفع أربع مرّات (50→100→150→300، D-414م→D-447م): السقف يُرفع كلّما بلغته الحاجة، وهو ما يعني أنّ الحاجة إلى الرسائل لم تُعالج بل سُقّفت.\n- توقّف التطبيق بعد 10 رسائل متتالية بين الجلسات (COMMON.md l.40-46) أنتج بروتوكول unblock_request وأسئلة AskUserQuestion، أي أنّ القيد الخارجيّ صار جزءاً من التصميم.\n- قاعدة 1000 حرف → ملفّ في handover_notes: صحيحة لكنّها نقلت التنسيق إلى ملفّاتٍ لا تُقرأ إلّا بإشعار (handover_notes فيه مئات الملفّات).\n- رسائل الإيقاظ: فشل ذاتيّة الأرشفة لـwake-send، ضجيج flow_watch (100 أحمر/32 أصفر في 10-17)، مهمّة wake-send-10min الوحيدة المفعَّلة (تسليم 10-20 البند 12). المهامّ المجدولة الأخرى كلّها معطَّلة (تدقيق الأتمتة 10-18).\n- flow_pump (D-446م/D-450م) أوّلُ تصميمٍ يستبدل الرسائل بقراءة المصدر: «لا ترسل رسائل: تُبلَّغ البطاقات العالقة نصّاً مجمَّعاً» (flow_pump.py رأس الملف). هذا الاتّجاه الصحيح.\n\n### 4.6 الهدر بتصنيف Lean\n\n| نوع الهدر | مثال من المصادر |\n|---|---|\n| انتظار | routed p90 274 س؛ approved → pushed p90 32 س |\n| حركة زائدة | 300 رسالة/جلسة؛ إيقاظ دوريّ كلّ 10 د |\n| إعادة عمل | 33% إعادة اعتماد؛ لقطات متذبذبة |\n| معالجة زائدة | ثلاث إعادات ترقيم؛ تقارير تقييم كثيرة (10-14، 10-16، 10-17، 10-18، 10-20) بتوصيات متكرّرة لم تُنفَّذ (تفعيل المفاتيح) |\n| مخزون | 104 بطاقات مفتوحة، 40 بلا حامل؛ 64 شجرة و230 فرعاً بعد التنظيف |\n| عيوب | حمرة بعد الدفع (#1176 #1178 #1180 #1182) بسبب غياب خطّاف prepush |\n| إمكانات غير مستغلّة | سقّاطات مكتوبة مطفأة؛ batch_approve.py مذكور في D-445م وغير موجود (10-20) |\n\n---\n\n## 5) المخاطر النظاميّة\n\n| # | الخطر | الدليل | الاحتمال | الأثر | التخفيف الحاليّ | الفجوة |\n|---|---|---|---|---|---|---|\n| R1 | نموذج LLM واحد يشغّل كلّ الأدوار: ارتباط الأخطاء وغياب الاستقلال الحقيقيّ في المراجعة | كلّ الجلس لة بلا ملاحظة.\n- القفل الوحيد في tools/ هو flow_pump.lock (flow_pump.py:347-362، O_EXCL، STALE_LOCK_S = 900 عند :349). نقاط الضعف [محقَّق من القراءة]: العمر يُقاس بـmtime ولا يتجدّد أثناء الدورة؛ كسر القفل القديم ثم إنشاؤه ليس ذرّياً فدورتان قد تكسرانه معاً؛ وfinally يحذف القفل (:373) حتى لو أخذته دورة أخرى. والجلسات التي تستدعي ledger.py مباشرة لا تأخذ هذا القفل.\n- msg_counter.py: قراءة-تعديل-كتابة بلا قفل (:70 ثم الحفظ) فتضيع زيادات عند التزامن [محقَّق من الشيفرة؛ الأثر تقدير].\n- decision_add.next_id يأخذ أعلى «D-NNNم» في النص بلا قفل ويكتب في موضعين (decision_add.py:36-39, 48-60).\n- الكتابة الذرّية (tmp ثم os.replace) في ثلاث أدوات فقط: digest.py:201 وmsg_counter.py:47 وunblock_request.py:34. ملفات الحالة الأخرى تُكتب بـwrite_text المباشر: flow_watch.py:721 وpr_watch.py:144 وsession_register.py:51 ومؤشر wake_monitor (:388).\n\nالنسخ الاحتياطي والتراجع:\n- الدفتر ملحق-فقط؛ التصحيح بأحداث لا بحذف [محقَّق]. وسم الإلغاء «ملغى[بطاقة@رأس]» في owner_confirmations يبقي السطر ويلغي أثره (approval_check.py:181-187).\n- events.jsonl مُدرَج في .gitignore:3، ولم أجد أداة نسخٍ احتياطي له في tools/ ولا scripts_for_owner/ ولا الوثائق [محقَّق: grep]؛ watch_once.py:302 يراقب نسخ ~/.claude فقط. قد توجد نسخة على مستوى النظام لا أراها [تقدير]. حجم الملف 3.9 ميغابايت.\n- لا حركة عكسية للدمج الآلي إن أُخطئ؛ التراجع يدوي عبر GitHub.\n\n## 4. مضخّة التدفّق\n\nالبنية [محقَّق]: مراحل متسلسلة (اعتماد، إعفاء آلي، دفع، سطر اعتماد في الطلب، `gh pr merge --squash --auto --match-head-commit`، نشر عبر ledger_sync)؛ الافتراضي عرض و--apply للتنفيذ؛ يُعاد تحميل الدفتر بين المراحل (flow_pump.py:388-389).\n\nالحرّاس [محقَّق]:\n- اعتماد البطاقة يمر عبر approval_check ثم ledger.move بحرّاس الدفتر (flow_pump.py:110-125).\n- الدفع عبر push_approved: نمط الفرع (push_approved.py:27-29,78)، بلا force (:113)، تحقق ls-remote (:116-118)، ثم add_note ثم move (:119-121).\n- الدمج: `--match-head-commit` (flow_pump.py:342)؛ merge_block (:301-317) يستثني المسودّة، والأساس غير main، والهجرات، والطلب ≥100 ملف، والوسم الأمني أو المسارات الحساسة (SENSITIVE_GLOBS :61).\n- فشل قراءة قائمة الطلبات من gh فشلٌ مغلق: لا إعفاء ولا سطر ولا دمج (:397-402).\n- قائمة المسارات الحساسة في merge_block (flow_pump.py:61) تختلف عن ledger.SENSITIVE_PATH_PARTS (ledger.py:1175)؛ تعليق flow_pump.py:58-60 يقول إنها مرآة لقائمة المستودع الخارجي. الأثر العملي غير مثبت [تقدير].\n\nمفتاح الإيقاف [محقَّق]:\n- ledger/flow_pump.off موجود (نصّه: تجميد بأمر المالك 16:10، وضعه 0101؛ mtime 2026-10-21 16:37:22). يقرؤه الخطاف فقط (flow_pump_hook.py:35,129)، وflow_pump.py لا يقرؤه.\n- ledger/flow_pump.log يُظهر دورات مطبَّقة في 16:17 و16:27 و16:32 (الأخيرة من الخطاف: flow_pump.stamp عند 16:32:28 وflow_pump.out عند 16:32:46)، ثم 16:39 و16:53 و16:58 و17:07 و17:17 بعد وجود ملف الإيقاف. الأخيرة تشغيل مباشر لأن stamp وout لم يتحدّثا، و.claude/settings.local.json يسمح بأمر `python tools/flow_pump.py --apply --skip W-20261001-006` مباشرة.\n- آخر حدث في الدفتر عند 15:55:04، فلا كتابات دفتر بعد التجميد. أثر هذه الدورات الخارجي على GitHub لا يمكن التحقق منه من الدفتر.\n\nالخطاف [محقَّق]:\n- المسجَّل في ~/.claude/settings.json: Stop وSessionStart فقط. خطاف PostToolUse لـBash وPowerShell لم يُسجَّل لأن مصنّف الأمان رفضه، وتُرك لإضافة يدوية (handover_notes/flow_pump_hook_posttooluse_snippet.md). فالمحفّز الأسرع الموصوف في docstring غير مفعَّل.\n- فترات الدورة 60 و300 ثانية (flow_pump_hook.py:44-45)؛ STAMP.touch() قبل الإطلاق (:93)؛ SKIP مكتوب حرفياً (:41)؛ `except Exception: pass` (:131)؛ النطاق مقصور على مجلّدين (:55).\n- يعمل بـpythonw.exe؛ هل يوجد stdin صالح هناك غير مُتحقَّق منه [تقدير].\n- OUT يُفتح بـ\"w\" فيمسح تقرير الدورة السابقة (:98).\n\nرمز الخروج المضلِّل [محقَّق]: rc يأتي من ledger_sync.cycle (flow_pump.py:422-427)، وكل صفوف flow_pump.log الـ148 rc=0 (35 يوم 10-20 و113 يوم 10-21). السطر يُكتب مع --apply فقط. فاختفاء الأخطاء في السجل أثر بنيوي لا دليل نجاح.\n\nالدورات والتكرار:\n- كل مرحلة تُحسب من حالة الدفتر لا من الذاكرة، والحركات محروسة بـcheck_transition وcheck_not_repeat (ledger.py:310-318, 839-850)؛ فدفعٌ نجح وفشل تدوينه يُعاد بأمان [محقَّق من الشيفرة].\n- ledger_sync.apply_rows يتابع بقية البطاقات عند فشل واحدة؛ ونشر «published» يعتمد على صحة الإنتاج العامة ومقارنة gh api (publish_sync.py:44-50, 78-83).\n- رفض الإعفاء الآلي يتكرر كل دورة بلا تراجع: في آخر flow_pump.out بطاقتان W-20261020-030 وW-20261020-036 [محقَّق].\n- السقفان `--limit 100` (flow_pump.py:131) و80 افتراضياً (ledger_sync.py:244) قد يُسقطان طلبات صامتاً [تقدير للأثر].\n- قياس: 27 ملاحظة دفتر تذكر المضخّة (10-20 18:10 حتى 10-21 15:52)، كلها اعتمادات؛ لا إعفاء موقَّع من 0101 فيها، و81 إعفاءً من 0501 [محقَّق: عدّ].\n\n## 5. سلامة الدفتر\n\nثغرة اتجاه القول [محقَّق بتجربة]:\n- approval_check يقبل أسطر owner_confirmations.md فقط (H2)، لكن `_confirmation_rows` (approval_check.py:172-201) يعدّ أي سطر فيه مفتاح البطاقة (بحدّ لفظي، :158-160) ورأس مطابق دليلاً. نفّذتُ على ملف تجربة في مجلّد الجلسة المؤقت سطراً يحمل «لا، ارفضه ولا تدمج» مع W-20269999-001 وabcdef12: رجعت الحالة ok ومرّ من `_owner_direct`.\n- record_owner_confirmation.py:62-72 يترك للجلسة تصريح المصدر «مباشر» بلا تحقق.\n- مفاتيح التشديد مطفأة: PROVENANCE_ENFORCE = False (approval_check.py:139) وIDENTITY_ACK_FROM = \"\" (:232).\n\nالتنازل البصري [محقَّق]:\n- approval_check.py:277-284 و:293-307 يقبل التنازل من أي ملاحظة دفتر تبدأ بعبارة «تنازلٌ بصريّ بقرار المالك» وفيها رأس من 8 خانات، دون التحقق من كاتبها. في الدفتر 52 ملاحظة كهذه: 46 من (0101) و3 من (0501) واثنتان من (0502) (W-20261010-008 وW-20261010-019 بتاريخ 2026-10-11 00:59).\n- `ui_touched` يرجع إلى قائمة ملفات الدفتر عند تعذّر git (approval_check.py:222-226، مُختبَر عمداً: test_approval_head_binding.py:114)، و`_show` الذي يرجع None يعني «لا مشكلة بصرية» (:325). عند غياب D: يتراجع الفحص بصمت [محقَّق من القراءة].\n\nنقاط قوة [محقَّق]: حلقات الإعفاء تُعاد البراهين عليها بـgit (approval_check.py:393-416 مع ledger.py:1121-1160 check_main_merge بـmerge-tree و:988 weakened_assertions)؛ مطابقة المفتاح بحدّ لفظي (:158-160)؛ وسم الإلغاء (:181-187). أمر `ledger.py move … approved` نفسه لا يستدعي approval_check: شرطه المسجِّل والملاحظة والرأس (ledger.py:310-331)، فتحقق owner_confirmations يقع على المضخّة والمسارات الأخرى لا على الدفتر.\n\nتباين صيغ سطر الاعتماد [محقَّق من النصوص]: flow_pump.py:49-56 (LINE_FORMS) يكتب «اعتُمد من المالك مباشرةً بلا معاينة 8500»، بينما release_follow.sh:36-37 يقبل صيغة «اعتُمد من المالك على 8500 … الرأس» فقط. وapproval_check.APPROVAL_LINE (:34) لا يطابق صيغة التكليف. ومستهلك رابع خارج الشجرة (scripts/pr_approval_head_check.py في المستودع الآخر) لم أره.\n\ndecisions_lint [محقَّق بتشغيله قراءةً]: يرجع رمز 1 بملاحظتين: «D-423م أسبق من D-422م» (decisions.md:434) و«فجوة بين D-443م وD-447م». التكرار الظاهري في D-291 وD-432 وD-433 ملاحق مقصودة. غير موصول بأي دورة آلية ولا خطاف؛ يُذكر في المواثيق والوثائق فقط.\n\n## 6. المراقبة والتنبيه\n\nwake_monitor [محقَّق]:\n- حارس العدّاد يفشل مغلقاً (wake_monitor.py:127-132). قناة التجربة {0701, 0301} (:42).\n- تعارضات: COUNTER_GUARD = 260 «من 300» (:43) بينما رسائل التوقف تقول «من 150» (:160, :281) وتعليق DAILY_CAP يقول 150 (:57)؛ REWAKE_MIN = 10 (:56) بينما التعليق «كلَّ ساعة» (:347) والـdocstring (:12).\n- wake_log.jsonl: 15 سطراً (2026-10-20 06:14 حتى 2026-10-21 13:28)، 4 توقّفات، 11 صفاً بإيقاظ، 47 جلسة أُوقظت. أسباب التخطي: «أقل من 60 دقيقة» 25 و«يؤجَّل» 24 و«لا معرّف للجلسة 0703» 6. wake_cursor.json غير موجود.\n- msg_counter.py الذي يعتمد عليه غير متتبَّع (انظر القسم 7).\n\nwatch_once [محقَّق]: مراقب بمرة واحدة؛ يراقب ~/.claude فقط في النسخ (watch_once.py:302)؛ مسارات حرفية (:328, :389, :434)؛ 485 سطراً في ملف واحد.\n\nflow_watch [محقَّق]: إزالة تكرار بمهلة REPEAT_MIN = 360 (flow_watch.py:692-724)، و«غير مقيس» بدل سلامة كاذبة، ورمزا خروج 1 و2، وإعادة محاولة GraphQL (:641-648). ملف حالته يُكتب مباشرة بلا ذرّية (:721). لقطة 17:06 اليوم: 19 صفاً كلها أحمر وصفر أصفر، ما يضعف التمييز بين الشدّات [محقَّق بعد فك الترميز المضاعف]. ملف الحالة فيه 24 مفتاحاً.\n\nإنذارات دائمة [محقَّق]: preview_alert_latest.txt (17:08) يحمل إنذاراً عالياً دائماً no_script لأن D:/shschool_mvp/scripts/preview.sh غير موجود وقت القراءة (preview_alert.py:19-22) — افتراض مسار لا عطل معاينة فعلي [تقدير للسبب].\n\nسجلات بلا تدوير [محقَّق]: lang_guard.log 3,061,220 بايتاً و54,332 سطراً منذ 2026-10-12، مسجَّل بتوقيت UTC (lang_guard.py:75-85) بينما بقية الأدوات بتوقيت الدوحة. وضعا identity_guard.mode وlang_guard.mode كلاهما block.\n\n## 7. الدين التقني والتوثيق\n\n- README.md سطران. PACKAGE.md (58 سطراً) لا يذكر flow_pump ولا ledger_sync ولا approval_check ولا wake_monitor ولا push_watch ولا decisions_lint ولا record_owner_confirmation ولا render_role_cards [محقَّق: grep]. لا README داخل tools/. المضخّة موثَّقة في docstring وdecisions.md وhandover_notes فقط.\n- أدوات ميتة أو منتهية [محقَّق]: gate_check.py بوّابة الجمعة 2026-10-09 (:20 يقرأ gate_state_2026-10-09.json وهو غير موجود)، وmain() يعمل عند الاستيراد دون حارس (:51)، بلا اختبار، ومع ذلك role_cards/COMMON.md:35 يحيل إليه. doha_time.py وw026_preview_seed.py غير مشار إليهما؛ w020/w026_preview_seed بذور لبطاقات محددة.\n- تبعية على ملف غير متتبَّع [محقَّق]: msg_counter.py غير موجود في HEAD ولا في origin/main، ويستخدمه wake_monitor.py وred_notify.py (:37). نسخة نظيفة من الفرع لا تجده [تقدير: على جهاز آخر].\n- تسمية غير موحّدة (أفعال وأسماء وتواريخ وأرقام بطاقات في أسماء الملفات)؛ لا قاعدة حجم للملفات.\n- المراجعة السابقة handover_notes/swot_flow_2026-10-21.md (659 سطراً، غير متتبَّعة) تذكر أن محور الأدوات لم يكتمل فيها.\n\n## 8. الصيانة لو اختفى المشغّل الحالي\n\nيسهّل [محقَّق]: docstring في كل وحدة (108/108)، وأوامر CLI واضحة، وبيانات JSONL/Markdown قابلة للفحص، ووضع عرض افتراضي في المضخّة، وآلة حالات مختبَرة (422 اختباراً في ledger).\n\nيعيق:\n- المنطق مبني على أرقام قرارات D-NNNم وأرقام جلسات (0101، 0501، 0601، 0701) مضمَّنة في الشيفرة: RECORDERS (ledger.py:297)، WAIVER_BY وPUMP_WAIVER_BY (ledger.py:1257-1260)، TEST_CHANNEL (wake_monitor.py:42). اختفاء هذه الجلسات يعني اختفاء مصدر التوقيع، ولا مسار تسليم موثّق [محقَّق من الشيفرة؛ غياب المسار الموثّق تقدير].\n- عقود نصّية عربية حرفية بين أدوات (flow_pump.py:49-56، release_follow.sh:36، approval_check.py:277-284): تعديل صياغة يعطّل بوّابة بصمت.\n- معرفة تشغيلية خارج الشيفرة: الخطافات في ~/.claude/settings.json بمسارات حرفية، وملف .claude/settings.local.json، ومتغيرات بيئة (PYTHONIOENCODING)، ومفتاح flow_pump.off؛ ولم أجد وثيقة تثبيت تجمعها.\n- الخلاصة [تقدير]: تُفهم الشيفرة بلا الجلسات، لكن «لماذا» و«كيف تُعاد البيئة» تحتاجان decisions.md وhandover_notes والمشغّل.\n\n## SWOT — عشرة بنود لكل ربع\n\nالقوة\n1. آلة الحالات مفروضة في الشيفرة: لا قفز فوق pushed/merged/published ولا اعتماد بلا ملاحظة — ledger.py:288-293, 310-318.\n2. الاعتماد مربوط برأس الإيداع وبمسجِّل مسموح — ledger.py:297-308, 324-331.\n3. الاعتماد يثبت من owner_confirmations.md لا من الدفتر ولا وصف الطلب، مع وسم إلغاء ومطابقة بحدّ لفظي — approval_check.py:158-160, 181-187, 543-547.\n4. الإعفاءات يُعاد برهانها بـgit (merge-tree، رفض إضعاف التأكيدات) — approval_check.py:393-416؛ ledger.py:988, 1121-1160.\n5. لا shell=True/eval/pickle؛ دفع بنمط فرع صارم بلا force مع تحقق ls-remote — push_approved.py:27-29, 78, 113-118.\n6. المضخّة عرض افتراضاً، تعيد الحساب من الدفتر، فشل gh مغلق، والدمج مقيَّد بالرأس — flow_pump.py:342, 388-389, 397-402.\n7. مشغّلات قابلة للحقن تجعل الاختبارات بلا شبكة — flow_pump.py:274, 320؛ push_approved.py:74؛ test_flow_pump.py (50 اختباراً).\n8. «غير مقيس» بدل سلامة كاذبة، وحارس العدّاد مغلق عند الفشل — flow_watch.py (دالة التصنيف وdocstring)؛ wake_monitor.py:127-132.\n9. قراءة الدفتر تتسامح مع الأسطر التالفة وتحمي الدفتر الحقيقي من الاختبارات — ledger.py:76-88, 218.\n10. تغطية اختبارية واسعة (1,067 دالة) وdocstring في كل وحدة (108/108) وأسرار تُمرَّر بالاسم — preview_accounts.py:11-12, 134.\n\nالضعف\n1. الهوية نص حرّ والمضخّة تحقن 0101 — ledger.py:301-308, 639-648, 1475؛ flow_pump.py:420-421.\n2. فاحص الاعتماد لا يقرأ اتجاه القول والمسجِّل ذاتي التصريح (قُبل «لا، ارفضه» في التجربة) — approval_check.py:172-201؛ record_owner_confirmation.py:62-72.\n3. التنازل البصري يُقبل من أي كاتب ملاحظة (اثنتان من 0502) — approval_check.py:277-284, 293-307.\n4. إلحاق بلا قفل ولا fsy function gauge(sc){
  const R=54,C=2*Math.PI*R,R2=65,C2=2*Math.PI*R2,a=C*sc.score/100,t0=C2*sc.target[0]/100,t1=C2*sc.target[1]/100;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="الدرجة ${sc.score} من 100، الهدف ${sc.target[0]} إلى ${sc.target[1]}">
  <circle class="g-track" cx="75" cy="75" r="${R}"/>
  <circle class="g-arc" cx="75" cy="75" r="${R}" stroke-dasharray="${a.toFixed(2)} ${(C-a).toFixed(2)}" transform="rotate(-90 75 75)"/>
  <circle class="g-tgt-track" cx="75" cy="75" r="${R2}"/>
  <circle class="g-tgt" cx="75" cy="75" r="${R2}" stroke-dasharray="0 ${t0.toFixed(2)} ${(t1-t0).toFixed(2)} ${(C2-t1).toFixed(2)}" transform="rotate(-90 75 75)"/>
  <text class="g-num" x="75" y="84" text-anchor="middle">${sc.score}</text><text class="g-den" x="75" y="102" text-anchor="middle">من 100</text></svg>`;
}
function bars(sc){
  return `<ul class="bars">`+sc.axes.map(([n,s,w])=>{
    const r=s/w,c=r>=.75?"good":r>=.55?"warn":"bad";
    return `<li class="bar ${c}"><span class="nm">${esc(n)}</span><span class="vl">${s} من ${w}</span><span class="tr" role="img" aria-label="${s} من ${w}" style="width:${(w/20*100).toFixed(1)}%"><i class="fl" style="width:${(r*100).toFixed(1)}%"></i></span></li>`;
  }).join("")+`</ul>`;
}

function decState(){try{return JSON.parse(store.get("swot-dec")||"{}")}catch(e){return {}}}
function decText(st){
  const lines=["قراراتي في خطة التوصيات (2026-10-21):"];
  DECISIONS.forEach((d,i)=>{const v=st[d.id];lines.push((i+1)+") "+d.q.replace("؟","")+": "+(v!=null&&d.o[v]?d.o[v][0]:"لم أحدد بعد"))});
  return lines.join("\n");
}
function decInit(){
  const st=decState(),out=$("#decOut");
  $$("#v-over input[type=radio]").forEach(r=>{if(st[r.name]==r.value)r.checked=true;
    r.addEventListener("change",()=>{const s=decState();s[r.name]=+r.value;store.set("swot-dec",JSON.stringify(s));out.textContent=decText(s);$("#decSt").textContent=""})});
  out.textContent=decText(st);
  $("#decReset").addEventListener("click",()=>{store.set("swot-dec","{}");$$("#v-over input[type=radio]").forEach(r=>r.checked=false);out.textContent=decText({});$("#decSt").textContent="مُسحت الاختيارات"});
  $("#decCopy").addEventListener("click",async()=>{
    const t=out.textContent,st2=$("#decSt");
    try{await navigator.clipboard.writeText(t);st2.textContent="نُسخ الملخص. ألصقه في المحادثة."}
    catch(e){const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);st2.textContent="حدّدتُ النص، انسخه بـ Ctrl+C."}
  });
}

marked.use({renderer:{html(h){return esc(h)}},mangle:false,headerIds:false});
const CACHE={};
function badgeify(h){
  return h.replace(/\[(تحقّق|تحقق|محقَّق|محقق|تُتحقَّق|تقدير|تعليق|غير معلوم)\]/g,(m,t)=>{
    const n=t.replace(/[ً-ٟ]/g,"");const c=/^(تحقق|محقق)/.test(n)?"v":n==="تقدير"?"e":n==="تعليق"?"c":"u";
    return `<span class="tg ${c}">${t}</span>`});
}
function groupAppendices(root){
  const out=document.createDocumentFragment();let cur=null;
  [...root.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.tagName==="HR")return;
    if(n.nodeType===1&&n.tagName==="H1"){
      const t=n.textContent.trim();
      if(/^الملحق/.test(t)){
        cur=document.createElement("details");cur.className="app";
        const p=t.split("—"),tag=p[0].trim(),title=(p.slice(1).join("—").trim()||t);
        const s=document.createElement("summary");
        s.innerHTML=`<span class="app-tag">${esc(tag)}</span><span class="app-title">${esc(title)}</span><span class="app-chev"></span>`;
        cur.appendChild(s);out.appendChild(cur);return;
      }
      if(cur){const h=document.createElement("h2");h.className="sub-title";h.innerHTML=n.innerHTML;cur.appendChild(h);return}
    }
    (cur||out).appendChild(n);
  });
  root.replaceChildren(out);
}
const norm=s=>s.replace(/[ً-ٰٟـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase();
function build(k){
  if(CACHE[k])return CACHE[k];
  const node=document.createElement("div");node.id="doc-body";
  node.innerHTML=badgeify(marked.parse(DATA[k]));
  $$("table",node).forEach(t=>{const w=document.createElement("div");w.className="tw";t.parentNode.insertBefore(w,t);w.appendChild(t)});
  if(k==="platform"||k==="flow")groupAppendices(node);
  const toc=[];let i=0,cur=null;
  [...node.children].forEach(el=>{
    if(el.tagName==="H2"){el.id=k+"-"+(i++);cur=null;toc.push({id:el.id,el,text:el.textContent.trim(),kids:[]})}
    else if(el.tagName==="DETAILS"){
      el.id=k+"-"+(i++);const it={id:el.id,el:$("summary",el),det:el,text:($(".app-tag",el).textContent+" — "+$(".app-title",el).textContent).trim(),kids:[]};
      $$("h2:not(.sub-title)",el).forEach(h=>{h.id=k+"-"+(i++);it.kids.push({id:h.id,el:h,text:h.textContent.trim()})});
      toc.push(it);
    }
  });
  const idx=[];let head=null;
  $$("h2,details.app>summary,p,li,td",node).forEach(el=>{
    if(el.tagName==="H2"||el.tagName==="SUMMARY"){head=el.tagName==="SUMMARY"?el.parentElement.id:el.id;if(el.tagName==="H2"&&!el.id)return}
    const tx=el.textContent.trim();
    if(tx.length>=8)idx.push({k,el,tx,n:norm(tx),head});
  });
  return CACHE[k]={node,toc,idx};
}
function reveal(el){let d=el.closest("details");while(d){d.open=true;d=d.parentElement&&d.parentElement.closest("details")}}
function flash(el){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),2600)}
function goEl(k,el){
  show(k,false);reveal(el);
  el.scrollIntoView({block:"center"});flash(el);
}
function goHeading(k,re){
  const c=build(k);const it=c.toc.find(t=>re.test(t.text))||(c.toc.flatMap(t=>t.kids||[]).find(t=>re.test(t.text)));
  if(!it){show(k);return}
  goEl(k,it.el);
}

/* ---------- العرض والتنقّل ---------- */
let current=null;
function buildNav(){
  $("#nav").innerHTML=VIEWS.map(([k,t])=>`<a href="#${k}" data-v="${k}">${t}</a>`).join("");
}
function setNav(k){$$("#nav a").forEach(a=>{if(a.dataset.v===k)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
function tocHtml(c){
  return "<ul>"+c.toc.map(t=>`<li class="${t.det?"l1":"l0"}" data-id="${t.id}"><a href="#" data-id="${t.id}">${esc(t.text)}</a>${t.kids&&t.kids.length?`<ul class="sub">`+t.kids.map(x=>`<li data-id="${x.id}"><a href="#" data-id="${x.id}">${esc(x.text)}</a></li>`).join("")+"</ul>":""}</li>`).join("")+"</ul>";
}
function show(k,top=true){
  if(!VIEWS.some(v=>v[0]===k))k="overview";
  const same=current===k;current=k;setNav(k);
  const over=$("#v-over"),dv=$("#v-doc");
  if(k==="overview"){over.hidden=false;dv.hidden=true}
  else{
    over.hidden=true;dv.hidden=false;
    if(!same){
      const c=build(k);$("#doc").replaceChildren(c.node);
      $("#toc").innerHTML=tocHtml(c);
      const hasDet=!!$("details.app",c.node);
      $("#docT").innerHTML=`<span class="nm">${esc(DOCNAME[k])}</span>`+(hasDet?`<span class="row-b"><button class="btn ghost" id="oAll" type="button">فتح كل الملاحق</button><button class="btn ghost" id="cAll" type="button">طيّ الكل</button></span>`:"");
      if(hasDet){$("#oAll").onclick=()=>$$("details.app",c.node).forEach(d=>d.open=true);$("#cAll").onclick=()=>$$("details.app",c.node).forEach(d=>d.open=false)}
      $$("#toc a").forEach(a=>a.addEventListener("click",e=>{
        e.preventDefault();const t=document.getElementById(a.dataset.id);if(!t)return;
        reveal(t);t.scrollIntoView({block:"start"});flash(t.tagName==="DETAILS"?$("summary",t):t);
        if(innerWidth<=900)$("#tocd").open=false;
      }));
      $("#tocd").open=innerWidth>900;
    }
  }
  try{if(location.hash!=="#"+k)location.hash=k}catch(e){}
  if(top)scrollTo(0,0);
  spy();
}
function route(){const h=location.hash.replace("#","");if(h===current)return;show(VIEWS.some(v=>v[0]===h)?h:(current||"overview"))}
addEventListener("hashchange",route);

/* ---------- تتبّع الموضع والتقدّم ---------- */
let tick=false;
function spy(){
  const doc=document.documentElement,max=doc.scrollHeight-innerHeight;
  $("#progI").style.transform=`scaleX(${max>0?Math.min(1,scrollY/max):0})`;
  $("#up").classList.toggle("on",scrollY>600);
  if(current==="overview"||!CACHE[current])return;
  let act=null;
  for(const t of CACHE[current].toc){
    const r=t.el.getBoundingClientRect();if(r.top<=140)act=t;else break;
  }
  let kid=null;
  if(act&&act.kids)for(const x of act.kids){if(x.el.getBoundingClientRect().top<=140&&x.el.offsetParent)kid=x;else if(x.el.offsetParent)break}
  $$("#toc a.on").forEach(a=>a.classList.remove("on"));
  $$("#toc li.open").forEach(l=>l.classList.remove("open"));
  const pick=kid||act;
  if(act){const li=$(`#toc li[data-id="${act.id}"]`);if(li){li.classList.add("open");const a=$(`a[data-id="${(kid||act).id}"]`,li);if(a){a.classList.add("on");if(innerWidth>900){const tc=$(".toc"),ar=a.getBoundingClientRect(),cr=tc.getBoundingClientRect();if(ar.top<cr.top+40||ar.bottom>cr.bottom-40)tc.scrollTop+=ar.top-cr.top-cr.height/2}}}}
}
addEventListener("scroll",()=>{if(!tick){tick=true;setTimeout(()=>{tick=false;spy()},40)}},{passive:true});
addEventListener("resize",spy);
$("#bUp").addEventListener("click",()=>scrollTo({top:0}));

/* ---------- البحث ---------- */
const srch=$("#srch"),q=$("#q"),qr=$("#qr");let lastFocus=null;
function openS(){lastFocus=document.activeElement;srch.hidden=false;q.focus();q.select()}
function closeS(){srch.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("#bSearch").addEventListener("click",openS);$("#qx").addEventListener("click",closeS);
srch.addEventListener("click",e=>{if(e.target===srch)closeS()});
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!srch.hidden){closeS();return}
  if(e.key==="/"&&srch.hidden&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openS()}
});
let timer=null;
q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(runSearch,160)});
function runSearch(){
  const raw=q.value.trim();
  if(raw.length<2){qr.innerHTML=`<div class="srch-m">اكتب كلمتين أو أكثر من حرفين لبدء البحث. يتجاهل البحث التشكيل وتنويعات الألف.</div>`;return}
  const terms=norm(raw).split(/\s+/).filter(Boolean);
  const res=[];
  ["rating","plan","platform","flow"].forEach(k=>{build(k).idx.forEach(e=>{if(terms.every(t=>e.n.includes(t)))res.push(e)})});
  if(!res.length){qr.innerHTML=`<div class="srch-m">لا نتائج لـ «${esc(raw)}».</div>`;return}
  const shown=res.slice(0,40);
  qr.innerHTML=`<div class="srch-m" style="padding:8px 12px">${res.length} نتيجة${res.length>40?"، أول 40 معروضة":""}</div>`+shown.map((e,i)=>{
    const pos=e.n.indexOf(terms[0]);const from=Math.max(0,pos-50);
    let snip=e.tx.slice(from,from+170);if(from>0)snip="… "+snip;
    snip=esc(snip);
    return `<button class="rs" data-i="${i}"><b>${esc(DOCNAME[e.k])}</b>${snip}</button>`;
  }).join("");
  $$(".rs",qr).forEach(b=>b.addEventListener("click",()=>{const e=shown[+b.dataset.i];closeS();location.hash=e.k;goEl(e.k,e.el)}));
}

/* ---------- المظهر والخط ---------- */
const THEMES=[["","تلقائي"],["light","فاتح"],["dark","داكن"]];
let ti=Math.max(0,THEMES.findIndex(t=>t[0]===(store.get("swot-theme")||"")));
function applyTheme(){const [v,l]=THEMES[ti];if(v)document.documentElement.setAttribute("data-theme",v);else document.documentElement.removeAttribute("data-theme");$("#themeLbl").textContent=l}
$("#bTheme").addEventListener("click",()=>{ti=(ti+1)%3;store.set("swot-theme",THEMES[ti][0]);applyTheme()});
const FZ=[.92,1,1.1,1.22];let fi=Math.max(0,FZ.indexOf(+store.get("swot-fz")||1));
function applyFz(){document.documentElement.style.setProperty("--fz",FZ[fi])}
$("#bFont").addEventListener("click",()=>{fi=(fi+1)%FZ.length;store.set("swot-fz",FZ[fi]);applyFz()});

/* ---------- تشغيل ---------- */
applyTheme();applyFz();buildNav();buildOverview();route();
(window.requestIdleCallback||setTimeout)(()=>{["rating","plan","platform","flow"].forEach(build)});
</script>

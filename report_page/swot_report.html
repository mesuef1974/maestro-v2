e_coverage`)، `check_personal_data.py` في prepush، نافذة نشرٍ مفروضة، اعتماد المالك بالرأس sha8، `security/sensitive_paths.json` مع أداة وسم الطلبات.\n- التقييم: هذا أقوى ما في المنصّة أمنيّاً: الأمن مفروض بحرّاسٍ تفشل لا بوثائق. النقص: لا سجلّ ADR أمنيّ مركزيّ يربط كلّ حارسٍ بالقرار الذي أوجبه، فيصعب على مراجعٍ خارجيّ (ISO) تتبّع «لماذا».\n- التوصية: `docs/security/ADR-index.md` يربط الحرّاس الـ24 بقراراتها، ويُحدَّث بحارسٍ يفشل إن ظهر اختبار أمنيّ جديد بلا سطرٍ فيه.\n\n## 10. خريطة NIST CSF 2.0 (ملخّص)\n\n| الوظيفة | المستوى التقديريّ (1–4) | الفجوة الأكبر |\n|---|---|---|\n| GOVERN | 3 | لا DPO رسميّ ولا RoPA ولا ADR أمنيّ |\n| IDENTIFY | 2 | لا DPIA، لا جرد معالِجين، لا CodeQL |\n| PROTECT | 3 | الرقم الشخصيّ صريح؛ CSP مع CDN؛ MFA على راية |\n| DETECT | 2 | سجلّات تضيع؛ Sentry مستنفد؛ لا ربط حدث→خرق |\n| RESPOND | 2 | قالب خرقٍ بلا مسار؛ تراجع غير مجرَّب |\n| RECOVER | 3 | نسخ مشفَّر واختبار استعادة؛ لا RTO ولا تنبيه فشل |\n\n## 11. تحقّق مباشر (ما راجعتُه بنفسي من الأسطر)\n\n- `core/models/user.py:32-36`: التعليق والحقل الصريح موجودان نصّاً. ✔\n- `core/pdf_utils.py:679-680`: `HTML(string=wp_html, base_url=base_url).write_pdf(...)` بلا `url_fetcher`. ✔\n- `staging/views.py:334`: `openpyxl.load_workbook(uploaded, data_only=True)` بلا `read_only`. ✔\n- `shschool/settings/base.py:462-484`: CSP كما وُصف (3 CDN، `unsafe-inline`، `ws:`). ✔\n- `core/views_auth.py:140-142`: `requires_two_factor` للكادر وsuperuser. ✔\n- `core/admin.py:642-643, 798-799`: `has_delete_permission` = `is_superuser`. ✔\n- `behavior/services.py:322-329`: السبب والمخالفة في نصّ الرسالة. ✔\n- `production.py:386-390`: `CSP_ENFORCE` من البيئة. ✔\n- لم يُوجد في `shschool/` و`.github/`: `CSRF_TRUSTED_ORIGINS`، `codeql`، `PASSWORD_HASHERS` (عدا testing). ✔\n\n## 12. جدول SWOT (مرتّب بالأثر داخل كلّ ربع)\n\n### القوى (Strengths)\n1. حوكمة هندسيّة مفروضة آليّاً: 97 حارساً ثابتاً، 24 حارساً أمنيّاً، CI «صادق» لا يُخضَّر زوراً، حماية main على المسؤولين (6.4، 9).\n2. RBAC مركزيّ بـ99 قدرةً مع منحٍ مؤقّتةٍ مسبَّبةٍ ومدقَّقة واختبار يفرض حراسة كلّ مسار (3.1).\n3. سجلّ تدقيق ثابت على مستوى ORM والقاعدة (زناد 0014) وتسجيل كلّ تصدير (4.5).\n4. حرّاس ضدّ التسريب الجماعيّ للرقم الشخصيّ عبر ≥25 مصدّراً (`test_national_id_never_bulk`) (4.5).\n5. RLS fail-closed على 53 جدولاً مع حارس تغطية سطح المستأجر (3.3).\n6. العيادة مشفَّرة كاملاً (HealthRecord/ClinicVisit) وإشعاراتها لا تسرّب السبب (4.3، 5.5).\n7. MultiFernet مع تدويرٍ محروسٍ بتغطيةٍ كاملة (4.4).\n8. pip-audit حاجب مع استثناءاتٍ بتاريخ انتهاءٍ محروس، وActions مثبّتة بالـSHA (6.2).\n9. جلسات HttpOnly/Secure/SameSite مع تدوير المفتاح عند تبديل الدور، وHSTS سنة preload (2.1، 2.2).\n10. MFA TOTP للكادر وإغلاق `/admin/login` وlogout بـ`Clear-Site-Data` ولا إعادة تعيين بالبريد (3.4، 3.5).\n11. نافذة نشرٍ مفروضة آليّاً في طابور الدمج واعتماد المالك مربوط بالرأس (6.7).\n12. نسخ احتياطيّ يوميّ مشفَّر gpg مع اختبار استعادةٍ أسبوعيّ (6.6).\n13. إخفاء PII في السجلّات بمرشّح وSentry بلا PII (2.8).\n14. API مغلق افتراضيّاً (جلسة + IsAuthenticated + throttles) (2.9).\n15. سياسة احتفاظٍ مكتوبةٌ ومنفَّذةٌ أسبوعيّاً، ومحوٌ منظَّم، ونموذج خرق بمهلة 72 ساعة (5.1، 5.3، 5.4).\n\n### الضعف (Weaknesses)\n1. الرقم الشخصيّ والجوّال نصّاً صريحاً في `CustomUser` رغم وجود HMAC/Fernet بجانبهما (4.2). حرجة.\n2. تفاصيل مخالفات الأطفال تمرّ بمزوّد SMS أجنبيّ وتُخزَّن نصّاً 730 يوماً (5.5). عالية.\n3. سجلّات الأمن تضيع مع الحاوية وحصّة Sentry مستنفدة: كشف الحوادث معطّل عمليّاً (2.8). عالية.\n4. CSP بثلاث شبكات CDN في script-src و`unsafe-inline` في style و`ws:` مفتوح ولا تقارير (2.3). عالية.\n5. لا CodeQL ولا DAST، وBandit بأعلى عتبةٍ مع استثناء `scripts/` (6.1). عالية.\n6. لا إشعار خصوصيّة منشور ولا حقّ اطّلاع/نسخ/تصحيح مؤتمت (5.3). عالية.\n7. `LeaveRequest.reason` (بيانات صحّيّة) و`Profile.notes` و`nationality` نصّاً صريحاً (4.3). عالية.\n8. دور المطوّر يرى كلّ شيء وتدقيقه على 4 بادئات فقط (3.6). عالية.\n9. سجلّ التدقيق بلا hash-chain ولا احتفاظ، وتسجيل القراءة يدويّ غير مفروض (4.5). متوسّطة-عالية.\n10. RLS بلا `FORCE` ودور الهجرات يتجاوزه؛ 20 جدولاً و`CustomUser` بلا `school_id` (3.3). متوسّطة الآن.\n11. MFA وCSP الإلزاميّان معلّقان على متغيّرات بيئةٍ قابلة للإطفاء بلا أثرٍ في المستودع (2.3، 3.4). متوسّطة.\n12. WeasyPrint بلا `url_fetcher` مقيَّد (SSRF/قراءة ملفّات عبر `file://`) (7). متوسّطة.\n13. `load_workbook` بلا `read_only` ولا حدّ حجم في staging (7). متوسّطة.\n14. النسخة الاحتياطيّة artifact على GitHub وR2 اختياريّ و`backup.sh` صريح ولا تنبيه فشل (6.6). متوسّطة-عالية.\n15. `SESSION_EXPIRE_AT_BROWSER_CLOSE=False` على أجهزةٍ مدرسيّةٍ مشتركة (2.1). متوسّطة.\n16. `GUARDED_INSIDE` غير مضمونٍ ثابتاً؛ `schema/redoc` مفتوحان؛ `rum/collect` بلا throttle (3.1، 3.2). متوسّطة.\n17. 5 حقول رفعٍ بلا `FileTypeValidator`؛ صورة Docker بالوسم لا الـdigest؛ لا `--require-hashes` (7، 6.2، 6.5). متوسّطة.\n18. `from_db_value` fail-open يخفي فساد مفتاح، والتدوير بلا دفعاتٍ ولا توقّفٍ عند الفشل (4.1، 4.4). متوسّطة.\n19. `|safe` على JSON داخل `<script>` بدل `json_script` (7). منخفضة.\n20. `check --deploy` في predeploy بـ`|| echo`؛ الكناري يُتخطّى إن غاب المتغيّر (6.4، 6.7). منخفضة.\n\n### الفرص (Opportunities)\n1. إفراغ `national_id` الصريح بهجرة توسيعٍ ثمّ تقليص: البنية البديلة (HMAC + Fernet + HMACAuthBackend) موجودة وتعمل، فالكلفة بطاقة واحدة (4.2).\n2. vendoring الـJS مع SRI يحقّق ثلاثة أهدافٍ معاً: CSP بلا CDN، سلامة A08، لا اعتماد على طرفٍ ثالثٍ في وقت التشغيل (2.3، 6.2).\n3. نقل نمط العيادة («إشعار عامّ والتفاصيل داخل الجلسة») إلى السلوك بتعديلٍ في دالّةٍ واحدة (5.5).\n4. تفعيل CodeQL بملفّ workflow واحدٍ (python + javascript) بلا كلفة على مستودعٍ عامّ (6.1).\n5. شحن السجلّات إلى تخزينٍ خارجيّ (R2 نفسه) بأمر إدارةٍ يوميّ يُضاف إلى `backup.yml` (2.8).\n6. `FORCE ROW LEVEL SECURITY` + فصل دور التطبيق: هجرة واحدة ومتغيّر اتّصالٍ واحد (3.3).\n7. صفحة `/privacy/` من `privacy_notice_ar.md` الموجود + زرّ «نسخة بياناتي» عبر `log_export` الموجود (5.3).\n8. hash-chain على `AuditLog` بحقلٍ واحدٍ وأمر تحقّقٍ أسبوعيّ يُضاف إلى `monitor` القائم (4.5).\n9. تحويل رايات MFA/CSP إلى ثوابتٍ في `production.py` مع حارس اختبار (نمط الحرّاس القائم) (2.3، 3.4).\n10. `pip-compile --generate-hashes` و`FROM python@sha256` مع Dependabot القائم (6.2، 6.5).\n11. mixin تسجيل القراءة + حارس عدّ الـviews الحسّاسة غير الموسومة، بنمط `test_every_route_is_guarded` القائم (4.5).\n12. فحص الهجرات (`schoolos-migration-guard`) كخطوة CI على كلّ هجرةٍ جديدة بدل التشغيل اليدويّ (6.5).\n13. ADR أمنيّ مركزيّ يربط الـ24 حارساً بقراراتها: يجهّز المنصّة لتدقيق ISO خارجيّ بكلفةٍ توثيقيّةٍ فقط (9).\n14. إخفاء هويّةٍ إلزاميّ عند نسخ القاعدة لغير الإنتاج، بأمرٍ يفشل إن وجد رقماً صريحاً (2.10).\n15. ربط حدثٍ أمنيّ فوق عتبة → `BreachReport(suspected)` آليّاً من `monitor` القائم (5.4).\n\n### التهديدات (Threats)\n1. خرق قانونيّ PDPPL: بيانات أطفالٍ وصحّةٍ وسلوكٍ عند 5 معالِجين خارج قطر بلا DPIA ولا اتّفاقيّات ولا DPO (5.6). حرجة.\n2. تسريب نسخةٍ احتياطيّة (artifact GitHub أو `backup.sh` صريح) = كشف كلّ الأرقام الشخصيّة دفعةً لأنّها صريحة في القاعدة (4.2 + 6.6). حرجة.\n3. حادث أمنيّ لا يُكتشف ولا يُثبَت لغياب السجلّات الخارجيّة ونفاد Sentry؛ ثمّ تعذّر إخطار NCSA/CDP في 72 ساعة (2.8، 5.4). عالية.\n4. اختراق حزمة على jsdelivr/unpkg/cdnjs = تنفيذ شيفرةٍ في كلّ متصفّحٍ رغم nonce (2.3). عالية.\n5. تهديد داخليّ من حساب المطوّر/المالك: وصول كامل مع تدقيقٍ جزئيّ، لا يمكن إثبات ما قُرئ (3.6). عالية.\n6. إطفاء MFA أو CSP بتغيير متغيّر بيئةٍ على Railway بلا مراجعةٍ ولا أثر (2.3، 3.4). متوسّطة-عالية.\n7. انتقال إلى تعدّد المدارس في نشرٍ واحدٍ قبل إكمال `school_id` وFORCE RLS = تسريب بين مدارس (3.3). عالية عند حدوثه.\n8. مزوّد SMS أو بريد يُخترق أو يُستدعى قانونيّاً خارج قطر فيكشف نصوص مخالفات الأطفال (5.5). عالية.\n9. SSRF عبر WeasyPrint من قالبٍ يدخله محتوى مستخدم (اسم مدرسةٍ بوسم `<img>`) يصل خدمات Railway الداخليّة (7). متوسّطة.\n10. قنبلة XML/ذاكرة عبر رفع Excel في staging توقف العامل (7). متوسّطة.\n11. استبدال حزمة Python (typosquat/مرآة) بلا `--require-hashes`؛ أو إصدار `sentry-sdk` جديد يغيّر سلوك PII (6.2). متوسّطة.\n12. طلب اطّلاع/تصحيح من وليّ أمرٍ أو تفتيشٍ من الجهة المختصّة بلا إشعارٍ منشورٍ ولا آليّة = مخالفة موثَّقة (5.3). متوسّطة-عالية.\n13. نموّ `AuditLog` بلا حدٍّ يبطئ القاعدة ويخالف م.10، ويحمل أسماء طلبةٍ غادروا (4.5). متوسّطة.\n14. نسخة staging/preview بحمايةٍ أضعف تحمل بيانات إنتاجٍ حقيقيّة (2.10). متوسّطة.\n15. هجرة تلقائيّة في predeploy تقفل جدولاً كبيراً وقت الدوام مع تراجعٍ غير مجرَّب (6.5، 6.7). متوسّطة.\n\n## 13. ترتيب التنفيذ المقترح (لقرار المالك، لا بطاقات بلا أمره)\n\n1. الرقم الشخصيّ الصريح → عمود معتم (4.2). 2. السلوك بنمط العيادة (5.5). 3. السجلّات الخارجيّة + Sentry (2.8). 4. CodeQL + Bandit MEDIUM (6.1). 5. vendoring JS + CSP بلا CDN (2.3). 6. صفحة الخصوصيّة + نسخة بياناتي (5.3). 7. تشفير `reason`/`notes` (4.3). 8. تدقيق المطوّر الكامل (3.6). 9. R2 إلزاميّ + تنبيه فشل + إلغاء artifact (6.6). 10. FORCE RLS (3.3). 11. ثوابت MFA/CSP (3.4). 12. `url_fetcher` و`read_only` (7). والمسار القانونيّ (DPIA، المعالِجون، DPO) يسير بالتوازي خارج الشيفرة.\n\n— انتهى. 0301.\n\n\n---\n# الملحق ب — محور الجودة والعمليات والتسليم (0201، مفصَّل كما سُلِّم)\n# تقرير SWOT — محور الجودة الهندسيّة والعمليّات وسلسلة التسليم\nمنصّة SchoolOS · الإصدار المقيس: `origin/main` عند 6f7ec060 · التاريخ: 2026-10-21 · الجلسة: 0201 (الرصد والتقييم)\n\n## النطاق والمنهج\n- **النطاق:** الاختبارات، CI، الأداء وطبقة البيانات، المراقبة والعمليّات والنسخ الاحتياطي والنشر، التوثيق، الديون التقنيّة، وتدفّق التسليم (DORA). محاور الأمن والمنتج والبيانات الشخصيّة تغطّيها الجلسات الأخرى.\n- **المعايير:** ISO/IEC 25010 (جودة المنتج)، ISO/IEC/IEEE 29119 (الاختبار)، مقاييس DORA، ومبادئ SRE (مؤشّرات المستوى والأهداف وميزانية الخطأ).\n- **الدليل:** قراءة فقط من نسخة مصدَّرة من main بـ`git archive`، وقياسات `radon` وسجلّات GitHub Actions والدفتر عبر `gh` وأدوات المشروع. كلّ بند: دليل (ملفّ وسطر أو رقم)، تقييم، خطورة، توصية. ما لم يُقَس صُرّح به.\n- **قيد:** لم يُعدَّل أيّ ملفّ في المشروع، ولا إيداع ولا دفع ولا إيقاظ (التجميد قائم).\n\n## الخلاصة التنفيذيّة\n1. **التسليم من فئة Elite** بمقاييس DORA: 15.5 نشرة إنتاج يوميّاً على 31 يوماً، وسيط فتح ← دمج ساعة ونصف، صفر revert من 703 دمجات، واستعادة وسيطها 41 دقيقة.\n2. **أكبر خطر تشغيليّ نقطة فشل واحدة في النشر:** توقّف بناء Railway منذ 10:24 حبس 14 دمجاً و10 بطاقات، وليس لذلك مسار بديل موثَّق ولا تنبيه آليّ.\n3. **أكبر خطر أداء:** نحو 35 عملاً ثقيلاً متزامناً داخل الطلب (22 PDF، 10 Excel، استيراد، بريد) على daphne، مع اتّصال قاعدة جديد لكلّ طلب وبلا مهلة استعلام. آليّة النقل إلى مهامّ خلفيّة موجودة وجاهزة.\n4. **أكبر خطر جودة:** ميزانية CSS عند الحافة (هامش 0.3KB) تُسقط الدمج لأيّ إضافة صغيرة (سبب فشل #1204 اليوم)، والاختبار الليليّ أحمر 9 من 10، وحساسيّة الساعة مثبتة بالقياس.\n5. **أكبر ثغرة مراقبة:** السجلّات في ملفّ داخل حاوية زائلة، بلا JSON ولا معرّف طلب، وSentry بلا ربط بـcommit.\n6. **أكبر هدر في الفلو:** البوّابة حمراء 21.5% وغالبها سقّاطات ارتداد حقيقيّة لا تُشغَّل قبل الدفع، و237 إعادة اعتماد، وفحص «سطر الاعتماد» يفشل 31% بسبب رأس قديم.\n\n---\n\n## الاختبارات وCI (ISO 29119)\n\n### ت1) حجم الاختبارات\nالدليل: `tests/test_*.py` = 790 ملفّاً (821 على المستودع كلّه)؛ `grep -c \"def test_\"` في `tests/` = 10,175 دالّة و852 صنف `Test*`. آخر تشغيل ليليّ كامل ناجح (run 39385415254، 2026-10-20): 14,220 ناجحاً، 12 متخطّى، 12 xfail، 3,020 تحذيراً في 36:53، + 95 اختبار Playwright + 6 Lighthouse. التوزيع بالتطبيق (ملفّات/دوال): operations 200/2,341، core 128/1,185، notifications 59/1,240، quality 35/490، roadmap 27/883، student_affairs 25/251، staff_affairs 16/310، behavior 16/139، academic_management 15/319، command_center 12/231، assessments 11/211، clinic 9/91، governance 9/121، exam_control 5/87، reports 5/78، breach 4/104، parents 3/28، transport 3/72، wings 3/67، library 2/14، analytics 2/52، docs_viewer 1/48، وعابر للتطبيقات (حرّاس/CSS/CI) 191/1,496. الوسوم (`pyproject.toml:95-100`): `slow` 5، `integration` 1، `e2e` 9، `django_db` 1,293. اختبارات E2E ≈ 100 = 0.7%.\nالتقييم: حجمٌ كبير ومتوازن مع التطبيقات الثقيلة، لكنّ تصنيف المستويات (ISO 29119-2: وحدة/تكامل/نظام) غير مطبَّق؛ وسم `integration` شبه ميّت.\nالخطورة: متوسّطة.\nالتوصية: فرض وسمٍ للمستوى بحارسٍ (كما تُفرض `--strict-markers`) ليُقسَّم التشغيل ويُقرأ الهرم.\n\n### ت2) التغطية\nالدليل: `pyproject.toml:109-139`: `source=\".\"`، `omit` للهجرات وأوامر الإدارة و`tests/`؛ `fail_under = 70` (السطر 130، يحرسه `tests/test_ci_gates_are_honest.py`)؛ لا `branch = true` — تغطية أسطر فقط. القيمة المقيسة في آخر «pytest — تغطية» ناجحة (run 39603037187، 2026-10-21 13:03): `TOTAL 57213 6279 89%`.\nالتقييم: 89% فعليّة مقابل عتبة 70؛ العتبة لا تمسك تراجعاً إلّا بعد 19 نقطة؛ ولا قياس فروع.\nالخطورة: متوسّطة.\nالتوصية: رفع `fail_under` إلى 85 (سقّاطةً ترتفع مع القياس) وتفعيل `branch = true` بعتبة منفصلة.\n\n### ت3) الشظايا الستّ\nالدليل: `.github/workflows/quality-gate.yml:40-150`: مصفوفة `shard: [1..6]`، `timeout-minutes: 30`، توزيع حتميّ LPT (`tests/ci_sharding.py:33-47`) بأوزان وسيط زمن junit في `tests/ci_shard_weights.json` (726 ملفّاً موزوناً، مجموع 2,581ث). الأثقل: `test_weekly_teacher_sheet_fit.py` 272ث، `test_schedule_a3_sheet.py` 123ث، `test_layering.py` 85ث. الشظيّة 1 تحمل `makemigrations --check` و`check --fail-level WARNING` (الأسطر 116-128). `scripts/ci_shard_verify.py shards 6` (السطر 197) يمنع فقد اختبار. متوسّط الأزمنة في آخر 5 تشغيلات ناجحة (دقائق): ش1 10.1، ش2 7.6، ش3 7.5، ش4 7.6، ش5 10.0، ش6 9.0؛ والفجوة داخل التشغيل الواحد حتى 6.1 دقيقة. `scripts/prepush_check.py:287` يوثّق أنّ الشظيّة 5 علقت في #1221 (اختبار يستدعي `main()` فيعيد تشغيل pytest بلا نهاية، عولج بـ`PREPUSH_STRUCTURE_NESTED`).\nالتقييم: موازنة جيّدة بالقياس، لكنّ الشظيّة 1 تحمل خطوات خارج الأوزان، والأوزان بلا طابع تاريخ تحديث.\nالخطورة: منخفضة.\nالتوصية: نقل `makemigrations --check`/`check` إلى `fast-guards`، وتسجيل تاريخ تحديث الأوزان وفرض تحديثها دوريّاً.\n\n### ت4) التقلّب (flaky)\nالدليل: `pytest.mark.flaky` = 0، لا `pytest-rerunfailures`. `xfail` 5 كلّها في `tests/test_scheduler_audit.py:474-521,997` بـ`strict=True` وسبب عربيّ. `skip` 31، `skipif` 31، `pytest.skip(` 37. `pin_clock` في `tests/conftest.py:529-562` (تثبيت على أربعاء دوام) مستعملة في 40 ملفّاً؛ 100 ملفّ تقرأ الساعة، منها 49 بلا تثبيت (مثلاً `tests/test_auth_security.py`، `tests/test_data_retention.py`، `tests/t ity-scan.yml`: pip-audit + OSV + bandit؛ وسيط 5.4. استشاريّة: `pr-evidence`، `pr-approval-head` (فشل 8/30)، `visual-snapshots`، `nightly` (46.6 دقيقة)، `quality.yml` الأسبوعيّ (mutation-testing `continue-on-error` السطر 254). SAST في المستودع هو bandit وحده؛ أمّا CodeQL فمفعَّل من إعداد GitHub الافتراضي (أسبوعيّ؛ python وjavascript وactions) ولا ملفّ له في .github فلا يظهر في المراجعة ولا يُحجب به الدمج؛ ولا Semgrep ولا فحص CVE لحزم npm. ميزانيّات الأداء `tests/web_vitals.py:148-158`: lcp 2500ms، inp 300ms، requests 40، **css_kb 470**، js_kb 430؛ تُقاس خامّاً بلا ضغط (السطر 83). CSS المحمَّل دائماً = 469.7KB خامّاً (هامش 0.3KB)؛ و`tests/test_css_budget.py:42` `MAX_SHIPPED_BYTES = 276,480` مقابل 274,605 مصغَّراً (هامش 1,875 بايتاً)؛ gzip ≈124KB.\nالتقييم: بوّابة واحدة صادقة وشاملة؛ لكن 18.7 دقيقة وسيطاً وp90 33.7، وميزانيّتا CSS عند الحافة فأيّ +300 بايت خامّ يُسقط الدمج (وهو سبب فشل #1204 اليوم).\nالخطورة: عالية (CSS)، متوسّطة (الزمن).\nالتوصية: قرار مالك واحد: إمّا تقليص CSS فعليّ (≥10KB) أو قياس الميزانيّة مضغوطاً؛ وتقليل شظايا PR الوثائقيّة.\n\n### ت7) الثغرات\nالدليل: RBAC: `tests/test_every_route_is_guarded.py` يمشي كلّ مسار ويطلب بوّابة (قويّ)؛ CSRF 14 ملفّاً/9 دوالّ؛ rate-limit/throttle ملفّان/3 دوالّ؛ IDOR 0 دالّة مسمّاة؛ XSS 0؛ SQLi 0. WebSocket: 23 ملفّاً تذكر channels لكنّ `WebsocketCommunicator` في ملفّين فقط. PDF/Excel: 59 ملفّاً. الهجرات: 17 ملفّاً + `lintmigrations`. لا تغطية فروع، ولا درجة طفرات محجِبة، و3,020 تحذيراً بلا `-W error`.\nالخطورة: عالية (IDOR/throttle/WebSocket).\nالتوصية: حارس مسحيّ للـIDOR على نسق `test_every_route_is_guarded` (كلّ view يأخذ `pk` يُختبر بمستخدم من مدرسة أخرى)؛ اختبارات `WebsocketCommunicator` لكلّ consumer؛ `filterwarnings = error` تدريجيّاً.\n\n### قوّة/ضعف المحور (بالأثر)\nقوّة: (1) حارس آليّ لكلّ مسار بلا صلاحيّة؛ (2) تغطية 89% على 57,213 سطراً وعتبة محروسة؛ (3) 14,220 اختباراً ليليّاً و`ci_shard_verify.py` يمنع الفقد؛ (4) لا إعادة تشغيل تخفي التقلّب وxfail كلّها strict؛ (5) سقّاطات (mypy 1,165، الساعة 62، الطبقات، الهويّة، a11y)؛ (6) ملخّص بوّابة واحد محجِب يحكم 11 وظيفة؛ (7) prepush يطابق CI بإصداراته؛ (8) axe وweb-vitals وmobile وe2e محجِبة ولقطات بصريّة ×4.\nضعف: (1) ميزانيّة CSS عند 99.32% مصغَّراً؛ (2) الليليّ أحمر 9/10؛ (3) 49 ملفّاً تقرأ الساعة الحقيقيّة؛ (4) لا IDOR/XSS/SQLi مسمّى؛ (5) تغطية أسطر فقط وعتبة 70 تحت المقيس بـ19 نقطة؛ (6) وسيط البوّابة 18.7 دقيقة وp90 33.7؛ (7) وسم `integration` شبه ميّت؛ (8) WebSocket في ملفّين و3,020 تحذيراً غير محجوبة.\n\n---\n\n## الأداء وطبقة البيانات والمهامّ الخلفيّة (ISO 25010: كفاءة الأداء)\n\n### أ1) استعلامات N+1\nالدليل: فُحص 12 موضعاً. المؤكَّد:\n- `templates/substitute/absence_list.html:41` يقرأ `a.slot.period_number` داخل حلقة، والـview (`operations/views_schedule.py:320-322`) يجلب `assignments__substitute` فقط، والـslot مفتاح أجنبيّ (`operations/models/substitution.py:84`)، فيتولّد استعلام لكلّ تعيين.\n- `wings/absence_notice_services.py:67-76` (`reconcile_stuck`): استعلام `AuditLog` لكلّ تنبيه عالق داخل حلقة.\n- `notifications/services.py:557-562` (`send_pending_absence_alerts`): لكلّ تنبيه استعلامان ثمّ بريد متزامن لكلّ رابط، ويُستدعى من طلب HTTP (`notifications/views.py:118`): N+1 على الاستعلامات والشبكة معاً.\nالمرجَّح (لم يُتحقَّق من كلّ المستدعين): `api/serializers.py:144-149`، `quality/evaluation_services.py:316`، `templates/quality/partials/review_row.html:72`.\nالمغطّى: `quality/domain_detail`، `behavior/committee`، `smart_schedule`، `log_panel`، وواجهات API الرئيسيّة.\nثقافة القياس: `tests/test_n_plus_one_queries.py` يوثّق 7 حالات أُصلحت 2026-09-14. تغطية التحسين متفاوتة: operations 90 view مقابل 97 select_related؛ ضعيفة في developer_feedback (16/1)، breach (11/1)، roadmap (6/0)، ux_survey (6/0).\nالتقييم: المتبقّي قليل ومحدود الحجم.\nالخطورة: متوسّطة (البند الثالث عالية لأنّه شبكة متزامنة داخل الطلب).\nالتوصية: إضافة `assignments__slot` إلى prefetch؛ تجميع استعلام AuditLog بـ`object_id__in`؛ نقل إرسال تنبيهات الغياب إلى Celery؛ تثبيت الحالات المرجَّحة باختبارات `assert_flat`.\n\n### أ2) الفهارس\nالدليل: `db_index=True` 24، `models.Index` 233، `UniqueConstraint` 172. الحضور (`operations/models/attendance.py:160-173`) مركّبات (school,session) و(student,status) و(student,status,marked_at) وفهرس جزئيّ؛ والتاريخ على `Session` مع (school,date) و(teacher,date) و(class_group,date). المخالفات (`behavior/models.py:211-225`) و`AuditLog` (`core/models/audit.py:57-66`) مفهرسة. لا فهرس فصل مباشر على الدرجات (`assessments/models.py:61-71`).\nالهجرات: 31 هجرة فهارس، اثنتان فقط بـCONCURRENTLY (`operations/migrations/0055`، `0092`). 29 هجرة بلا CONCURRENTLY على جداول كبيرة (`operations/migrations/0003`، `behavior/migrations/0008`، `core/migrations/0012` و`0028`، `notifications/migrations/0011`)، وكلّها مطبَّقة تاريخيّاً.\nالتقييم: تغطية جيّدة لحقول التصفية الشائعة؛ الخطر مستقبليّ لأنّ القاعدة غير مفروضة آليّاً.\nالخطورة: منخفضة.\nالتوصية: قاعدة migration-linter تُلزم `AddIndexConcurrently` للفهارس الجديدة على الجداول الكبيرة؛ النظر في فهرس يخدم تقارير الفصل على الدرجات.\n\n### أ3) الصفحات الثقيلة وعدّ الاستعلامات\nالدليل: لوحة المدير (`core/dashboard_selectors.py:143-187`) نحو 10-12 استعلام COUNT مستقلّ بلا تجميع ولا cache. سقوف مقيسة في الاختبارات: يوم المشرف 13 دافئاً/25 بارداً بسقف 16/30 (`tests/test_supervisor_day.py:178-181`)، ملخّص اليوم ≤14 (`tests/test_day_summary.py:220`)، شبكة الشعبة ≤3 (`tests/test_class_grid.py:918`)، تفضيلات المعلّمين ≤40. إجمالاً 113 تأكيد عدّ استعلامات في 38 ملفّاً من 821.\nالتقييم: ثقافة قياس راسخة في operations وwings؛ لوحات الأدوار والتقارير والتحليلات بلا سقف مقيس.\nالخطورة: متوسّطة.\nالتوصية: `assert_max_num_queries` لكلّ لوحة دور (20 دوراً) ولصفحات التقارير الستّ (`reports/views.py:347-568`).\n\n### أ4) الذاكرة المؤقّتة (cache)\nالدليل: الإنتاج Redis إن وُجد `REDIS_URL` وإلّا LocMem (`shschool/settings/production.py:179-192`). الاستعمال: `cache.get` 31، `cache.set` 27، `cache_page` 10 (9 في `analytics/views.py`، 300 ثانية)، `{% cache %}` 0، `get_or_set` 0. أفضل نمط: استطلاع حيّ TTL 20ث بقفل `cache.add` ونسخة احتياطيّة (`operations/day_selectors.py:472-498`). الإبطال منظَّم لعضويّة المستخدم فقط (`core/models/user.py:304`)؛ والباقي بانقضاء TTL فتتأخّر التحليلات حتى 5 دقائق. الجلسات في قاعدة البيانات افتراضاً (`production.py:197-206`).\nالتقييم: استعمال محافظ وصحيح، لكنّه لا يغطّي اللوحات.\nالخطورة: منخفضة.\nالتوصية: تخزين عدّادات لوحة المدير 30-60ث؛ مفتاح إصدار لإبطال `cache_page`؛ قرار صريح في `USE_REDIS_SESSIONS`.\n\n### أ5) Celery والمهامّ الخلفيّة (قاعدة >300ms)\nالدليل: نحو 45 مهمّة `@shared_task`؛ Beat فيه 17 مدخلاً + 3 مشروطة (`shschool/celery.py:67-161`). السياسات: `TIME_LIMIT=300/SOFT=240`، `PREFETCH_MULTIPLIER=1` (`production.py:227-230`)، العامل `--concurrency=2 --max-tasks-per-child=100`، `max_retries` 2-3. `acks_late` غير مضبوط. **`CELERY_TASK_ALWAYS_EAGER = not CELERY_ASYNC_ENABLED`** (`production.py:210-238`): تعمل المهامّ داخل طلب الويب إن لم تُضبط `CELERY_ASYNC_ENABLED`.\nقوّة: سجلّ تصدير يُلزم المهمّة الخلفيّة ما لم يُقَس p95 ≤1000ms بمصدر وتاريخ (`core/exports/registry.py:21,68-77`، 11 نوعاً)؛ توليد الجدول بمهمّة (`operations/views_schedule.py:861`).\nما زال متزامناً داخل الطلب: 22 استدعاء `render_pdf` (WeasyPrint) من الـviews (`reports/views.py:347,392,428,478,523,568`، `student_affairs/views.py:1949,2492,2577,2638` وغيرها)؛ نحو 10 مواضع Excel (`student_affairs/views.py:495,1429,2188,2268,2366`، `core/views_students.py:132,299,390`)؛ استيراد الطلبة (`core/views_students.py:246` ← `core/services.py:243-261`، upsert لكلّ صفّ)؛ بريد متزامن (`notifications/views.py:118,163,173`).\nالتقييم: بنية ناضجة (heartbeat وreaper وDLQ وحدود لكلّ مهمّة) لكنّ التطبيق جزئيّ: نحو 35 نقطة عمل ثقيل داخل الطلب على daphne.\nالخطورة: عالية.\nالتوصية: تحويل PDF/Excel المتبقّية إلى أنواع في سجلّ التصدير؛ استيراد الطلبة إلى مهمّة بتقدّم؛ البريد عبر `notifications.tasks`؛ `acks_late=True` للمهامّ المتكافئة (idempotent)؛ اختبار نشر يفشل إن غاب `CELERY_ASYNC_ENABLED`.\n\n### أ6) الاتّصال بقاعدة البيانات والمهل\nالدليل: `CONN_MAX_AGE=600` في base (`base.py:192,205`) يُصفَّر في الإنتاج بسبب daphne (`production.py:23`) فيُفتح اتّصال جديد لكلّ طلب؛ لا pooling ولا pgbouncer. `statement_timeout` اختياريّ افتراضه 0 (`production.py:34-40`). لا `--http-timeout` في daphne. الترقيم: DRF `PAGE_SIZE=50`، `Paginator` في 11 ملفّاً.\nالتقييم: اتّصال لكلّ طلب + غياب مهلة استعلام + 22 PDF متزامناً = تعرّض لاستنزاف الاتّصالات عند الذروة.\nالخطورة: عالية.\nالتوصية: `DB_STATEMENT_TIMEOUT_MS` (نحو 15000) على الويب، أو pool في psycopg3 (`OPTIONS={\"pool\": ...}`)، أو pgbouncer؛ تثبيت مهلة daphne.\n\n### أ7) الملفّات الثابتة والواجهة\nالدليل: WhiteNoise + `MinifiedManifestStaticFilesStorage` (Brotli/GZip وبصمة وتصغير؛ `core/static_storage.py:39`). `static/css` 548KB خاماً (11 ملفّاً)، `static/js` 632KB (28 ملفّاً؛ `chart.umd.min.js` 205KB). `base.html` يحمّل 8 ملفّات CSS دائماً (`core/css_files.py:24-37`)، و15 وسم script منها 12 بـ`defer`؛ preload لخطّي Tajawal؛ `loading=\"lazy\"` في 4 مواضع فقط. عامل الخدمة `schoolos-global-v8` (`templates/pwa/sw_global.js:21`).\nالتقييم: أنبوب سليم، لكنّ 8 طلبات CSS لكلّ صفحة وChart.js 205KB.\nالخطورة: منخفضة.\nالتوصية: دمج ملفّات custom في حزمة واحدة وقت collectstatic؛ تحميل chart.js في صفحات التحليلات فقط؛ توسيع lazy للصور.\n\n### قوّة/ضعف المحور\nقوّة: (1) سجلّ تصدير يُلزم المهمّة الخلفيّة؛ (2) 113 تأكيد استعلامات وملف ارتداد N+1؛ (3) فهارس مركّبة على الحضور والحصص والمخالفات والتدقيق و172 قيداً فريداً؛ (4) استطلاع حيّ بقفل ضدّ stampede؛ (5) Beat شامل مع heartbeat وreaper وDLQ؛ (6) أنبوب static ناضج؛ (7) `cache_page` على 9 لوحات؛ (8) نمط CONCURRENTLY موجود وموثَّق.\nضعف: (1) 22 PDF و10 Excel واستيرادان متزامنة؛ (2) اتّصال جديد لكلّ طلب بلا pool ولا statement_timeout؛ (3) المهامّ eager داخل الويب ما لم تُضبط `CELERY_ASYNC_ENABLED`؛ (4) تنبيهات الغياب متزامنة من HTTP مع N+1؛ (5) لوحة المدير 10-12 COUNT بلا cache؛ (6) N+1 مؤكَّد في قائمة البدلاء و`reconcile_stuck`؛ (7) 29 هجرة فهارس بلا CONCURRENTLY؛ (8) 8 طلبات CSS و`acks_late` غير مضبوط.\n\n---\n\n## العمليّات والمراقبة والنسخ الاحتياطي والنشر والتوثيق والديون التقنيّة (ISO 25010: الموثوقيّة وقابليّة الصيانة)\n\n### ع1) التسجيل (Logging)\n\nالدليل: `LOGGING` يُعرَّف في `shschool/settings/production.py:241-349` وحدَه (لا `LOGGING` في `base.py` ولا `development.py` ولا `testing.py`). المعالِجات ثلاثة: `file` (RotatingFileHandler إلى `logs/django.log`، 10MB×5، سطر 262-272)، `security_file` (`logs/security.log`، 5MB×10، سطر 274-282)، `console` إلى stdout (سطر 290-294). المنسِّقان نصّيّان `verbose` و`security` (سطر 244-253) — لا JSON. فلتر `pii_masking` (`core/logging_filters.py:13`) على المعالِجات الثلاثة؛ يحجب الرقم الشخصيّ والهاتف والبريد بأنماط regex (سطر 28-30) ويُقنِّع traceback (سطر 43) — لا الأسماء (مُعترَفٌ به في تعليق production.py:330-333). المستوى الجذريّ WARNING. لا request_id: لا middleware ولا formatter يحمله. مجلّد `logs/` فيه `.gitkeep` فقط. `docs/monitoring/structured-logging.md` دليلُ تنفيذٍ لـJSON لم يُطبَّق (يقول صراحةً «Current State: text-based formatters»)؛ و`observability-stack.md` يرسم «stdout (JSON)» وهو غير صحيح.\n\nالتقييم: معالِج الملفّ في حاوية Railway زائلة لا يُقرأ (التعليق في production.py:313-315 يقرّ بذلك) فسجلّات `django` و`channels` و`notifications` (ملفّ فقط) تضيع عمليّاً. حجب PII حاضرٌ لكنّه جزئيّ، وغياب معرّف الطلب يمنع ربط سطور سجلّ بطلبٍ واحد أو بحدث Sentry.\nالخطورة: عالية.\nالتوصية: نقل `django`/`channels`/`notifications` إلى `console`؛ منسِّق JSON مع حقل `request_id` من middleware خفيف ووسمه في Sentry scope؛ توحيد `LOGGING` أساسيّ في `base.py` يُورَّث.\n\n### ع2) Sentry\n\nالدليل: `production.py:52-129`. DSN من `SENTRY_DSN` (سطر 52). `send_default_pii=False` (120)، `before_send` من `core/sentry_config.py:98` يُسقط ضوضاءً ويستدعي `_scrub_event_pii` (203-255: message/logentry/exception values/frame vars/breadcrumbs/extra). `traces_sampler` (136-165: 0 لـhealth/static، 0.3 لـcelery.task، 0.15/0.1 للباقي)، `profiles_sample_rate=0.1`، قابلٌ للإطفاء بـ`SENTRY_PERFORMANCE_ENABLED`. `release` من `APP_VERSION` وإلّا `v{PLATFORM_VERSION}` (125) — لا ربط بـcommit SHA رغم توفّر `RAILWAY_GIT_COMMIT_SHA` (مستعمَل في `views_health.py:87`). التكاملات: Django، Celery (`monitor_beat_tasks=True`)، Redis، Logging. لا تكامل channels/ASGI صريح (DjangoIntegration يغطّي HTTP لا مستهلكي WebSocket). السياق: `SentryScopeMiddleware` (`core/middleware.py:228`) يضع `user.id` والدور والمدرسة فقط.\n\nالتقييم: تهيئةٌ ناضجة ومراعية لـPDPPL. الفجوتان: الإصدار اسمٌ ثابت لا SHA، وأخطاء مستهلكي WebSocket قد لا تُلتقط بسياق.\nالخطورة: متوسّطة.\nالتوصية: `release=RAILWAY_GIT_COMMIT_SHA`؛ إضافة تكامل ASGI؛ اختبار يضمن أنّ استثناءً في consumer يصل Sentry.\n\n### ع3) المقاييس والصحّة\n\nالدليل: `grafana/` = `README.md` + `schoolos-dashboard.json` فقط؛ README يصف Grafana Cloud بسحب `/metrics` عبر Alloy ويعرّف SLO (p95<500ms، 5xx<0.1%، توافر 99.9%) وتنبيهات P1-P3 — إعدادٌ يدويّ موثَّق، لا دليل على أنّه مُطبَّق (لا ملفّ alloy/prometheus.yml/alert rules في المستودع). `django-prometheus==2.5.0` مثبّت و`/metrics` محميّ (`shschool/urls.py:84-88`، `METRICS_ALLOWED_IPS`) — والمقاييس بذاكرة العمليّة الواحدة (تعليق `command_center/webstats.py:1`). نقاط الصحّة في `core/views_health.py`: `/health/` (41: db + cache + static + commit + latency_ms)، `/ready/` (97: DB فقط، 503 عند الفشل)، `/status/` (131: db/redis latency + migrations غير المطبَّقة + version)، `/health/worker/` (212: نبضة العامل من Redis، `MAX_AGE_SECONDS=900` في `core/worker_heartbeat.py:22`، تكتبها مهمّة beat كلّ 5 دقائق `shschool/celery.py:125`). لا فحص عمق الطابور في أيّ نقطة. المراقبة الخارجيّة: `.github/workflows/monitor.yml` كلّ 15 دقيقة و`worker-heartbeat.yml` كلّ 10 دقائق و`post-deploy-canary.yml` بعد كلّ نشر (`scripts/canary-check.sh` يثبت `commit` حيّاً و`/auth/login/` 200).\n\nالتقييم: صحّةٌ غنيّة وكناريٌ ذكيّ، لكنّ الـGrafana لوحةٌ على الورق، ومقاييس Prometheus في عمليّةٍ واحدة بلا جامع، والتنبيه يعتمد جدولة GitHub «بأفضل جهد».\nالخطورة: متوسّطة.\nالتوصية: إمّا تفعيل Alloy فعليّاً وإيداع قواعد التنبيه كملفّ، أو حذف `grafana/` وإعلان Sentry+GitHub Actions المصدرَ الوحيد؛ إضافة `queue_depth` إلى `/status/`.\n\n### ع4) النسخ الاحتياطي والاستعادة\n\nالدليل: `.github/workflows/backup.yml`: يوميّاً 01:00 UTC (سطر 21، «RPO ≤ 24h»)، `pg_dump` ← `gpg` متماثل بـ`BACKUP_PASSPHRASE` ← Cloudflare R2 `db-backups/` (111) أو artifact 90 يوماً إن غاب R2 (93-98). تمرين الاستعادة مؤتمت: `backup-restore-test.yml` أسبوعيّاً السبت 02:30 UTC يُنزِل الأحدث ويفكّه ويستعيده بـ`psql` ويتحقّق (130-142). بطاقة حالة النسخ في الإدارة تقرأ GitHub API بمهمّة Celery (`core/backup_status.py`). `backup.sh` في الجذر قديم (آخر إيداع 2026-03-25) لـdocker-compose/S3 — مسارٌ مهجور يضلّل. `railway.ts:128` يعرّف `bucket(\"Postgres-PITR\")`. الاستعادة اليدويّة موثَّقة سطراً واحداً في `DEPLOYMENT-RAILWAY.md:279` و`scripts/restore-prod-locally.sh`. RTO غير مذكور في أيّ مكان؛ لا تمرين استعادة إلى الإنتاج (`docs/runbooks/post_deploy_monitoring.md`: «التراجعُ موثَّق لا مجرَّب»).\n\nالتقييم: أفضل بندٍ في المحور: تشفير + تخزين خارجيّ + تمرين استعادة أسبوعيّ آليّ. النقص: RTO غير معرَّف، لا توثيق لإجراء استعادة كاملة على Railway، والنسخ pg_dump لا WAL (RPO 24 ساعة فعليّاً ما لم تُفعَّل PITR).\nالخطورة: متوسّطة.\nالتوصية: وثيقة `docs/deployment/backup_restore.md` تعلن RPO/RTO وخطوات الاستعادة إلى الإنتاج؛ حذف `backup.sh`؛ التحقّق من تفعيل PITR على Railway.\n\n### ع5) النشر على Railway\n\nالدليل: `.railway/railway.ts` مصدر الحقيقة (منذ 2026-09-05) يعرّف ثلاث خدمات بـ`source: github(REPO)` + `DOCKERFILE` (97-127): `shschool_mvp` (web، `preDeploy: scripts/railway-predeploy.sh` = migrate + seeds + collectstatic + `check --deploy`؛ `start: scripts/railway-release.sh` = `verify_runtime_db_role` fail-closed + daphne بدور RLS)، `celery-worker` و`celery-beat` (بلا healthcheck ولا preDeploy). الثلاث تلقائيّة عند الدفع إلى main (`DEPLOYMENT-RAILWAY.md:202-204`، `runbook.md:164`)؛ `deploy-railway.yml` بـ`workflow_dispatch` يدويّ. `Procfile` قديم: يشغّل daphne بلا RLS و`beat` مختلف عن railway.ts — مصدران متعارضان. `Dockerfile`: مرحلتان، مستخدم `appuser` غير root، `HEALTHCHECK` على `/health/`، لكنّ `CMD` الافتراضيّ يجري `migrate` عند كلّ بدء (يتجاوزه railway.ts؛ يبقى خطراً في `docker-compose.prod.yml`). Zero-downtime: healthcheck مع `healthcheckTimeout: 100` وpreDeploy مرّةً واحدة — جزئيّ. Rollback: `rollback.yml` يفتح طلب دمج يُعيد الشجرة، أو `railway redeploy` بيد المالك — موثَّق لا مجرَّب. Beat يحفظ جدوله في `/tmp/celerybeat-schedule` — يضيع عند كلّ نشر (مقبول). `docs/postmortems/2026-04-06-railway-deployment.md` واحد.\n\nتوقّف بناء Railway اليوم (2026-10-21): لا ذكرَ له في المصدر. أثره: الدمج إلى main لا يُنشر؛ `post-deploy-canary.yml` لا يُطلَق؛ `rollback.yml` بلا فائدة؛ النسخ الاحتياطيّ وتمرين الاستعادة والمراقبة الخارجيّة لا تتأثّر؛ الإنتاج يبقى على آخر صورة ناجحة.\n\nالتقييم: سلسلة نشرٍ محكمة (fail-closed على RLS، كناري بالـcommit، نافذة نشر مفروضة في `deploy_window.py`)، لكن بنقطة فشلٍ واحدة (بناء Railway) بلا خطّة بديلة موثَّقة، وملفّات موروثة متعارضة.\nالخطورة: عالية.\nالتوصية: حذف `Procfile` و`CMD` المهاجر أو مطابقتهما لـrailway.ts؛ توثيق «ماذا لو توقّف البناء» (بناء الصورة في GH Actions ودفعها إلى GHCR، `railway up --image`)؛ healthcheck للعامل عبر `/health/worker/`.\n\n### ع6) الأمن التشغيليّ\n\nالدليل: `production.py:148-168`: `SECURE_SSL_REDIRECT`، HSTS 31536000 + subdomains + preload، `SESSION_COOKIE_SECURE`/`CSRF_COOKIE_SECURE`، `SESSION_COOKIE_AGE=8h`، `X_FRAME_OPTIONS=DENY`، Referrer/COOP. `base.py:345-352`: HttpOnly + SameSite=Lax. CSP بـ`django-csp==4.0` (base.py:462-490، production.py:366-392) مع `CSP_ENFORCE` افتراضه True ونونس. Rate limiting: DRF throttles (base.py:381-390)، `django-ratelimit` مع `RATELIMIT_FAIL_OPEN=True` (830، موثَّق السبب)، `django-axes` 5 محاولات/5 دقائق (527-561). الأسرار: ~65 متغيّراً عبر `config()`؛ railway.ts يسرد الأسماء بلا قيم؛ `.secrets.baseline` (47 مدخلاً) وdetect-secrets في `.pre-commit-config.yaml:39-42` وفي `quality-gate.yml`؛ bandit مهيّأ (pyproject:142). الإنتاج يرفض الإقلاع بلا SECRET_KEY/FERNET_KEY (production.py:132-140).\n\nالتقييم: صلبٌ ومطابق لـOWASP ASVS على مستوى الإعدادات. ملاحظة: `RATELIMIT_FAIL_OPEN=True` + سقوط Redis = لا حدّ على باب الدخول (axes في DB يبقى).\nالخطورة: منخفضة.\nالتوصية: مراجعة دوريّة لـ`.secrets.baseline`؛ اختبار يثبت أنّ axes يحمي حين يسقط Redis.\n\n### ع7) التوثيق\n\nالدليل: `docs/` 226 ملفّاً (181 md) في 21 مجلّداً؛ `AAdocs/` 47؛ `decisions_registry/` تطبيق Django لا مجلّد وثائق؛ `handover_notes/` 5. ADRs: `docs/adr/0001..0009`. README.md 478 سطراً، آخر إيداع 2026-10-12 لكنّ عنوانه «SchoolOS v5.1 — مارس 2026» بينما الشيفرة تذكر v5.5/v5.6 (production.py:50، base.py:101). `DEPLOYMENT-RAILWAY.md` آخر تعديل 2026-09-17 ويصف beat بـDatabaseScheduler (127) خلافاً لـrailway-beat.sh. Runbooks: `docs/deployment/runbook.md` (2026-09-14)، `docs/runbooks/post_deploy_monitoring.md` (2026-10-17)، `docs/governance/parents_freeze_runbook.md`، `docs/INCIDENT_RESPONSE.md` (29 سطراً، هيكل عام بلا أدوار/قوائم فحص)، postmortem واحد، `docs/monitoring/` 7 ملفّات (بعضها يصف ما لم يُنفَّذ). `docs_viewer/` عارضٌ لا مولّد.\n\nالتقييم: كثافة توثيق عالية جدّاً، لكنّها غير مُحكَمة الصحّة: وثائق تصف حالةً مستهدفة كأنّها قائمة، وتعارض بين Procfile/DEPLOYMENT-RAILWAY/railway.ts، وملفّات تاريخيّة في جذر docs. لا playbook تشغيليّ (DB down / Redis down / worker dead) سوى runbook النشر.\nالخطورة: متوسّطة.\nالتوصية: وسم كلّ وثيقة بـ«حالة: مطبَّق/مقترَح/مهجور» وتاريخ؛ أرشفة `docs/*_2026-07-06.md`؛ playbooks تشغيليّة لثلاث حالات على الأقلّ؛ مزامنة README مع `PLATFORM_VERSION`.\n\n### ع8) الديون التقنيّة\n\nالدليل (radon 6.0.1 مقيس):\n- الحجم: 2207 ملفّ Python، ~357K سطر (بلا هجرات)؛ 377 قالباً.\n- أكبر ملفّات Python (بلا tests/migrations): `student_affairs/views.py` 2821، `core/domain/grades.py` 1748، `behavior/conduct_2026.py` 1472، `reports/services.py` 1439، `operations/views_schedule.py` 1430، `notifications/tasks.py` 1407، `core/permissions.py` 1112، `academic_management/assignment_services.py` 1081، `student_affairs/services.py` 1058، `behavior/views.py` 1053، `operations/scheduler_constraints.py` 1026، `shschool/settings/base.py` 857.\n- أكبر القوالب: `base/base.html` 1410، `styleguide/components.html` 670، `schedule/print_schedule.html` 571، `schedule/smart_schedule.html` 487، `reports/student_result_pdf.html` 479.\n- TODO/FIXME/HACK/XXX: 15 فقط — منخفض جدّاً.\n- التعقيد الحلقيّ ≥ C: 484 دالّة (402 C، 73 D، 6 E، 3 F). الأعلى: `core/management/commands/import_staff_register.py:198` F(48)، `operations/management/commands/import_timetable_pdf.py:235` F(43)، `scripts/real_seed.py:73` F(43)، `scripts/seed_quality.py:76` E(40)، `scripts/affected_tests.py:329` E(35)، `core/management/commands/sync_departments.py:223` E(34)، `operations/scheduler.py:596 generate_schedule` D(30). بوّابة CI تفشل عند ≥31 لكنّها تستثني `scripts/*` و`management/commands/*` (quality-gate.yml:421) — وهناك تتركّز كلّ الـE/F. في الشيفرة الحيّة: `core/domain/grades.py` 5 دوال D (1024, 1079, 1317, 1396, 1709)، `operations/excuses.py:163` D(27)، `governance/erasure_service.py:282` D(27)، `notifications/tasks.py:1064` D(28).\n- التكرار: `operations/scheduler_v2/` إلى جانب `operations/scheduler.py` (V1 حيّ وV2 — ADR-0008 يوثّقه). لا ملفّات `_old/_backup`.\n- الهجرات: 419؛ operations 96، core 85، roadmap 82، quality 25، behavior 25.\n- الإعدادات: 6 ملفّات (base 857، production 480، development 153، testing 141، staging 106، preview 45). `LOGGING` و`CSP_ENFORCE` و`CELERY_*` في production فقط؛ testing يعيد تعريف `MIDDLEWARE` و`DATABASES`.\n- الاعتماديّات: requirements.txt 148 حزمة، 147 مثبّتة `==`، واحدة بمدى (`sentry-sdk[django]>=2.72.0` — خطر انجراف). الإصدارات حديثة (Django 5.2.18، celery 5.6.3، redis 8.1.0، DRF 3.18.3، weasyprint 70). pyproject يضبط ruff/mypy(django-stubs)/bandit/mutmut/coverage.\n\nالتقييم: ديْن التعقيد مركّز في أوامر الاستيراد والبذر (خارج بوّابة CI)، وفي `core/domain/grades.py` (منطق التقييم القطريّ — حسّاس) و`student_affairs/views.py` (2821 سطراً، مخالف لـSkinny Views). الاعتماديّات والهجرات صحّيّة.\nالخطورة: متوسّطة.\nالتوصية: تثبيت sentry-sdk؛ إدخال `management/commands/*` في بوّابة التعقيد بعتبة E؛ خطّة تفكيك `student_affairs/views.py` و`base.html`؛ موعد إطفاء V1 بعد اعتماد V2.\n\n---\n\n## تدفّق التسليم ومقاييس DORA (2026-09-21 → 2026-10-21)\n\nالمصدر: الدفتر `delivery_manager_work/ledger/events.jsonl` (8,425 حدثاً) وGitHub عبر `gh` (قراءة فقط، قيست 17:05 الدوحة). ملاحظة منهجيّة: من 474 بطاقة بلغت merged أو published، 154 مزامنة جماعيّة تُختم مراحلها في اللحظة نفسها بلا جلسة، و320 مسجَّلة بجلسة. لذا يُعرض المقياسان: «الكلّ» و«الفعليّ» (بجلسة وأكثر من دقيقة).\n\n### د1) أزمنة الانتقال في الدفتر\n| المرحلة | الكلّ: وسيط / p90 | الفعليّ: وسيط / p90 |\n|---|---|---|\n| ready_for_review ← approved | 0.06 س / 13.0 س | 1.13 س / 23.5 س |\n| approved ← pushed | 0.14 س / 14.5 س | 2.00 س / 21.6 س |\n| pushed ← merged | 0.09 س / 11.7 س | 2.14 س / 30.5 س |\n| merged ← published | 0.00 س / 0.6 س | 0.36 س / 10.9 س |\n| أوّل ready ← آخر published | 5.3 س / 53.7 س | — |\nأداة المشروع `ledger_lead_time.py`: التوجيه ← النشر وسيطه 24.3 س (n=283)، والالتقاط ← النشر 20.8 س (n=456).\nإبطال الاعتماد: 78 إبطالاً في 37 بطاقة؛ و237 إعادة اعتماد على رأس مختلف منذ البداية (واجهة 57%، كود 22%، اختبارات فقط 13%). إعفاءات الرأس: main-merge 41، tests-only 18، red-fix 8، docs 6، types-only 5، reviewed-diff 3.\nالراكد: 45 ملتقطة و22 موجَّهة أقدم من 7 أيام، منها 26 بلا أيّ نشاط (أقدمها 22.8 يوماً).\nالتقييم: الوسيط ممتاز، والذيل طويل (p90 بين 21 و30 ساعة) وسببه انتظار المالك والدفع اليدويّ.\nالخطورة: متوسّطة.\nالتوصية: سقف زمنيّ للانتقال approved ← pushed (تنبيه عند 4 ساعات)، وفرز أسبوعيّ للراكد.\n\n### د2) مقاييس DORA الأربعة\n| المقياس | القيمة | المستوى |\n|---|---|---|\n| تواتر النشر | 481 نشرة إنتاج في 31/31 يوماً = 15.5 يوميّاً (أقصى 42 في 10-03)؛ 703 دمجات بسحق = 22.7 يوميّاً | Elite |\n| زمن الوصول للتغيير | فتح ← دمج: n=738، وسيط 1.53 س، p90 12.2 س، 34% أقلّ من ساعة؛ جاهز ← نشر 5.3 س | Elite |\n| معدّل فشل التغيير | 0 revert من 703؛ red-fix بعد الدفع 0.9%؛ فشل canary 13 من 427 = 3.0% | Elite |\n| زمن الاستعادة | وسيط 41 د من فشل canary إلى نجاح تالٍ (أقصى 306 د)؛ حادثة 09-17 استغرقت 3.5 س | Elite/High |\nإضافة: 89 من 738 دمجاً (12%) وقعت داخل نافذة الدوام المحظورة، والحارس يمنع الطابور وحده.\nالتقييم: أداء من أعلى فئات DORA. التحفّظ: مقاييس «الكلّ» تضخّمها المزامنة الجماعيّة، ولا قياس لزمن بناء Railway لأنّه لا يظهر عبر GitHub.\nالخطورة: منخفضة.\nالتوصية: نشر مقياس DORA أسبوعيّاً بعد استبعاد المزامنات، ورصد مدّة البناء.\n\n### د3) حمرة CI\n| سير العمل | n | فشل | النسبة |\n|---|---|---|---|\n| Quality Gate (منذ 09-26) | 1,961 | 365 (261 على claude/*، 5 على main) | 21.5% (+264 ملغى) |\n| سطر الاعتماد يطابق الرأس (منذ 10-20) | 135 | 38 | 31.4% |\n| Security Scan | 1,946 | 12 | 0.6% |\n| Nightly على main | 35 | 14 | 41.2% |\n| canary بعد النشر | 1,032 | 13 | 3.0% |\nعيّنة 10 تشغيلات فاشلة: 10/10 حقيقيّة و0 بيئيّة. الأسباب: حارس pin_clock (4)، حارس الطبقات (2)، سقّاطة الوصوليّة (2)، تصنيف مسارات العيادة (2)، sticky_table_header (2)، page_layouts (2)، data_retention (2)، تشفير تاريخ الميلاد (2)، ميزانية web-vitals (1)، dark_parity (1). أي أنّ الغالب سقّاطات ارتداد لا كسر وظائف. فشل «سطر الاعتماد» كلّه `stale_head`: السطر كُتب على رأس قديم.\nأزمنة CI على 10 تشغيلات ناجحة: البوّابة كاملة وسيطها 24.7 د، p90 50.2، أقصى 59.2 (الذيل من طوابير runners)؛ الشظيّة وسيطها 8.9 د، p90 10.7؛ Playwright 9.3 د؛ axe mobile 8.0 د؛ مدقّق الهجرات 3.6 د.\nالتقييم: الفشل يلتقط ارتداداً حقيقيّاً (إيجابيّ)، لكنّه يُكتشف في CI لا قبل الدفع، فيحرق دقائق runner ويعيد الدورة. أسوأ الأيّام: 10-11 (39 فشلاً) و10-13 (36).\nالخطورة: متوسّطة.\nالتوصية: إدخال حرّاس pin_clock والطبقات والوصوليّة وتصنيف المسارات في prepush؛ وكتابة سطر الاعتماد آليّاً بعد تثبيت الرأس.\n\n### د4) المحجوب لحظة القياس\n- طلبان مفتوحان: 1218 (عمره 4.4 س، 42 فحصاً ناجحاً، نظيف) و1204 (9.4 س، ثلاثة فحوص فاشلة).\n- معتمد بلا دفع: 5 (أقدمها 23.4 س)؛ مدفوع بلا دمج: 1؛ جاهز للمراجعة: 13 (أقدمها 30.4 س).\n- مدموج بلا نشر: 10 بطاقات في الدفتر. الإنتاج على 1bf2774 منذ 09:34 الدوحة، وعلى main بعده 14 دمجاً غير منشور أوّلها 10:23، وهو يطابق توقّف بناء Railway 10:24.\nالتقييم: نقطة فشل واحدة في النشر، ولا تنبيه آليّ في الدفتر عن توقّف المنصّة المستضيفة.\nالخطورة: عالية.\nالتوصية: بطاقة حادثة آليّة عند ركود merged أكثر من ساعتين، ومسار نشر بديل موثَّق.\n\n### قوّة/ضعف المحور\nقوّة: (1) نشر يوميّ 31/31 بلا revert؛ (2) وسيط فتح ← دمج 1.5 س؛ (3) سقّاطات تلتقط الارتداد قبل الدمج برسائل عربيّة تشخيصيّة؛ (4) تعافٍ وسيطه 41 د؛ (5) الاعتماد مربوط بالرأس وآليّ؛ (6) 469 حدث نشر قابلة للتتبّع ببطاقة؛ (7) Security Scan شبه خالٍ من الفشل (0.6%).\nضعف: (1) 21.5% حمرة في البوّابة؛ (2) 237 إعادة اعتماد و78 إبطالاً؛ (3) 12% من الدمجات داخل نافذة الدوام؛ (4) ذيل طويل p90 21-30 س؛ (5) نقطة فشل واحدة للنشر؛ (6) 45 بطاقة ملتقطة راكدة؛ (7) Nightly أحمر 41% على main.\n\n---\n\n## جدول SWOT لمحور الجودة والعمليّات والتسليم\nالبنود مرتّبة بالأثر داخل كلّ ربع. المرجع يشير إلى القسم المسند: ت للاختبارات وCI، أ للأداء، ع للعمليّات، د لـDORA.\n\n### نقاط القوّة (Strengths)\n| # | البند | الدليل | المرجع |\n|---|---|---|---|\n| S1 | تسليم متواصل من فئة Elite | 481 نشرة في 31/31 يوماً؛ 0 revert من 703 دمجات؛ وسيط فتح ← دمج 1.53 س؛ استعادة وسيطها 41 د | د2 |\n| S2 | الاعتماد مربوط بالرأس وآليّ، وبوّابة واحدة صادقة محجِبة | `approval_check` و`waive-head` مصنَّف؛ ملخّص يحكم 11 وظيفة؛ `ci_needs_gate.py`؛ قاعدة طابور الدمج | ت6، د1 |\n| S3 | سقّاطات تلتقط الارتداد قبل الدمج برسائل عربيّة تشخيصيّة | 10 من 10 فشلاً مقروءاً حقيقيّ؛ سقّاطات mypy (1,165) والساعة (62) والطبقات والوصوليّة والهويّة | ت5، د3 |\n| S4 | تغطية اختبار عالية وحماية من فقد الاختبارات | 89% على 57,213 سطراً؛ 14,220 اختباراً ليليّاً؛ `ci_shard_verify.py` يمنع الفقد؛ كلّ `xfail` بـstrict ولا إعادة تشغيل تخفي التقلّب | ت1-ت4 |\n| S5 | نسخ احتياطي مشفَّر مع تمرين استعادة أسبوعيّ آليّ | `backup.yml` يوميّاً إلى R2؛ `backup-restore-test.yml` أسبوعيّاً | ع4 |\n| S6 | سلسلة نشر fail-closed مع كناري بالـcommit | `verify_runtime_db_role` (RLS)؛ `post-deploy-canary.yml` يثبت `commit` حيّاً؛ نافذة النشر مفروضة بالكود | ع5 |\n| S7 | سجلّ تصدير يُلزم المهمّة الخلفيّة ما لم يُقَس p95 ≤ 1s | `core/exports/registry.py:21,68-77`، 11 نوعاً | أ5 |\n| S8 | إعداد Sentry ناضج ومراعٍ للخصوصيّة | `send_default_pii=False`؛ `_scrub_event_pii`؛ `traces_sampler` متدرّج | ع2 |\n| S9 | صلابة الإعدادات الأمنيّة التشغيليّة | HSTS لّ استثناء (`MIN_REASON = 20`, `tests/layering_ratchet.py:1000`؛ 12 استثناءً مقبولاً حالياً في `accepted`).\n- `scripts/prepush_check.py` (395 سطراً) يشغّل: ruff + ruff-format، حارس البيانات الشخصيّة، detect-secrets، radon بحدّ `--min E` أي CC ≥ 31 (`scripts/prepush_check.py:120-139`)، حرّاس الهويّة النصّيّة، حرّاس البنية (`STRUCTURE_GUARDS` = `test_layering`, `test_clock_pin_ratchet`, `test_a11y_ratchet`, `test_a11y_axe_ratchet` في الأسطر 278-283 + تدقيق العيادة بقاعدة)، تصادم أرقام الهجرات، وسقّاطة mypy.\n- ADR-0004 (`docs/adr/0004-core-does-not-import-downstream.md`): قرار مقبول 2026-09-19 بأنّ `core` لا يستورد نازلاً؛ القياس يومها 68 جملة في 16 ملفّاً من 14 تطبيقاً، واليوم في خطّ الأساس 35 موقعاً في 12 تطبيقاً (`core_imports`: operations 15، wings 4، assessments 3…) — أي انخفاض 49% في شهر.\n- وسطاء تضع السياق مرّة واحدة بدل تكراره في العروض: `core.middleware.SchoolContextMiddleware` تحسب `request.school` (التعليق في `core/middleware.py:161-166` يذكر أنّ `get_school()` كان في 248 موضعاً)، و`core.middleware_rls.RLSMiddleware` تضبط `set_config('app.current_school_id', …)` (`core/middleware_rls.py:105`).\n- 332 عرضاً مزيّناً بـ`@capability_required` + حارس `tests/test_every_route_is_guarded.py` يمشي `get_resolver()` كلّه ويرفض أيّ مسار بلا بوّابة وحدة أو حارس دور أو استثناء مسمّى بسببه.\n\n### 2.2 أين تُخترق الطبقات (بالأدلّة)\n\nمنطق أعمال واستعلامات داخل العروض:\n\n- خطّ الأساس نفسه يعترف بـ189 عرضاً فوق السقف (من 549 دالّة عرض = 34%) بمجموع 2,560 استدعاء ORM و4,821 سطراً داخلها. التوزيع: `student_affairs/views.py` 24 عرضاً، `quality/views.py` 16، `academic_management/assignment_views.py` 11، `operations/views_schedule.py` 10، `analytics/views.py` 9، `exam_control/views.py` 9، `reports/views.py` 9، `wings/views.py` 9.\n- أسوأها: `student_affairs/views.py::student_profile` 179 سطراً و76 استدعاء ORM؛ `student_list` (السطر 238) 224 سطراً و51 استدعاءً — يبدأ بـ`Membership.objects.filter(...).select_related(...)` مباشرةً ثمّ يطبّق المرشّحات والفرز والترقيم داخل العرض؛ `staff_affairs/views.py::staff_list` (السطر 172) 183 سطراً و41 ORM؛ `quality/views.py::plan_dashboard` 108 أسطر و43 ORM؛ `core/views_dashboard.py::dashboard` 188 استدعاء ORM (بند مقبول في خطّ الأساس).\n- إجمالاً 338 استدعاء `.objects.` في ملفّات `views*.py` مقابل 372 في `services/selectors` — أي أنّ قرابة نصف الوصول إلى البيانات ما زال في طبقة العرض. و97 كتابة (`save/create/update/delete`) داخل العروض، أكثفها `core/views_dashboard.py` (13) و`core/views_auth.py` (11).\n- `get_school(` ما زال مستدعًى في 195 موضعاً رغم وجود `request.school` (216 موضعاً) — ازدواجية انتقالية.\n\nFat Models:\n\n- `quality/models/appraisal.py::EmployeeEvaluation` 441 سطراً و32 دالّة داخل النموذج، منها `calculate_weighted_total`, `settle_level_after_scores`, `_grievance_order_errors`, `grievance_deadline`, `is_final`, `acknowledge`, `recalculate_from_scores` وتجاوز `save()` و`clean()` (الأسطر 232-438 نسبةً إلى بداية الصنف) — منطق تظلّم ومواعيد وتسوية مستويات في النموذج لا في خدمة.\n- ملفّات نماذج بأكثر من 15 دالّة: `core/models/academic.py` 33، `core/models/user.py` 30، `notifications/models.py` 23، `assessments/models.py` 23، `operations/models/schedule.py` 21، `core/models/audit.py` 21.\n\nاستعلامات في القوالب:\n\n- 32 استدعاءً من نوع `.all`/`.count`/`.filter` داخل وسوم القوالب (بلا JS)، مثل `templates/assessments/setup_detail.html:32` (`pkg.assessments.count`) و`:39` (`{% with items=pkg.assessments.all %}`) — مرشّح N+1 كلاسيكي؛ 6 قوالب فيها `{% for %}` فوق `.all`/`.filter`. 2,259 وسم `{% if %}` و39 شرطاً مركّباً (and/or مزدوج) في القوالب.\n\nاستيراد صاعد من النواة (مخالفة ADR-0004 المتبقّية):\n\n- `core/dashboard_selectors.py:33` يستورد `operations.models` على مستوى الوحدة، و`core/permissions.py:891` يستورد `ScheduleSlot, SubstituteAssignment` من `operations`، و`core/models/department.py:91` يستورد `ScheduleSlot` داخل دالّة، و`core/views_dashboard.py:72` يستورد `AbsenceExcuse`. مجموع الاستيرادات `core -> operations` = 14 جملة مقابل `operations -> core` = 323.\n\nالتكرار الواضح (نوافذ 8 أ ، assessments 37، notifications 35، student_affairs 29؛ 51 فهرساً مركّباً يبدأ بـ`school`؛ 58 `db_index=True`.\n- القيود: operations 32، core 23، quality 11، assessments 9، staff_affairs 9 — لكن 5 `UniqueConstraint` فقط تتضمّن `school` صراحةً، و0 `unique_together` مع school. تطبيقات بلا أيّ قيد: clinic، transport، library، student_affairs (3 نماذج و80 حقلاً و0 قيود)، developer_feedback، decisions_registry.\n- حذف المدرسة `CASCADE` من `SchoolScopedModel` (`core/models/base.py:163-168`) — حذف صفّ `School` واحد يمحو المستأجر كلّه بلا حاجز؛ لا `PROTECT`.\n\n### 4.3 تعدّد المستأجرين (Multi-tenancy)\n\n- النموذج: مستأجر = `School`؛ المستخدم بلا FK مباشر بل عبر `Membership(user, school, role)` (`core/models/access.py:255-263`) ويُشتقّ `user.school` من `active_membership` (`core/models/user.py:246-286`، مع اختيار دور عامل عبر `core.active_role.ActiveRoleChoiceMiddleware`).\n- 98 من 156 نموذجاً (63%) تحمل `school` FK مباشراً. الـ58 الباقية ثلاث فئات: (أ) عالمية مقصودة: `roadmap` 6، `sot_registry` 8، `developer_feedback` 7، `decisions_registry` 2، `ux_survey` 3، `core.School/CustomUser/Semester/CalendarEvent/StoredFile`؛ (ب) مشتقّة من الأب (parent-derived) ومحميّة بسياسات RLS خاصّة: `clinic.HealthRecord`, `library.BookBorrowing`, `behavior.BehaviorPointRecovery/BehaviorCommitteeVote`, `exam_control` (6 نماذج)، `transport.BusRoute`، `notifications.UserNotificationPreference` (هجرات `*_rls_parent_derived.py` في behavior/core/exam_control/library)؛ (ج) `quality` 8 نماذج بلا school (`ObservationScore`, `EvaluationAxis`, `EvaluationScore`, `OperationalTarget`, `OperationalIndicator`, `ProcedureEvidence`, `ProcedureStatusLog`) — تعتمد على الأب.\n- الدفاع في العمق: (1) PostgreSQL RLS بـ53 سياسة + `RLSMiddleware` تضبط `app.current_school_id` لكلّ طلب (`core/middleware_rls.py:105`) + دور قاعدة بيانات مخصّص (`0037_rls_tenant_identity_from_db_role`, وأمر `verify_runtime_db_role`)؛ (2) `TenantRLSTask` لمهامّ Celery يشترط `school_id` (`core/celery_tasks.py:132-151`)؛ (3) حارس ساكن `tests/test_tenant_surface_coverage.py` يُلزم تصنيف كلّ جدول فيزيائي في فئة رباعية (ويذكر أنّ الجرد وجد 20 جدولاً بلا `school_id` منها جدولا M2M لا يظهران في `get_models()`)؛ (4) 10 ملفّات اختبار عزل (`test_rls_middleware`, `test_celery_rls_isolation`, `test_dlq_tenant_boundary`, `test_tenant_user_scope_writes`…).\n- الفجوة: مديرو ORM المقيِّدون بالمدرسة نادرون — `for_school()` معرَّف في `core/querysets.py:236,265` لـ`Membership` و`AuditLog` فقط ومستدعًى 13 مرّة؛ معظم الاستعلامات تكتب `filter(school=request.school)` يدوياً (338 استدعاءً في العروض)، فالعزل الحقيقي يقف على RLS في القاعدة لا على طبقة التطبيق. في بيئة غير PostgreSQL (الاختبارات على SQLite) تتخطّى `RLSMiddleware` الضبط (`core/middleware_rls.py:99`) — فأيّ اختبار عزل يمرّ محلّياً قد لا يُثبت شيئاً إن لم يُشغَّل على Postgres.\n\n### 4.4 الحذف الناعم والتشفير\n\n- الحذف الناعم: `SoftDeleteModel` معرَّف (`core/models/base.py:109-150`) لكنّه مستخدَم في نموذج واحد فقط (`operations.SubjectClassAssignment`)، و`quality.ClassroomObservation` بحقل `is_deleted`، و5 نماذج في `sot_registry` عبر `_SoftDeletable/_NoHardDelete` (`sot_registry/models.py:22-35` يرفع `ProtectedDeletionError` عند الحذف الصلب). إجمالاً 7 من 156. البقيّة حذف صلب أو تُدار بالحالة (`is_active`) أو بالمحو الحوكمي (`governance/erasure_service.py`).\n- التشفير: 31 حقل `EncryptedTextField` (Fernet) في 11 نموذجاً: 11 في `clinic.HealthRecord` (فصيلة الدم، الحساسيّات، الأمراض المزمنة، الأدوية، جهة الاتّصال الطارئ، رقم البطاقة الصحّية، رقم حمد)، 3 في `ClinicVisit`، 5 في `behavior.BehaviorInfraction`، 3 في `student_affairs.AdmissionApplication` (الرقم الشخصي)، `core.CustomUser.kahramaa_number`، `core.Profile.birth_date_encrypted`، `transport.SchoolBus.driver_phone/gps_link`، `student_info.StudentNote.body`. الرقم الشخصي كـ`USERNAME_FIELD` يُحفظ نصّاً مع HMAC للبحث (`core/models/user.py:32-33`) — خيار مُوثَّق. الحقول المشفّرة غير قابلة للبحث/الفهرسة بطبيعتها، وتدوير المفتاح له أمر `rotate_fernet_key`.\n- التدقيق: `AuditLog` بمشغّل عدم القابلية للتعديل في القاعدة (`core/migrations/0014_auditlog_immutable_trigger.py`) واستثناءات محو مسمّاة (`0059`, `0078`, `0082`, `0083`).\n\n## 5. حدود السياقات والاقتران\n\nرسم الاستيراد بين 29 حزمة (جمل `from X import`/`import X` بلا هجرات): 131 زوجاً موجّهاً.\n\n- أعلى الاقترانات: `operations -> core` 323، `staff_affairs -> core` 94، `student_affairs -> core` 76، `quality -> core` 75، `wings -> core` 62، `wings -> operations` 56، `notifications -> core` 52، `behavior -> core` 46، `assessments -> core` 46، `academic_management -> core` 41، `reports -> core` 34، `academic_management -> operations` 29.\n- Fan-in: `core` 1,047 (كلّ شيء يعتمد عليه)، `operations` 153، `notifications` 51، `assessments` 28، `wings` 27، `behavior` 23. Fan-out: `operations` 357، `wings` 123، `student_affairs` 103، `staff_affairs` 103، `quality` 85.\n- رسم FK من `_meta` يؤكّد: `operations -> core` 106 علاقة، `staff_affairs -> core` 44، `quality -> core` 24، `student_affairs -> core` 22. علاقات FK عابرة بين التطبيقات النازلة نادرة (academic_management→operations 2، quality/assessments/behavior→operations 1، exam_control→behavior 1) — أي أنّ حدود البيانات أنظف من حدود الشيفرة.\n- الدورات (أزواج متبادلة): 22 دورة. أخطرها: `core <-> operations` (14/323)، `core <-> wings`، `core <-> notifications`، `core <-> quality`، `core <-> student_affairs`، `core <-> student_info`، `core <-> transport`، `core <-> library`، `core <-> clinic`، `core <-> assessments`، `core <-> behavior`، `core <-> academic_management` — 12 دورة تمرّ عبر النواة (وهي ما يعالجه ADR-0004 تدريجياً، وأغلب الاستيرادات الصاعدة محلّية داخل الدوال في `dashboard_selectors`/`permissions`/`full_seed`). دورات نازلة-نازلة: `operations <-> wings` (10/56)، `operations <-> notifications` (10/11)، `behavior <-> student_affairs`، `behavior <-> notifications`، `operations <-> reports`، `operations <-> staff_affairs`، `quality <-> staff_affairs`، `academic_management <-> operations`.\n- حدود السياقات الفعلية (بحسب النماذج والاستيرادات): (1) الهويّة والوصول (core: User/Membership/Role/Capability/School) — ناضج ومحروس؛ (2) الجدولة والحضور (operations + wings + academic_management) — أكبر سياق وأكثرها تشابكاً: `wings` بلا نماذج يستورد 56 من operations؛ `academic_management` يحمل نماذج الإسناد لكنّ `operations.SubjectClassAssignment` ما زال في operations؛ (3) الطالب (student_affairs + student_info + parents + assessments + behavior + clinic + library + transport) — «المدرسة كمنتج» يوزَّع على 8 تطبيقات مع دورة `behavior <-> student_affairs`؛ (4) الموظّف (staff_affairs + quality) مع دورة بينهما؛ (5) الإشعارات (notifications + channels + DLQ) تُستورد من 51 موضعاً وتستورد هي من operations/core؛ (6) الحوكمة وPDPPL (governance + breach + sot_registry + decisions_registry)؛ (7) أدوات المطوّر (roadmap + command_center + docs_viewer + developer_feedback) داخل الـmonolith نفسه.\n- `operations` تجاوز حدّ السياق الواحد: 95 وحدة في الجذر بأسماء `absence_*`, `schedule_*`, `scheduler_*`, `attendance_*`, `exit_*`, `tardiness*` — أربعة سياقات فرعية على الأقلّ (الحضور/الغياب، الجدول وقراءته، المولّد، الاستئذان والخروج) في حزمة واحدة بلا حزم فرعية إلّا `services/` و`models/` و`scheduler_v2/`.\n\n## 6. API وواجهات التكامل\n\n- `api/` 2,295 سطراً: 30 مساراً تحت `/api/v1/` بـnamespace `api_v1` (`shschool/urls.py:59`) + مسار واحد قديم تحت `/api/` (`operations/api_urls.py:9` بحث الطلاب). 20 مسلسِلاً في `api/serializers.py` + 2 في `api/views_erasure.py` + 2 في `operations/serializers.py` (تكرار مقاس في القسم 2.2).\n- الأسلوب مختلط: 21 `@api_view` دالّياً + 7 `ListAPIView` + 1 `APIView`؛ لا `ViewSet`/`Router`. التصفية بـ`django_filters` + `SearchFilter` + `OrderingFilter`؛ ترقيم `PageNumberPagination` بـ50 (`shschool/settings/base.py:379-380`).\n- الإصدار: namespace في المسار فقط؛ لا `DEFAULT_VERSIONING_CLASS` (0 إصابة) — لا طريقة لتقديم v2 بجانب v1 سوى تكرار الحزمة. التوثيق: drf-spectacular (`schema/`, `docs/`, `redoc/`)، العنوان «SchoolOS API 1.0.0»، واختبار عقد `tests/test_api_contract.py` في وظيفة CI مستقلّة (`quality.yml:316-354`).\n- المصادقة: Session + JWT (simplejwt: access 1 ساعة، refresh 7 أيّام، تدوير + قائمة حظر `token_blacklist`، `shschool/settings/base.py:430-438`). الإذن الافتراضي `IsAuthenticated`.\n- التقييد: ثلاثة أصناف افتراضية (`Anon 30/min`, `User 120/min`, `Scoped`) ونطاقات معرَّفة `login 5/min`, `burst 60/min`, `sensitive 10/min` (`base.py:386-392`) — لكن `throttle_scope`/`throttle_classes` غير مستخدَمة في أيّ عرض داخل `api/` أو `operations/` أو `core/` (0 إصابة)، فنطاقات `login/sensitive` غير فعّالة في DRF (الحماية الفعلية للدخول عبر `axes` و`@ratelimit` في 7 مواضع للعروض HTML).\n- الواجهة الأساسية للمنصّة ليست REST بل HTML + HTMX (91 سمة `hx-` في القوالب، `django_htmx` middleware) + Channels/WebSocket للإشعارات (`notifications/consumers.py`, `routing.py`, Daphne أوّل التطبيقات). REST مخصّص للموبايل/أولياء الأمور (`parent/children`, `notifications`, `kpis`, `library`, `clinic/visits`, `erasure`).\n- تكاملات أخرى: Prometheus (`django_prometheus` أوّل وآخر وسيط)، Sentry (`SentryScopeMiddleware` بسياق school_id/role)، تخزين S3 اختياري (`storages`) مع `DatabaseStorage` افتراضياً، WebPush VAPID، استيراد وزاري (`core/ministry_import.py`، PDF الجدول عبر `import_timetable_pdf`).\n\n## 7. المهامّ الخلفية (Celery)\n\n- 10 وحدات مهامّ، 43 مهمّة `@shared_task` فعلية (47 إصابة منها 3 في سكريبت اختبار تحت `.claude/` و1 في `shschool/__init__`): notifications 15 (13 + 2 تنبيهات معلّمين)، operations 16 (12 + 2 scheduler_v2 + 2 تقارير غياب)، core 3، command_center 2، behavior 2، staff_affairs/governance/decisions_registry/analytics 1 لكلّ.\n- الجدولة: 17 مدخلاً ثابتاً في `app.conf.beat_schedule` (`shschool/celery.py:67-165`) + 3 مصادر ديناميكية تُدمَج عند الاستيراد (`sweep-absence-gates-after-school` السطر 188، `teacher_alerts_beat()` السطر 202، `absence_reports_beat()` السطر 208). أمثلة: تنبيهات الغياب يومياً، مهل الخرق كلّ ساعة، انحراف سجلّ القرارات، KPI شهري، إبطال الصلاحيّات المؤقّتة، فحص المخاطر السلوكية أسبوعياً، الاحتفاظ بالبيانات أسبوعياً، نبض العامل، حالة النسخ الاحتياطي، جامعات مركز القيادة، تنظيف وظائف التصدير، حصد توليدات الجدول العالقة، إنهاء التعويضات المتأخّرة.\n- السلامة: `task_acks_late = True` و`task_reject_on_worker_lost = True` عالمياً (`shschool/celery.py:168-169`)، `CELERY_TASK_TIME_LIMIT = 300` / `SOFT = 240`، `WORKER_PREFETCH_MULTIPLIER = 1`، JSON فقط، منطقة Asia/Qatar (`production.py:223-230`). acks_late يعني إعادة تسليم أيّ مهمّة انقطع عاملها — فالـidempotency شرط لا خيار.\n- Idempotency: ضعيفة صراحةً — قفل `cache.add` واحد فقط في `operations/scheduler_v2/tasks.py:264` (`schedule-shadow:{school.pk}`)؛ لا `cache.lock`/advisory lock في بقيّة المهامّ. التخفيف في الإشعارات عبر `delivery_id`/`dispatch_id` وحالة تسليم (`notifications/delivery_state.py`) وDLQ (`DeadLetterMessage` بحدّ مستأجر، هجرة `0008_dlq_tenant_boundary`) و`NOTIFICATION_MAX_DELIVERY_ATTEMPTS` (15 مرجعاً). المهامّ الدورية (الاحتفاظ، الإبطال، الحصد) تعتمد على كون التحديثات نفسها idempotent بالحالة، لا على مفاتيح تكرار.\n- إعادة المحاولة: 14 موضع `self.retry()`؛ `max_retries` 2-3 في مهامّ الإشعارات (`notifications/tasks.py:249,384,484,557,629,713`، `hub_send` بـ3 في السطر 1064) مع `default_retry_delay=30` و`soft_time_limit` للـpush (`notifications/tasks.py:800-808`)؛ `autoretry_for` مرّة واحدة فقط، ولا `retry_backoff` في أيّ مهمّة — إعادة محاولة ثابتة لا أُسّية.\n- أخطر نقطة تشغيلية: `CELERY_TASK_ALWAYS_EAGER = not CELERY_ASYNC_ENABLED` والافتراضي `CELERY_ASYNC_ENABLED=False` في الإنتاج (`shschool/settings/production.py:210-234`) مع `CELERY_TASK_EAGER_PROPAGATES = False` (السطر 238) — في الوضع الافتراضي تُنفَّذ المهامّ متزامنةً داخل طلب HTTP (توليد الجدول CP-SAT، التصدير، الإشعارات)، وأيّ فشل يُبتلع داخل `EagerResult` بلا استثناء. التعليق يسمّيه «fallback للطوبولوجيا» وليس سياسة. `conftest.py:pytest_sessionstart` يوقف الاختبارات إن لم يكن Celery فورياً — ممارسة جيّدة لاتّساق CI.\n- طابور واحد: لا `task_routes`/`task_queues` (0 إصابة) — مهامّ CP-SAT الثقيلة (حدّ 300 ثانية) تزاحم إشعارات الغياب الفورية على العامل نفسه.\n- عزل المستأجر في المهامّ: `TenantRLSTask`/`RLSIsolatedTask` (`core/celery_tasks.py`) يضبط RLS لكلّ مهمّة ويرفض مهمّة بلا `school_id`؛ مهامّ «كلّ المدارس» (`send_pending_absence_alerts_all_schools`) تتفرّع لكلّ مدرسة.\n\n## 8. قابلية الصيانة والتوسّع: ما سيُكسر عند 10 مدارس و10,000 طالب\n\n1. الجلسات والحضور: 10,000 طالب × 7 حصص × 180 يوماً ≈ 12.6 مليون صفّ `StudentAttendance` سنوياً + `Session` ≈ 10 مدارس × 40 شعبة × 7 × 180 ≈ 500 ألف. `SessionAutoGenerateMiddleware` (`operations/middleware.py:54-117`) يولّد حصص اليوم داخل أوّل طلب HTTP للمدرسة مع قفل cache لأربع ساعات — عند 10 مدارس يصبح أوّل مستخدم صباحاً في كلّ مدرسة ضحيّة توليد متزامن، وإن سقط Redis يعود إلى سمة الطلب (التعليق في السطر 36-39) فيتكرّر التوليد عبر العمّال. يجب أن ينتقل إلى beat ليلي لكلّ مدرسة.\n2. الفهارس بقفل: 72 من 74 `AddIndex` بلا `CONCURRENTLY` — أيّ هجرة فهرس قادمة على جدول الحضور تقفل الكتابة دقائق.\n3. CP-SAT في الطلب: مع `ALWAYS_EAGER` الافتراضي، توليد جدول مدرسة (حدّ 300 ثانية، `GENERATION_SOFT_TIME_LIMIT`) يجري داخل عامل HTTP؛ 10 مدارس تولّد في أسبوع واحد تُشبع العمّال. حتى مع worker مستقلّ، طابور واحد يعني أنّ الإشعارات تنتظر خلف الجدولة.\n4. الملفّات في القاعدة: `DatabaseStorage` يحفظ المرفوعات كـ`BinaryField` في `StoredFile` (`core/db_storage.py`, `core/models/stored_file.py:17`) — 10,000 ملفّ طالب (صور، وثائق قبول، أعذار) تضخّم القاعدة والنسخ الاحتياطي وتجعل `SELECT` واحداً يسحب ميغابايتات؛ S3 مُهيّأ اختيارياً ويجب أن يصبح افتراضياً.\n5. العروض السمينة بلا ترقيم: 12 موضع `Paginator` فقط؛ `student_list` يبني الاستعلام ثمّ يرشّح في Python، و`student_profile` 76 استدعاء ORM لصفحة واحدة؛ `core/views_dashboard.py::dashboard` 188 استدعاءً — لوحة المدير عند 1,000 طالب/مدرسة ستتجاوز 300ms بسهولة (عتبة القاعدة الهندسية للخلفية).\n6. العام الدراسي عالمي: `settings.CURRENT_ACADEMIC_YEAR` في 19 موضعاً (رغم وجود `academic_year_for_school` في `core/querysets.py:65-71`) — مدرسة بتقويم مختلف أو انتقال سنة على مراحل سيكسر الإحصاءات.\n7. `CASCADE` على المدرسة: حذف/دمج مدرسة خطأً يمسح كلّ شيء؛ لا `PROTECT` ولا حذف ناعم للمستأجر.\n8. `core` كنقطة اختناق: 1,047 استيراداً واردة و33,977 سطراً و101 وحدة؛ أيّ تغيير في `core/permissions.py` (1,112 سطراً، يستورد صاعداً من operations في السطر 891) يُعيد تشغيل كلّ الاختبارات (40 دقيقة تغطية) ويعرّض كلّ التطبيقات.\n9. طبقة العزل تقف على Postgres RLS وحده: مع ندرة المديرين المقيِّدين (13 استدعاء `for_school`)، أيّ استعلام يُنفَّذ خارج سياق `set_config` (سكريبت صيانة، shell، مهمّة لا تمدّ `TenantRLSTask`) يرى كلّ المدارس إن كان بدور قاعدة متجاوِز؛ الاختبارات على SQLite لا تُثبت العزل.\n10. محتوى كهجرات: `roadmap` بـ80 `RunPython` و21,928 سطراً يجعل `migrate` على قاعدة جديدة أبطأ ويربط نشر المحتوى بنشر الشيفرة؛ وكلّ 10 مدارس على القاعدة نفسها تشترك في محتوى «أدوات المطوّر».\n11. أوامر الاستيراد بتعقيد F/E (48، 43، 34، 33) هي مسار إدخال كلّ مدرسة جديدة (كادر، طلاب، جدول PDF) — عند 10 مدارس تُشغَّل 10 مرّات، وكلّ خطأ فيها بشري لا مُختبَر (مستثناة من بوّابة radon).\n12. الإشعارات: `hub_send_notification_task` CC 28 و164 سطراً مع DLQ — عند 10,000 ولي أمر وإشعار غياب يومي ≈ 10 آلاف مهمّة/يوم على طابور واحد بـprefetch 1؛ يلزم طابور مستقلّ وعامل مستقلّ.\n\n## 9. جدول SWOT — محور المعمارية والجودة\n\n### القوّة (مرتّبة بالأثر)\n\n1. عزل المستأجر دفاعاً في العمق: 53 سياسة RLS في Postgres + `RLSMiddleware` + `TenantRLSTask` + حارس التصنيف الرباعي `tests/test_tenant_surface_coverage.py` + 10 اختبارات عزل.\n2. حوكمة مقاسة ومُلزمة لطبقات العرض: `tests/layering_ratchet.py` بسقف 60 سطراً/5 ORM، سقّاطة لا تسمح بالتراجع ولا بإهدار التحسّن، 12 استثناءً مُعلَّلاً فقط.\n3. حارس المسارات الشامل `tests/test_every_route_is_guarded.py` + 332 `@capability_required` + نظام قدرات مركزي (`core/capabilities/` 22 ملفّاً، 73 قدرة).\n4. تغطية اختبار استثنائية: 10,213 اختباراً، 184,506 سطر اختبار (نسبة 1.1 إلى الشيفرة)، عتبة 70% مُنفَّذة، اختبار عقد API مستقلّ، e2e/a11y ratchets.\n5. أمن الجلسة والمصادقة فوق المعيار: HttpOnly/Secure/SameSite، HSTS سنة مع preload، axes 5 محاولات، JWT بتدوير وقائمة حظر، 2FA إلزامي للكادر، CSP بـnonce، `ForcePasswordChange`/`MfaSession` وسطاء.\n6. PDPPL مُهندَس لا مُلصَق: 31 حقلاً مشفّراً في 11 نموذجاً، `AuditLog` غير قابل للتعديل بمشغّل قاعدة، تطبيقات `governance/breach` للمحو والاحتفاظ والخرق، حارس بيانات شخصية في prepush.\n7. بوّابات prepush/CI متعدّدة الطبقات: ruff/format، detect-secrets، radon، mypy ratchet، حرّاس بنية، تصادم هجرات، 18 workflow (نسخ احتياطي واختبار استرجاع، canary بعد النشر، rollback).\n8. متوسّط تعقيد منخفض عموماً: 79% من 8,344 كتلة رتبة A، متوسّط 3.89؛ لا TODO/FIXME حقيقي (0 من 15 إصابة).\n9. قرارات موثّقة (9 ADRs) بقياس قبل/بعد (ADR-0004: من 68 استيراداً صاعداً إلى 35 في شهر).\n10. ممارسات ORM ناضجة حيث طُبّقت: 527 `select_related/prefetch`، 268 `atomic`، 75 `select_for_update`، مفاتيح UUID في 103 نماذج، 51 فهرساً مركّباً يبدأ بالمدرسة.\n\n### الضعف (مرتّبة بالأثر)\n\n1. 189 عرضاً (34% من 549) فوق سقف الطبقات بـ2,560 استدعاء ORM داخلها؛ `student_affairs/views.py` 2,821 سطراً و24 عرضاً مخالفاً؛ `student_profile` 76 ORM.\n2. `operations` و`core` = 46% من الشيفرة؛ `operations` 95 وحدة في الجذر تجمع 4 سياقات فرعية؛ `core` 101 وحدة وfan-in 1,047.\n3. 22 دورة استيراد بين التطبيقات، 12 منها عبر `core` (مخالفة ADR-0004 المتبقّية: 35 موقعاً) و`core/permissions.py:891` يستورد نماذج operations.\n4. Celery في الإنتاج افتراضياً `ALWAYS_EAGER` مع `EAGER_PROPAGATES=False` (`production.py:234-238`): مهامّ ثقيلة داخل HTTP وأخطاء مبتلعة؛ طابور واحد؛ idempotency صريحة في مهمّة واحدة؛ لا `retry_backoff`.\n5. الخمسة الأعلى تعقيداً (CC 48/43/34/33/33) أوامر استيراد إنتاجية مستثناة من بوّابة radon (`RADON_EXCLUDE` يستثني `management/commands`).\n6. خدمات «إله»: `BehaviorService` 805 أسطر، `GradeService` 789، `StaffAttendanceService` 729، `NotificationService` 639، `SwapService` 592؛ ونموذج سمين `EmployeeEvaluation` 441 سطراً/32 دالّة بمنطق تظلّم في `save()/clean()`.\n7. الحذف الناعم في 7 نماذج فقط من 156 (4.5%)؛ `School` بـ`CASCADE`؛ 5 قيود فريدة فقط تتضمّن `school`؛ `student_affairs` 80 حقلاً بلا قيد واحد.\n8. 72 من 74 فهرساً مضافاً بلا `CONCURRENTLY`؛ 3 هجرات فقط `atomic=False`؛ هجرة واحدة 1,156 سطراً (`0057_arabic_field_labels`).\n9. الاعتماد على إعدادات عالمية بدل سياسة لكلّ مدرسة: `CURRENT_ACADEMIC_YEAR` 19 موضعاً، `MINISTRY_AFFILIATION_VISIBLE` 17، `TWO_FACTOR_REQUIRED_FOR_STAFF` 10؛ 77 ملفّاً يستورد `settings`.\n10. دَين كتم التحذيرات: 620 `# noqa`، 123 `# type: ignore`، 131 `except Exception`، 60 `print(`؛ وتكرار مقاس (55 نافذة؛ مسلسِلات مكرّرة api/operations؛ أزواج عروض wings/staff_affairs).\n11. 32 استعلاماً داخل القوالب و6 قوالب بحلقة فوق `.all/.filter` (N+1)؛ 12 موضع ترقيم فقط.\n12. `DatabaseStorage`: الملفّات في `BinaryField` داخل Postgres.\n13. API: لا `ViewSet/Router`، لا إستراتيجية إصدار، نطاقات تقييد معرَّفة وغير مستخدَمة (0 `throttle_scope`).\n\n### الفرصة\n\n1. تفكيك `operations` إلى 4 حزم فرعية (attendance/, schedule/, scheduler/, permits/) بلا تغيير جداول — الاستيرادات الداخلية تسمح بذلك والـFK العابرة نادرة (academic_management→operations 2 فقط).\n2. إتمام ADR-0004 (35 موقعاً متبقّياً، 15 منها operations) عبر واجهات/إشارات في `core` وتسجيل جامعات اللوحة من التطبيقات (`dashboard_registry.py` موجود أصلاً).\n3. مديرو ORM مقيِّدون بالمستأجر (`SchoolScopedManager.for_school/for_request`) يحلّون محلّ 338 `filter(school=…)` يدوياً — يقلّل المخالفات ويحوّل RLS من خطّ الدفاع الوحيد إلى الثاني.\n4. تشغيل worker مستقلّ + `task_routes` (طابور `scheduler` و`notifications` و`default`) + `retry_backoff=True` + مفاتيح idempotency في المهامّ الدورية — البنية (DLQ، TenantRLSTask، heartbeat) جاهزة.\n5. خفض سقف prepush من CC≥31 إلى ≥21 تدريجياً وإلغاء استثناء `management/commands` بسقّاطة مماثلة لـlayering.\n6. تحويل `roadmap`/`sot_registry` من هجرات بيانات إلى fixtures/أوامر `loaddata` idempotent أو فصلها عن monolith الإنتاج.\n7. الاستفادة من `core/domain/` (1,748 سطر درجات نقيّة) كنمط لنقل منطق `EmployeeEvaluation` و`conduct_2026` و`transfer_chain` إلى طبقة نطاق بلا ORM قابلة للاختبار دون قاعدة.\n8. التحوّل إلى S3 افتراضياً (`STORAGES` جاهز) وإلى `AddIndex(concurrently)` عبر `django.contrib.postgres.operations.AddIndexConcurrently`.\n9. DRF ViewSet + Router + `URLPathVersioning` + استخدام `throttle_scope` في `auth/token` و`erasure` — جهد صغير يُحكم أمن API.\n10. سياسة لكلّ مدرسة (`SchoolPolicy`) تستوعب العام الدراسي ورؤية الوزارة و2FA بدل الإعدادات العالمية — تمهيد ضروري لعشر مدارس.\n\n### التهديد\n\n1. انفجار جدول الحضور (≈12.6 مليون صفّ/سنة لعشرة آلاف طالب) مع فهارس بقفل وتوليد حصص في الطلب — توقّف صباحي محتمل.\n2. ابتلاع أخطاء المهامّ في الوضع الفوري الافتراضي (`EAGER_PROPAGATES=False`): إشعار غياب أو محو PDPPL يفشل بصمت.\n3. أوامر الاستيراد الإنتاجية بتعقيد F بلا بوّابة: كلّ مدرسة جديدة = تشغيل يدوي لشيفرة غير محروسة على بيانات شخصية.\n4. تآكل الحوكمة بالاستثناءات: 12 بنداً مقبولاً في خطّ أساس الطبقات خلال شهر؛ `noqa` 620 — مسار معتاد لتجاوز البوّابات تحت ضغط 431 التزاماً/شهر.\n5. الاعتماد الكلّي على RLS: دور قاعدة متجاوِز أو اتّصال بلا `set_config` (shell، سكريبت، Celery بلا `TenantRLSTask`) يكشف كلّ المدارس؛ الاختبارات على SQLite لا تلتقطه.\n6. `CASCADE` على `School` + حذف صلب في 95% من النماذج: خطأ تشغيلي واحد لا رجعة فيه إلّا من النسخ الاحتياطي.\n7. بطء مجموعة الاختبارات (تغطية p95 39.6 دقيقة) + 48 worktree متوازية + تصادم هجرات مُراقَب يدوياً — تراجع سرعة الدمج أو إغراء تخطّي البوّابات.\n8. Bus factor: 96% من الالتزامات من حسابين لشخص واحد عملياً؛ 33,977 سطراً في `core` بلا توثيق واجهات داخلية لمن يأتي بعده.\n9. الإعدادات العالمية (العام الدراسي، رؤية الوزارة) ستعطي أرقاماً خاطئة بصمت لأوّل مدرسة بتقويم مختلف.\n10. 148 تبعية مثبّتة (ortools، weasyprint، pandas 3.0، numpy 2.5) — سطح هجوم سلسلة التوريد وكلفة ترقية (pip-audit موجود لكنّ 41 التزام dependabot تدلّ على وتيرة عالية).\n\n## 10. أهمّ 10 توصيات قابلة للتنفيذ (مرتّبة بالعائد/الجهد)\n\n| # | التوصية | الدليل | الجهد التقديري |\n|---|---|---|---|\n| 1 | تفعيل worker مستقلّ وجعل `CELERY_ASYNC_ENABLED=True` الافتراضي في الإنتاج، مع `task_routes` لثلاثة طوابير (`scheduler`, `notifications`, `default`) و`retry_backoff=True` و`EAGER_PROPAGATES=True` في غير الإنتاج | `production.py:210-238`, `celery.py` بلا `task_routes` | 3-5 أيّام (بنية + اختبار + runbook) |\n| 2 | نقل توليد الحصص من `SessionAutoGenerateMiddleware` إل

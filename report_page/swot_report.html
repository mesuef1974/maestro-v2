 | 562 | utilities |\n| `static/css/admin_theme.css` | 31.4 KB | 480 | لوحة الإدارة فقط |\n| `static/css/styleguide.css` | 14.9 KB | 280 | دليل الهويّة فقط |\n\n- ترتيب الطبقات معلَن في `10-foundation.css:30`: `@layer tailwind, reset, base, tokens, layout, components, modules, utilities, themes;` — والطبقة `tokens` فارغة عمداً (`10-foundation.css:594`) لأنّ المتغيّرات داخل `base`. هذا ترتيبٌ سليم؛ الليليّ آخر الطبقات فيغلب بلا `!important`.\n- قائمة التحميل الوحيدة في `core/css_files.py` (ADR-0003): ثمانية ملفّاتٍ تُحمَّل في كلّ صفحة، و`34-docs-viewer.css` مستثنى (قرار D-81م).\n- **الحجم الخام للملفّات الثمانية المحمَّلة دائماً = 480,993 بايتاً = 469.7 KB**، والسقف في `tests/web_vitals.py:140` هو `css_kb: 470` أي 481,280 بايتاً. **الهامش المتبقّي 287 بايتاً فقط.** تعليق الملفّ نفسه يوثّق سلسلة الرفع 404 → 460 → 462 → 466 → 468 → 470 (ستّ رفعاتٍ في خمسة أسابيع، `web_vitals.py:116-132`)؛ هذه ميزانيّةٌ على حافّة الانفجار، وأيّ ميزةٍ تضيف سطرَين تكسر البناء.\n- السقف الثاني المصغَّر في `tests/test_css_budget.py:42`: `MAX_SHIPPED_BYTES = 270 * 1024` (رُفع 260 → 267 → 268 → 269 → 270 بأربعة استثناءاتٍ موثّقة، والتعليق يقول «لا يُرفع ثانيةً (VD8)»).\n- ميزانيّة JS: `js_kb: 430`؛ السكربتات الأساسيّة المحمَّلة في كلّ صفحة مصادَقة (`base.html:69,1310-1323`) = 218.1 KB خامّاً (htmx 47.0 + base.js 62.3 + session-guard 22.9 + page-nav 20.8 + export-center 18.8 + actions 17.7 + app 9.8 + app-mode 5.9 + page-fresh 5.4 + rum 4.0 + icon-update-notice 3.6)، ومع `chart.umd.min.js` (200.6 KB) على لوحات التحكّم = 418.7 KB، أي هامش 11 KB.\n- `blocking_stylesheets: 10` والفعليّ 8 — هامشٌ لملفّين.\n\n### 1.2 الرموز (Tokens)\n\n- 252 متغيّراً في `:root` داخل `10-foundation.css` (الألوان الرسميّة لقطر Al Adaam `#8A1538`، Skyline، Palm، Sea؛ النصّ `--text-primary #111827`، `--text-secondary #4b5563`، `--text-muted #58606d` مع تعليقٍ يذكر النِّسب المحسوبة 6.35 / 5.16 / 4.69 — `10-foundation.css:129-131`).\n- الحارس `tests/test_contrast_ratios.py:269` يتحقّق أنّ **تعليق الرمز يطابق النسبة المحسوبة فعلاً** (`test_token_comments_state_the_ratio_the_values_compute`) — ممارسةٌ نادرة ومتقدّمة.\n- مقاييس المسافات `--sp-0-5 … --sp-16` (4px grid)، الزوايا `--radius-sm … --radius-pill`، طبقات z من `--z-base 1` إلى `--z-critical 9999`، ومنطقة الأمان `--safe-top/bottom/inline` بـ`env(safe-area-inset-*)` و`--dock-h: 4.5rem` (`10-foundation.css:301-341`).\n- `--control-h: 44px` (`:161`) و`--focus-ring` بـ`color-mix` (`:162`).\n- **تسرّبٌ خارج السلّم**: توزيع `font-size` في `custom/*.css` يُظهر 221 استعمالاً لـ`var(--text-xs)` (12px) مقابل 120 لـ`--text-sm` و25 لـ`--text-base`، أي أنّ أصغر درجةٍ في السلّم هي الأكثر استعمالاً — مؤشّر كثافةٍ بصريّة عالية. وإلى جانبها نحو 60 قيمةً مكتوبةً باليد خارج الرموز (`0.75rem` ×14، `0.8rem` ×13، `0.85rem` ×11، `0.8125rem` ×7، `.78rem` ×5، `0.82rem` ×3 …) رغم وجود `--text-xs-plus` المخصّص لتوحيدها (`10-foundation.css:284`).\n- الألوان الرقميّة خارج الرموز محروسة بـ`tests/test_css_colours_are_tokens.py`، وكتلة `--df-*` لملاحظات المطوّر (`10-foundation.css:470-499`) تحمل 30 لوناً ثابتاً خاصّاً بميزةٍ واحدة — عبءٌ على الملفّ المركزيّ.\n\n### 1.3 الوضع الداكن\n\n- يُفعَّل بالصنف `html.dark` من `localStorage.theme` بسكربتٍ مبكّرٍ في الرأس لمنع الوميض (`base/base.html:16-17`)، ولون الأرضيّة يُرسم inline قبل أيّ ملفٍّ خارجيّ (`base.html:14`).\n- `40-themes.css` يقلب 198 موضعاً؛ رموز الليليّ موثّقة بنِسبها (`--maroon-fg #f9a8c9` 7.99، `--status-danger-fg` 7.71 … `40-themes.css:55-59`)، وأسطح الحالات لها نسخٌ داكنة (`:64-68`) بعد أن كانت تُرسم فاتحةً بنسبة 1.33.\n- حارسان: `tests/test_dark_parity.py` («لا نصَّ يموت في الليل») و`tests/test_contrast_ratios.py` يقيس الأزواج في الوضعين.\n- **نقص**: لا استعمالَ لـ`prefers-color-scheme` إطلاقاً في `10-foundation.css` و`40-themes.css` و`base.html` و`base.js` (عدّ grep = 0 في هذه الأربعة؛ الإشارات الخمس الوحيدة في `admin_theme.css`). المستخدم الذي ضبط نظامه على الداكن يرى المنصّة نهاريّةً حتّى يضغط المبدّل، خلافاً لتوصيات Material 3 وApple HIG (احترام تفضيل النظام افتراضيّاً مع إمكانيّة التجاوز). و`<meta name=\"color-scheme\" content=\"light\">` (`base.html:13`) ثابتٌ على الفاتح حتّى يبدّله JS.\n- لا دعمَ لـ`forced-colors` / `prefers-contrast` (0 إشارة في كلّ CSS) — مستخدمو التباين العالي في Windows يفقدون الحدود والحلقات المبنيّة على `box-shadow`.\n\n### 1.4 الطباعة العربية\n\n- الخطّ: Tajawal محلّيّ (400/500/700، WOFF2 ≈ 20 KB لكلّ وزن + TTF احتياطيّ) بـ`font-display: swap` و`unicode-range` يحصره في العربيّة واللاتينيّة الأساسيّة والأرقام الهنديّة (`10-foundation.css:522-549`). `preload` للوزنين Regular وBold في `base.html:61-62` و`login.html:20-21`. الوزن Medium يُحمَّل بلا preload.\n- `Tajawal Tashkeel` نسخةٌ مبنيّة بسكربت (`scripts/build_tashkeel_fonts.py`) ترسم الحركات بلونٍ مستقلّ عبر `@font-palette-values` لنصّ رؤية الوزارة فقط (`10-foundation.css:515-521`) — حلٌّ طباعيٌّ متقدّم يحافظ على وصل الحروف.\n- Amiri (1.78 MB للوزنين) وNoto Naskh Arabic (386 KB) موجودان في `static/fonts/` ولا يُستعملان إلّا في PDF (`core/pdf_utils.py`، `templates/behavior/pdf/base_form.html`، `components/print/frame_css.html`) — لا يصلان للمتصفّح.\n- `line-height`: `body { line-height: var(--lh-normal) }` = 1.6 (`10-foundation.css:294,582`)، وهو الحدّ الأدنى الذي توصي به مهارة RTL للعربيّة. الرمز `--lh-ar: 1.8` «للتشكيل والامتدادات» معرَّفٌ لكنّه مستعملٌ **مرّةً واحدة** في كلّ CSS — أي أنّ النصوص المشكولة (رؤية الوزارة، التلميحات المشكولة) تُرسم على 1.6 فتتلاصق الحركات مع السطر الأعلى عند 12px.\n- `letter-spacing: 0` و`hyphens: none` على `html[lang=\"ar\"]` (`10-foundation.css:498-502`) — صحيح. لكن توجد 9 قواعد تضيف تباعداً (`0.05em` في `32-modules-3.css:1376,1878`، `0.1em` في `20-components.css:1454,1473`، `0.01em` في `:480,530`)؛ إن طُبّقت على نصٍّ عربيّ فهي تكسر اتّصال الحروف (العربيّة لا تقبل tracking). يلزم التحقّق أنّها محصورةٌ في أرقامٍ أو رموزٍ لاتينيّة.\n- حارس سلّم الخطّ `tests/test_font_scale.py` يمنع أيّ نصٍّ دون 12px، والنتيجة 0 مخالفة؛ و`font-size: clamp(…vw…)` غير موجود (0) فلا خطرَ على التكبير 200%.\n\n---\n\n## 2. الاتّجاه من اليمين إلى اليسار (RTL)\n\n### 2.1 الخصائص المنطقيّة مقابل الفيزيائيّة (مقيسة بـgrep)\n\n| الموضع | فيزيائيّ (`*-left/right`, `left:`, `right:`, `text-align: left/right`, `float`) | منطقيّ (`*-inline-*`, `*-block-*`, `inset-*`, `text-align: start/end`) |\n|---|---:|---:|\n| `static/css/**/*.css` | **1** (`32-modules-3.css:983` `border-right` في مصفوفة الجدول) | **436** |\n| قوالب الشاشة (`templates/` غير الورقيّة) | **0** | — |\n| قوالب PDF/الطباعة | 27 (`text-align: right` في `reports/base_qatar_report.html:28,196,205,222`، `behavior/pdf/base_form.html:10,55`، `wings/register_pdf.html:40,46`، `schedule/print_schedule.html:123` …؛ و`margin-left: 4px` في `reports/attendance_report.html:8`، `padding-right` في `reports/student_result_pdf.html:79,90`) | — |\n\n- النسبة في CSS الشاشة: 99.8% منطقيّ. الحارس `tests/test_rtl_logical_properties.py:25` يفحص `left:`/`right:` في المواضع فقط (`PHYSICAL_INSET`) ولا يفحص `margin-left` وأخواتها؛ لكن العدّ الفعليّ صفرٌ لها، فالحارس كافٍ عمليّاً ويُستحسن توسيعه.\n- الاستثناء الورقيّ مقصود (محرّكات PDF القديمة مثل xhtml2pdf لا تفهم الخصائص المنطقيّة؛ `core/pdf_utils.py:452` يعكس أعمدة الجدول يدويّاً `_reverse_table_columns`).\n\n### 2.2 الاتّجاه المختلط (bidi)\n\n- `<html lang=\"ar\" dir=\"rtl\">` في `base/base.html:5` و`auth/login.html:2` وقوالب PDF الرئيسيّة (`reports/base_qatar_report.html`، `behavior/pdf/base_form.html`، `schedule/print_schedule.html`). **`wings/register_pdf.html` بلا `<html lang dir>`** (grep يعيد فراغاً) — يعتمد على المحرّك.\n- `dir=\"ltr\"` 159 مرّة في القوالب (أرقام الجوال في `behavior/summon_parent.html:136`، معرّفات الدخول في `auth/login.html:71`، العدّ التنازليّ في `components/session_guard.html:18,22`، أرقام الكتب في `library/partials/book_rows.html:13` …) و`<bdi>` 77 مرّة و`unicode-bidi: isolate` في `20-components.css:882` لقوائم التفاصيل. تغطيةٌ جيّدة.\n- **`lang=\"en\"` = 0** في كلّ القوالب (كلّ 12 إشارة `lang=\"ar\"`). الأجزاء الإنجليزيّة (Excel، PDF، أكواد المواد، البريد) تُقرأ بمحرّك نطقٍ عربيّ في NVDA/VoiceOver. تأثيرٌ صغير لكنّه مخالفةٌ لـWCAG 3.1.2 (AA).\n- اتّجاه الصفحة في الحقول الرقميّة: `inputmode=\"numeric\"` + `dir=\"ltr\"` + `pattern` في الدخول (`login.html:71-74`)، و`number_inputmode()` في `core/templatetags/ui.py:629` يختار `decimal`/`numeric` تلقائيّاً من `step`.\n\n### 2.3 الأيقونات والأسهم\n\n- نظام أيقوناتٍ مركزيّ (`core/icons.py` + sprite) يحمل `mirror=True` للرسوم الاتّجاهيّة (`back`، `next`، `prev`، `trend` — `core/icons.py:173,216-220`) ويضيف الصنف `.icon-mirror` (`core/templatetags/icons.py:55-56`) الذي يقلبها بـ`html[dir=\"rtl\"] .icon-mirror { transform: scaleX(-1) }` (`10-foundation.css:97`). تصميمٌ صحيح.\n- **تناقض**: النصّ الحرفيّ `← رجوع` يظهر **17 مرّة** في القوالب (مثل `clinic/record_visit.html:15`)، وسهمه يشير يساراً أي إلى «الأمام» في RTL، بينما أيقونة `back` المنظومة تُقلب لتشير يميناً. فالمنصّة تقول «رجوع» بسهمين متعاكسين بحسب الصفحة. وزرّ الرجوع في الفتات (`components/breadcrumbs.html:14-16`) يستعمل أيقونة `next` المقلوبة (أي يسار) بدل `back`.\n\n---\n\n## 3. الوصولية (WCAG 2.2 AA)\n\n### 3.1 البنية والمعالم\n\n- رابط التخطّي `<a href=\"#main-content\" class=\"skip-nav\">تخطي للمحتوى الرئيسي<\/a>` (`base.html:75`)، `header role=banner` (`:90`)، `nav aria-label=\"التنقل الرئيسي\"` (`:133`)، `main#main-content` (`:1213`)، `footer role=contentinfo` (`:1297`)، `nav.mobile-bottom-nav aria-label=\"التنقل السريع\"` (`:1348`).\n- منطقتا إعلان: `#sr-live aria-live=polite aria-atomic` (`:81`) و`#toast-container aria-live=polite` (`:84`).\n- **صفحة الدخول مستقلّة** (`auth/login.html` لا ترث `base.html`): بلا `<main>` ولا رابط تخطّي ولا `<nav>`؛ تعليق `tests/a11y_axe_ratchet.py:13-14` يذكر أنّ القياس الأوّل وجد فيها `landmark-one-main`/`region`، وخطّ الأساس الآن `{}` لكنّ قائمة `PAGES` في `tests/test_a11y_live_pages.py:88-100` لا تتضمّن صفحة الدخول أصلاً (تبدأ من `student_affairs:student_list` بحساب المدير)، فالتحسّن غير مثبَت بالقياس.\n- `<h1>` واحد لكلّ صفحة يُرسم من وسم `page_header` (`components/ui/page_header.html:6`)، و`section_card` يرسم `<h2>` (`components/ui/section_card.html`)؛ الحارس `page_without_h1` في `tests/a11y_ratchet.py:219` يعطي 0.\n\n### 3.2 التركيز ولوحة المفاتيح\n\n- `focus-visible` في 40 قاعدة عبر الملفّات؛ `--focus-ring` و`--focus-color` رمزان (`10-foundation.css:162-167`)؛ `tests/test_focus_and_names.py:41-68` يتحقّق من ظهور الحلقة على كلّ سطحٍ في الوضعين وأنّ لا قاعدة تطفئها (`outline: none` الثلاث في `20-components.css:942,1279,2175` تحت الحارس).\n- WCAG 2.4.11 (المركَّز لا يُحجب): `html { scroll-padding-block: calc(var(--safe-top) + 91px) … }` (`10-foundation.css:493-496`) محسوبٌ بارتفاع الترويسة والشريط، وحارسٌ في `tests/test_wcag22_mobile.py:54-93`؛ وسكربتٌ يرفع الصفّ المحجوب تحت رأس جدولٍ لاصق (`base.js:619-630`).\n- WCAG 3.3.8 (المصادقة): لا CAPTCHA، اللصق مسموح، `autocomplete=\"username\"/\"current-password\"` (`login.html:67,91`؛ حارس `test_wcag22_mobile.py:144-167`).\n- WCAG 2.5.7 (السحب): كلّ سحبٍ له بديل نقرة بقائمةٍ محروسة (`test_wcag22_mobile.py:189-198`).\n- النوافذ: `role=dialog/alertdialog` + `aria-modal` + `aria-labelledby` (`components/modal.html:24-28`، `confirm_dialog.html:24-26`، `session_guard.html:10,34`)، حبس التركيز وإعادته إلى الفاتح وEscape (`base.js:660-696,762-767`). لوحة الأوامر Ctrl+K `role=dialog aria-label=\"البحث السريع\"` (`base.html:1276`) مع زرّ لمسٍ بديل على الجوال (`:103-105`).\n- القوائم: `role=menu/menuitem` تُنشر بـJS (`base.js:489-491`) مع `aria-expanded`/`aria-controls` على الأزرار (`base.html:496`).\n- `tabindex` موجب = 0، `tabindex=\"-1\"` = 5 فقط — سلامةٌ في ترتيب التنقّل.\n- **HTMX والجزئيّات**: بعد كلّ `htmx:afterSwap` يُعلن `#sr-live` «تم تحديث المحتوى» ثمّ يُفرَّغ بعد 1.5 ث (`base.js:610-616`) — إعلانٌ عامّ لا يصف ما تغيّر (عدد النتائج مثلاً)، ولا يُنقل التركيز إلى المنطقة المبدَّلة إلّا في نتائج التحقّق (`app.js:206-208` يركّز أوّل حقلٍ خاطئ). الترقيم (`components/pagination.html`) روابط حقيقيّة بـ`aria-label` و`aria-current=\"page\"` و`hx-push-url` فتبقى الصفحة قابلةً للتنقّل بلا JS. مؤشّر التحميل عامّ (`#htmx-loading-bar`، `base.js:583-584`) و`hx-indicator` محلّيّ في 3 مواضع فقط من 143 سمة `hx-*`.\n- التنقّل العميل الشامل `page-nav.js` (كلّ رابطٍ يبدّل المحتوى بتلاشٍ) يحدّث `document.title` (`:283`) و`aria-current` (`:176`) ويُرجع التمرير للأعلى (`:287`)، لكنّه **لا ينقل التركيز إلى `<main>`** ولا يُعلن عنوان الصفحة الجديدة لقارئ الشاشة — ثغرة SPA الكلاسيكيّة (WCAG 2.4.3 / 4.1.3)؛ الإعلان الوحيد هو «تم تحديث المحتوى» العامّ.\n\n### 3.3 النماذج\n\n- الوسم `{% field %}` (`core/templatetags/ui.py:541-626`) يولّد `<label for>` من `name`، و`aria-describedby` للمساعدة والخطأ، و`aria-invalid=\"true\"` عند الخطأ، و`role=\"alert\"` على نصّ الخطأ (`components/ui/field.html:8`)، و`req-star aria-hidden` للنجمة. القاعدة الثامنة في رأس `ui.py` تفرض ذلك والحارس `unnamed_field` = 0.\n- في القوالب كلّها: 222 `<label>` منها 161 بـ`for` (الباقي يلفّ الحقل أو مربّعات اختيار)، `aria-invalid` 3 يدويّة، `aria-describedby` 14، `required` 177، `inputmode` 28، `type=\"date\"` 64.\n- **لا ملخّص أخطاءٍ أعلى النموذج** (grep لـ`error-summary`/«ملخّص الأخطاء» = 0) رغم أنّ `docs/design/page_layouts.md §3أ` يذكر نمط GOV.UK/Carbon صراحةً كمرجع. الأخطاء تُعرض عند الحقل فقط، و`form.non_field_errors` في 25 قالباً و`form.errors` في 4، بينما توجد 52 فئة `forms.Form/ModelForm` — أي أنّ أكثر النماذج تُعالج بـ`request.POST.get` يدويّاً (مثل `clinic/views.py:138-152`) ولا تعيد أخطاء الحقول.\n- التحقّق العميل (`app.js:195-215`) يأخذ الرسالة من `input.title` أو `validationMessage` المتصفّح — الأخير يأتي بلغة المتصفّح لا المنصّة، فمتصفّحٌ إنجليزيّ يُظهر «Please fill out this field» وسط واجهةٍ عربيّة ما لم يُكتب `title`.\n- صفحة الدخول: حقل كلمة المرور يحمل `<label for>` **و**`aria-label=\"أدخل كلمة المرور\"` (`login.html:85-93`)؛ `aria-label` يتجاوز نصّ التسمية فيختلف ما يراه المبصر عمّا يسمعه قارئ الشاشة (مخالفة 2.5.3 Label in Name لفظاً). و`placeholder` الحقل الأوّل 60 حرفاً يجمع جمهورين («الموظّفون: الرقم الوظيفي — الطلبة وأولياء الأمور: الرقم الشخصي») ويُقصّ على 375px.\n\n### 3.4 الجداول\n\n- 183 `<table>` مقابل 218 غلاف `table-wrap` (الحارس `table_without_wrap` = 0؛ الغلاف يمرّر أفقيّاً بدل القصّ، `20-components.css:965-975`). رؤوس لاصقة في 14 قاعدة.\n- `th scope`: **332 من 798 (41.6%)**؛ `<caption>`: **3 من 183 (1.6%)**؛ `aria-sort`: 8. جداول البيانات الكبيرة (قوائم الطلاب والموظّفين) تعتمد على `aria-label` للمعالم لا على `caption`. شبكة الحضور نموذجيّة (`teacher/class_grid.html:63-78`: `scope=\"col\"`/`scope=\"row\"`، خلايا أزرار بـ`aria-label=\"الاسم — ح1\"`).\n- الجدول الورقيّ مستثنى من الغلاف عمداً (`a11y_ratchet.py:97-103`).\n\n### 3.5 التباين\n\n- أزواج الرموز محروسة في الوضعين (`tests/test_contrast_ratios.py:47-78`، `TOKEN_PAIRS` نصّ/سطح و`SHAPE_PAIRS` أشكال 3:1، ولوحة Chart.js `:142`)، و`tests/test_text_contrast_on_page.py` يقيس `--text-muted` و`--status-danger-fg` و`--text-secondary` و`--maroon-fg` على ثلاث أرضيّات. النصّ الثانويّ `#4b5563` على الأبيض ≈ 7.6:1؛ `--text-muted #58606d` 4.69 على أرضيّة الصفحة `#d7dee8` — فوق 4.5 لكن بهامش 0.19 فقط، وبـAPCA يقارب Lc 60 (دون 75 الموصى به لنصّ 12px)، وهو اللون المستعمل مع `--text-xs` الأكثر شيوعاً.\n- حدود الحقول `--control-border #6b7280` = 3.57 على الصفحة (WCAG 1.4.11 يطلب 3) موثّقة في `10-foundation.css:135`.\n\n### 3.6 التلميحات والمحتوى عند التحويم\n\n- وسم `callout` بخمسة أنواع (`ui.py:181-213`): `error`/`success` أسطرٌ ظاهرة (`role=alert` للخطأ)، و`hint`/`info`/`warning` **أيقونة** تُظهر النصّ بالتحويم أو التركيز أو النقر (قرار المالك 2026-09-20). التنفيذ (`components/ui/tip.html`) زرٌّ بـ`aria-expanded`/`aria-controls` ولوحة `role=tooltip`، ويُغلق بـEscape (`base.js:864-873`) — يستوفي 1.4.13. لكنّ **التحذيرات** (مثل إغلاق نافذة المعلّم `class_grid.html:35`) تُخفى خلف أيقونةٍ بـ18px ما لم يُضَف `show=True`؛ هذا قرار كثافةٍ يخالف Nielsen #1 (ظهور حالة النظام) حين يكون المحتوى حالةً لا شرحاً.\n- 39 `<span title=\"…\">` غير تفاعليّة (مثل نقاط الحصص `per-dot` في `wings/partials/record_panel.html:46`) — محتواها لا يصل للوحة المفاتيح ولا اللمس ولا قارئ الشاشة؛ حالة كلّ حصّة (رُصدت/لم تُرصد) مرئيّةٌ باللون والـ`title` فقط (مخالفة 1.4.1 و1.3.1).\n\n### 3.7 الزمن والتحديث التلقائيّ\n\n- صفحة حالة التصدير `templates/core/export_status.html:17` تعيد تحميل نفسها بـ`<meta http-equiv=\"refresh\" content=\"2\">` ما دام العمل جارياً — تحديثٌ كامل كلّ ثانيتين يعيد قارئ الشاشة إلى رأس الصفحة ويخالف 2.2.1/2.2.4 ويُفقد سياق التركيز؛ البديل الموجود أصلاً (`export-center.js:254` يستطلع `?format=json` بـfetch) لا يُستعمل هنا.\n- حارس الجلسة (`session-guard.js`) ينبّه قبل دقيقتين (`WARN_AT = 120`) بنافذة `alertdialog` و`role=status` — يستوفي 2.2.1 (تمديد).\n\n### 3.8 الفحص الآليّ وتغطيته\n\n- أربع سقّاطات (ratchets) لا تسمح بزيادة المخالفات: مصدر القالب (`tests/a11y_ratchet.py`: 5 قواعد، خطّ الأساس صفر)، axe-core في متصفّحٍ حيّ (`tests/a11y_axe_ratchet.py`، وسوم `wcag2a/2aa/21a/21aa` فقط دون `best-practice`، خطّ الأساس `{}` أي صفر)، تدقيق الجوال (`tests/mobile_audit.py`: 25 صفحة × 3 ملفّات Chromium جوال/WebKit جوال/سطح مكتب)، وLighthouse جوال (`tests/lighthouse_baseline.json`: وصوليّة 99 على 5 صفحات).\n- **التغطية**: axe يفحص `PAGES` (≈9 صفحات) + `EVALUATION_PAGES` من أصل 175 صفحةً تطبيقيّة — نحو 6%؛ لا يشمل الدخول ولا لوحة الأولياء ولا شبكة الحضور. CI: `quality-gate.yml:528-548` يشغّله في ثلاث أرجل متوازية على كلّ PR، و`nightly.yml:104-123` يعيد المتصفّحين.\n- نتائج الجوال (`tests/mobile_audit_baseline.json` محسوبة): جوال Chromium 431 هدفاً و**0 دون 44px** (K1 = 0.0%)، جوال WebKit 434 هدفاً و0، سطح المكتب 491 هدفاً منها 436 دون 44px لكنّ قاعدة سطح المكتب 24px (WCAG 2.5.8 AA) و**0 دون 24px**؛ `inputs_under_16` = 23 على سطح المكتب (لا تكبير iOS هناك). لا تجاوز أفقيّ ولا نصّ دقيق.\n- WCAG 2.2 محروس نصّيّاً بندًا بندًا في `tests/test_wcag22_mobile.py` (2.4.11، 2.5.7، 2.5.8، 3.3.8)، و`test_no_aria_pressed_on_links.py`، و`test_touch_target_token.py`.\n- لوحة إدارة Django: `static/js/admin_a11y.js` يسمّي 620 عقدةً وجدها axe بلا اسم في 237 صفحة إدارة (تعليق الملفّ `:3-16`).\n- الحركة: `@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms … } }` عامّ (`20-components.css:1605-1609`) + استثناءاتٌ موضعيّة.\n\n---\n\n## 4. أنماط الصفحات\n\n- المواصفة `docs/design/page_layouts.md` (LAY-02، قرار D-16 2026-09-23) تعرّف سبعة أنماط مسمّاة + `custom`، مستندةً إلى SAP Fiori floorplans وMaterial 3 window classes وGOV.UK. الوسم `{% page_layout %}` (`ui.py:419-444`) يرفض الاسم المجهول بـ`TemplateSyntaxError`.\n- **التبنّي**: 78 من 175 صفحةً ترث `base.html` تعلن نمطها (44.6%): list 28، form 19، dashboard 12، detail 6، report 5، sheet 4، hub 3. و`tests/page_layout_baseline.json` يسجّل 102 صفحةً لم تعلن بعد (سقّاطة لا تسمح بزيادتها). الصفحات غير المعلنة تتركّز في `behavior/` (9)، `quality/` (8)، `parents/` (7)، `library/` (3)، `analytics/` (2) — أي أنّ بوّابة الأولياء كلّها خارج النظام.\n- المكوّنات المركزيّة: `page_header` 192 استعمالاً، `filter_bar` 52 (`<form role=search aria-label>` مع رفض الشريط بلا حقل، `ui.py:640-660`)، `empty_state` 37، `section_card` بحالة فراغٍ مدمجة (`empty=`)، `kpi_strip` بحدّ ستّ بطاقات، `callout`، `action_tile`، `entity_card`. دستور البطاقات (9 قواعد) في رأس `ui.py` و`tests/design_ratchet.py` يحرسه.\n- حالات الفراغ: 618 حلقة `{% for %}` مقابل 61 `{% empty %}` خامّاً، لكنّ الحارس `partial_without_empty_state` (الذي يميّز القوائم عن الخيارات) = 0، وكثيرٌ من الفراغ يمرّ عبر `section_card empty=`.\n- التحميل: `components/skeleton.html` و50 إشارة `skeleton`، `data-loading` يضع دوّارة على زرّ الإرسال (`actions.js`)، `aria-busy` في مركز التصدير (`export-center.js:204,341`)، وتوست «جارٍ التحضير» بعد 600ms فقط لتفادي الوميض (`export-center.js:14`).\n- التغذية الراجعة: رسائل Django تُرسم بـ`role` مشتقٍّ من النوع وزرّ إغلاق (`base.html:1181-1194`)، `showToast` يميّز `alert` للخطر/التحذير و`status` للنجاح (`base.js:516`)، و`HX-Trigger: showToast` من الخادم (`:563-566`)، وأخطاء الشبكة/المهلة بتوست عربيّ (`:588-607`). نافذة تأكيدٍ مركزيّة بدل `window.confirm` (`data-confirm`، `class_grid.html:52-53`).\n- التمرير: أنماط `dashboard/list/sheet` تحمل `page-noscroll` — `body:has(> #main-content.page-noscroll) { height: 100dvh; overflow: hidden }` (`50-utilities.css:297`) فتتمرّر البطاقة/الجدول داخليّاً، و`<link rel=\"expect\" blocking=\"render\">` (`base.html:9`) يؤخّر الرسم حتّى يُحسم القرار لمنع القفز. يُعطَّل دون 1025px (`33-modules-4.css:1374,1505`) فيعود التمرير الطبيعيّ للجوال. هذا نمط «تطبيق سطح مكتب» يخدم مشغّلي البيانات لكنّه يخفي ما تحت الطيّ خلف مناطق تمريرٍ متداخلة على اللوحيّ (641–1024px) حيث يعمل.\n- الجوال: `viewport-fit=cover` مع `env(safe-area-inset-*)`، `touch-action: manipulation` على كلّ عنصرٍ تفاعليّ (`10-foundation.css:66`)، أهداف 44px على `(pointer: coarse)` (`50-utilities.css:266-290`، قرار M-01)، شريط تنقّل سفليّ بـ≤5 عناصر بحسب الدور (`base.html:1348-1407`)، صفحة بلا اتّصال وعامل خدمة (`templates/pwa/sw_global.js`)، لافتة تثبيت PWA. اختبارات `test_action_cards_fit_narrow_screens.py` تقيس 320/360/375px. البطاقات داخل `page-noscroll` على 1024px وما دونه تتحوّل لتمريرٍ عاديّ.\n- الفراغ والتسلسل: شبكة 4px، `.container max-width: 1280px` (`10-foundation.css:601`)، عناوين `--text-3xl` 32px → `--text-2xl` 24px → `--text-xl` 20px. لكنّ غلبة `--text-xs` (221) و`.btn-sm/.btn-xs` تجعل الصفحات كثيفةً (مقصودٌ بقرار «استثمار عرض النافذة»، `CLAUDE.md`).\n\n---\n\n## 5. تدفّقات المستخدم الرئيسيّة\n\n### 5.1 تسجيل الدخول (`templates/auth/login.html`، `core/views_auth.py`)\n- الخطوات: (1) المعرّف الرقميّ + كلمة المرور → (2) رمز التحقّق الثنائيّ إن كان مفعَّلاً (`verify_2fa`, `views_auth.py:247-248,364-413`) → (3) تغيير كلمة المرور الإجباريّ عند أوّل دخول (`:311,388`) → (4) اختيار الدور لمن له أدوارٌ متعدّدة (`auth/choose_role.html`) → اللوحة. من 1 إلى 4 خطوات.\n- الاحتكاك: حقلٌ واحد للمعرّف لجمهورين بـ`placeholder` طويل؛ لا زرّ «إظهار كلمة المرور»؛ لا استعادةٌ ذاتيّة («تواصل مع مسؤول النظام» + رقم الهاتف، `login.html:100-107`) — مقبولٌ أمنيّاً في مدرسةٍ لكنّه عبءٌ على مسؤول النظام؛ قفل axes بصفحةٍ بهويّة المنصّة (`errors/locked_out.html`، `views_auth.py:210`) دون إخبار المستخدم بعدد المحاولات المتبقّية قبل القفل.\n- الأخطاء: رسائل Django بـ`role=alert` فوق النموذج؛ `pattern` + `title` عربيّ للحقل الرقميّ؛ `autofocus` على المعرّف.\n- ما ينقص: `<main>` ورابط تخطّي؛ إزالة `aria-label` المكرّر؛ تقسيم التلميح إلى سطرٍ مساعدٍ ثابت بدل placeholder.\n\n### 5.2 لوحة المدير (`templates/dashboard/main.html` → `roles/director.html`)\n- 12 قالب دور (`dashboard/roles/`) بدل ملفٍّ واحد بألف سطر (تعليق `main.html:11-14`). المدير يرى شريط KPI وبطاقات أقسام ورسمين مصغّرين (حضور 7 أيّام، توزيع الدرجات) يُجلبان من `/analytics/api/...` بعد التحميل (`main.html:46-75`).\n- الاحتكاك/الأداء: `chart.umd.min.js` (200.6 KB) يُحمَّل **متزامناً بلا `defer`** (`main.html:41`) ثمّ سكربت inline يبني الرسوم؛ Lighthouse جوال لهذه الصفحة: أداء **54**، LCP **6,634ms**، TBT **545ms** (`tests/lighthouse_baseline.json`) — أسوأ صفحةٍ مقيسة. بيانات الرسوم طلبان إضافيّان بعد الرسم (لا skeleton مخصّص لهما).\n- ما ينقص: تأجيل Chart.js (أو رسم SVG خادميّ للمصغّرات)، وبديل نصّيّ/جدوليّ للرسوم (canvas بلا `aria-label` في القالب المقروء).\n\n### 5.3 تسجيل الحضور\n- **المعلّم** (`teacher/class_grid.html`, `static/js/class-grid.js`): نمط `sheet`، جدول الطلبة × الحصص، كلّ خليّة زرٌّ بحالةٍ دوريّة (غائب → حاضر) و`aria-label` بالاسم والحصّة، مفاتيح «الكلّ حاضر/غائب» لكلّ عمود، حفظٌ لكلّ حصّة (`data-save-col`)، مسودّة في `localStorage` بمعرّفاتٍ لا أسماء (`class-grid.js:9`)، نافذة تأكيد مركزيّة، إجراءات الطالب (تأخّر/خروج/عودة) في `<dialog>`، تبويب الحصّة على الجوال (`role=tablist`)، وضع تصحيحٍ بعد إغلاق النافذة مع سبب. خطوات الرصد المعتاد: فتح الشعبة → لمس الغائبين → حفظ = 3. تصميمٌ ناضج.\n- الاحتكاك: الحفظ لكلّ عمودٍ على حدة (لا «حفظ الكلّ»)؛ تحذير إغلاق النافذة مخفيٌّ خلف أيقونة `warning` (`:35`)؛ لا مؤشّر اتّصال/عدم اتّصال رغم المسودّة.\n- **مشرف الجناح** (`wings/record_index.html` + `partials/record_panel.html`): رقائق شُعب (`rec-chip`) كروابط بعدّادات حاضر/غائب/متأخّر ونقاط حصص بـ`title` فقط، تصدير لكلّ جناح عبر `<details>` مع اختيار الاتّجاه. مزج تواريخٍ `date:'Y-m-d'` في الروابط. حالة «لا جناحَ مُسنَد» بـ`callout info show=True`.\n\n### 5.4 العيادة — الإدخال السريع (`templates/clinic/record_visit.html`, `clinic/views.py:132-172`)\n- 5 حقول + مربّع «أُرسل إلى المنزل» + زرّ. `hx-post` يعيد بطاقة الزيارة في `#visit-result` أسفل النموذج (`:19,66`) فيبقى النموذج ممتلئاً للزيارة التالية (جيّد للتسلسل).\n- **الاحتكاك الأكبر**: اختيار الطالب `<select>` أصليّ يحوي **كلّ طلبة المدرسة النشطين** (`clinic/views.py:162-164`، `CustomUser.objects.filter(memberships__role__name=\"student\")` بلا ترشيح) — مئات الخيارات بلا بحثٍ ولا ترشيح بالصفّ/الشعبة، على الجوال خصوصاً؛ بينما نموذج السلوك يملك combobox بحثيّاً (`behavior/report_form.html:82-92`) لم يُعَد استعماله. لا ترتيب معلَن للقائمة (`distinct()` بلا `order_by`).\n- التحقّق: خادميّاً `request.POST.get` بلا `forms.Form`؛ درجة الحرارة `min=35 max=42 step=0.1` عميلاً فقط. زرّ الحفظ بصنف `btn-danger` (أحمر) لفعلٍ غير تدميريّ — يخالف دلالة اللون في النظام نفسه حيث `btn-danger` للحذف/المخالفة.\n- بعد الحفظ: لا نقلَ للتركيز إلى البطاقة الناتجة ولا توست؛ الإعلان العامّ «تم تحديث المحتوى» فقط.\n- ما ينقص: اختيار سريع من «شعب اليوم/الحصّة الحاليّة»، أكواد الخدمة والشكوى (`service_code`/`complaint_code` يُقرآن في العرض `:152-153` لكنّ النموذج لا يعرضهما).\n\n### 5.5 السلوك (`templates/behavior/report_form.html`، 335 سطراً)\n- الخطوات: بحثٌ نصّيّ في المخالفات → اختيار البند (أزرار بـ`aria-pressed`) → ترشيح صفّ/شعبة → combobox الطالب (`role=combobox` + `listbox` + `select` مخفيّ مزامَن) → الإجراء التأديبيّ → وصف المحضر (20–2000 حرفاً مع عدّاد `aria-describedby`) → تحذير إشعار وليّ الأمر → تسجيل. 6–7 خطوات في صفحةٍ واحدة طويلة.\n- الاحتكاك: **حقلان للوصف** («وصف المخالفة للمحضر» إلزاميّ و«وصف المخالفة» اختياريّ، `:115-124`) بتسميتين متقاربتين؛ لا فواصل بصريّة (`fieldset/legend` = 0 في الملفّ) لمراحل النموذج؛ المستوى يُشتقّ من البند ويُخزَّن في `hiddenLevel` بلا إظهارٍ صريح للعاقبة قبل الإرسال.\n- الإيجابيّ: callout تحذيريّ قبل الإرسال عن إشعار الوليّ (`:127`)، `minlength/maxlength`، `required/aria-required` ديناميكيّ (`:314-318`).\n\n### 5.6 الأولياء (`templates/parents/`، `parents/urls.py`)\n- اللوحة: بطاقة لكلّ ابنٍ بـ`kpi_strip` و3 أزرار (الدرجات/الحضور/السلوك) + «روابط عامّة» (كلّ الدرجات، كلّ الحضور، الإشعارات، إعدادات الخصوصيّة، لائحة السلوك PDF). حالة فراغٍ واضحة حين لا ابنَ مرتبطاً (`dashboard.html:59-61`). خطوتان إلى أيّ تقرير.\n- الاحتكاك: 7 قوالب خارج `page_layout`؛ فتات الخبز تقول «لوحة التحكم» والعنوان «بوابة ولي الأمر» والشريط السفليّ «أبنائي» — ثلاثة أسماء لصفحةٍ واحدة؛ لا أعذارَ غيابٍ تُقدَّم من البوّابة (الأعذار في `wings/excuse_requests.html` لجانب المدرسة فقط)؛ لا تواصلَ مع المعلّم.\n- الإيجابيّ: موافقة PDPPL (`parents/consent.html`)، إشعارات push (`push_subscribe`)، PWA خاصّة (`parents/pwa/`).\n\n### 5.7 الجدول (`templates/teacher/schedule.html`, `templates/schedule/`, `static/js/schedule-matrix.js`)\n- جدول المعلّم اليوميّ مع ترشيح (معلّم/شعبة/إخفاء المكتملة) وبطاقة «الحصّة التالية» بزرّ انتقالٍ مباشر للحضور (`schedule.html:55`) — اختصارٌ ذكيّ. القوائم عبر `section_card` بحالة فراغ.\n- مصفوفة الجدول المدرسيّ: تنقّل لوحة مفاتيح داخل الخلايا و`aria-live` (`schedule-matrix.js:105,326-394`)، رأسٌ لاصق؛ الخليّة الواحدة في `32-modules-3.css:983` تستعمل `border-right` (الفيزيائيّة الوحيدة).\n- التبديل بين المعلّمين (`swap_request/respond`) والتعويض (`compensatory_*`) تدفّقاتٌ منفصلة بصفحات نموذجٍ قياسيّة.\n\n### 5.8 التقارير والتصدير (`templates/reports/index.html`, `static/js/export-center.js`, `templates/core/export_status.html`)\n- الفهرس: 4 تبويبات (نتائج/شهادات/حضور/سلوك) كروابط تحمل كلّ المرشّحات، مرشّحات مرحلة/صفّ/سنة/ورقة، بحث طالبٍ، ولكلّ شعبة: معاينة PDF في `iframe title` داخل `report_viewer.html` + تنزيل + Excel. callout PDPPL قبل Excel السلوك (`index.html:117`). الخطوات: فهرس → مرشّح → معاينة → تنزيل = 3–4.\n- مركز التصدير: `data-app-file` يعترض الروابط، يضع `aria-busy`، توست «جارٍ التحضير» بعد 600ms، يستطلع الوظائف الخلفيّة بـJSON، وينزّل بالاسم. سياسة «لا طباعةَ مباشرة» محروسة (`tests/test_no_web_page_print_button.py`) فكلّ ورقٍ يمرّ بمسار PDF ذي ترويسةٍ وتذييلٍ موحّدين (`core/templatetags/print_frame.py`).\n- الاحتكاك: صفحة الحالة بـ`meta refresh` كلّ ثانيتين (§3.7)؛ لا سجلَّ «تصديراتي الأخيرة»؛ Excel يفتح LTR (§8).\n\n---\n\n## 6. اللغة والنصوص\n\n- **الفصحى والتشكيل**: النصوص فصيحة، والتشكيل الجزئيّ مستعمل بكثافة في التعليقات والتوثيق وبعض نصوص الواجهة («شُعبي اليومَ — يُلمس الغائبُ وحدَه»، `record_index.html:17`). لكنّ المصطلح الواحد يرد بتشكيلٍ وبدونه: «المعلّم» 113 مقابل «المعلم» 61؛ «وليّ الأمر» 38 مقابل «ولي الأمر» 41؛ «الممرّض» 2 مقابل «ممرض» 2. هذا يُربك البحث النصّيّ والذاكرة البصريّة.\n- **اتّساق المصطلحات** (عدّ grep في القوالب): «الطلاب» 137 / «الطلبة» 50؛ «الرئيسية» 37 / «لوحة التحكم» 4 / «لوحة القيادة» 1 للصفحة نفسها؛ «حفظ» 108 / «تسجيل» 101 / «إرسال» 43 لأزرار الإجراء الأساسيّ؛ «رجوع» 39 / «عودة» 27؛ «فصل/الفصل» 199 مقابل «شعبة/الشعبة» 301 (قد يحمل «الفصل» معنى الفصل الدراسيّ أيضاً فيزداد الغموض). المعجم الوزاريّ لعنوان الصفّ موحّد عبر `core/labels.py` (`07/2`) — نموذجٌ يُحتذى لبقيّة المصطلحات.\n- **الأرقام**: قرارٌ واعٍ بالأرقام الغربيّة (0-9) في كلّ الواجهة؛ الأرقام الهنديّة 16 رمزاً فقط في 4 ملفّات كلّها `styleguide/`. يتّفق مع القاعدة الذهبيّة 4 في مهارة RTL لواجهةٍ تقنيّة كثيفة الأرقام. حقول الإدخال تفرض 0-9 بـ`pattern` ورسالةٍ عربيّة.\n- **التواريخ**: 13 صيغةً مختلفة لمرشّح `date` في القوالب: `d/m/Y` 50، `Y-m-d` 25، `d/m/Y H:i` 24، `d/m` 21، `Y/m/d` 19، `d/m H:i` 15، `Y/m/d H:i` 13، `j/n` 7، `l d/m/Y` 4، `F Y` 3 … أي أنّ التاريخ نفسه يظهر «21/10/2026» في صفحة و«2026/10/21» في أخرى و«2026-10-21» في ثالثة (الأخيرة مناسبةٌ لقيم `input[type=date]` والروابط لا للعرض). **لا تقويمَ هجريّاً** في أيّ قالبٍ أو وحدة (grep لـhijri/هجري/umm_al_qura = 0) رغم أنّ الوثائق الرسميّة القطريّة والشهادات تذكر التاريخين عادةً.\n- **صيغ الجمع**: لا مرشّحَ عربيّاً للجمع (grep لـ`pluralize`/`ar_plural`/`count_word` = 0). الأرقام تُلصق بصيغةٍ ثابتة: `{{ row.students }} طالباً` (`record_panel.html:49`) تعطي «1 طالباً» و«3 طالباً» و«25 طالباً» — والصحيح: طالبٌ واحد، 3 طلّاب، 25 طالباً (المفرد المنصوب فقط من 11 إلى 99). الخطأ نفسه في «حصصٌ لم تُرصد {{ n }}» وغيرها.\n- **رسائل الخطأ**: 316 رسالةً في العروض كلّها عربيّة (لا رسالة إنجليزيّة وُجدت)؛ أخطاء HTMX والشبكة عربيّة (`base.js:588-607`). الاستثناء: رسائل `validationMessage` المتصفّح (§3.3) و`alt=\"True\"/\"Search\"` في لوحة الإدارة التي يعرّبها `admin_a11y.js`.\n- **نصوص إنجليزيّة ظاهرة**: شبه معدومة في التطبيق (العيّنة كلّها من `styleguide/`)؛ أسماء الصيغ (PDF/Excel) مقبولة.\n- **اللهجة**: فصحى محايدة بلا خليجيّة، وهو المناسب لوثائق مدرسةٍ حكوميّة.\n\n---\n\n## 7. الأداء المحسوس\n\n- **CSS**: 8 ملفّات حاجبة = 469.7 KB خامّاً (≤270 KB مصغَّراً، وBrotli في الإنتاج)، لا CSS حرج مضمَّن سوى لون الأرضيّة؛ `@layer` و`color-mix()` و`:has()` و`100dvh` تحتاج Chrome 111+/Safari 16.4+/Firefox 121+ (لـ`:has`).\n- **JS**: 11 سكربتاً `defer` في كلّ صفحة (218 KB خامّاً)، أثقلها `base.js` 62 KB و`session-guard.js` 23 KB (يُحمَّل لكلّ صفحة مصادَقة بقرار W-20261005-003) و`roadmap.js` 52 KB (صفحة واحدة). htmx **1.9.12** (الإصدار 2.x متاحٌ منذ 2024 بحجمٍ أقلّ ودعم `hx-on` الأفضل). Chart.js 200 KB على 10 لوحات، متزامناً في `dashboard/main.html:41` و`analytics/dashboard.html:91`.\n- **الخطوط**: preload لوزنين (≈40 KB) + Medium عند الطلب؛ `font-display: swap` يمنع النصّ غير المرئيّ لكنّه يسبّب وميض تبديل الخطّ مع Tahoma/Segoe (مقاييس Tajawal أضيق فيحدث CLS طفيف؛ CLS المقيس 0–0.007). `font_kb` 120 والفعليّ ≈ 61.\n- **الصور**: 6 `<img>` فقط (5 بـ`alt`، 4 `loading=\"lazy\"`)؛ الأيقونات sprite SVG واحد؛ أيقونات PWA ≤ 57 KB. `image_kb` 220.\n- **Core Web Vitals** (مقيسة في CI): CLS 0–0.007، INP 24–64ms (تبديل الثيم)، LCP محلّيّاً 184–888ms (`web_vitals.py:112-113`) لكن Lighthouse جوال (اختناق 4G) يعطي LCP 5.4–6.6 ث وأداء 54–69 على 5 صفحات — أي أنّ الصفحة سريعةٌ على سطح المكتب وثقيلةٌ على شبكة جوالٍ متوسّطة. القياس الميدانيّ RUM (`rum.js`) بعيّنةٍ وبلا هويّة (PDPPL) موجودٌ لكنّه مطفأ ما لم يُضبط `RUM_ENDPOINT`.\n- **الإدراك**: تنقّل عميل بتلاشٍ (`page-nav.js`) يُبقي الترويسة ثابتة، شريط تحميل HTMX عامّ، مؤشّر «آخر تحديث» بزرّ تحديث (`base.html:1203-1207`)، skeletons في 50 موضعاً. `rel=expect blocking=render` يُحسّن الاستقرار على حساب أوّل رسم.\n\n---\n\n## 8. التوافق\n\n- **المتصفّحات**: لا polyfills؛ الاعتماد على `color-mix` (`10-foundation.css:162`)، `:has()` (`50-utilities.css:297`)، `@layer`، `100dvh`، `@font-palette-values`، `<link rel=expect>` (Chrome فقط؛ يُتجاهل في غيره بسلام). الحدّ الأدنى الفعليّ: Chrome/Edge 111، Safari 16.4، Firefox 121. أجهزة iPad قديمة (iOS 15) تفقد `color-mix` فتسقط حلقة التركيز وبعض الألوان المشتقّة. يُستحسن توثيق مصفوفة الدعم.\n- **الطباعة**: `@media print` في 9 كتل CSS + 10 في القوالب؛ `50-utilities.css:14-40` يضبط A4 بهوامش 20mm ويخفي الأزرار والتنقّل. لكنّ السياسة الرسميّة «لا طباعةَ مباشرة» (قرار المالك 2026-09-21) تحوّل كلّ الطباعة إلى PDF؛ نظام الإطار المطبوع (`core/print_frame.py`، `docs/design/print_fit_spec.md`) مع ثلاث سقّاطات هندسة (`print_fit`, `print_frame`, `pdf_geometry`) تقيس A4 فعليّاً.\n- **PDF**: سلسلة محرّكات بالترتيب WeasyPrint → Playwright → xhtml2pdf (`core/pdf_utils.py:660-771`) مع إعادة تشكيل الحروف وعكس الأعمدة لـxhtml2pdf؛ خطوط Amiri/Noto مضمّنة؛ ترويسة/تذييل بالرؤية الوزاريّة. قالب `wings/register_pdf.html` بلا `lang/dir` على `<html>`.\n- **Excel**: `openpyxl` عبر `core/export_utils.py` (ترويسة بالشعار، تذييل، أنماط علامة تجاريّة، `apply_print_footer`). **لا ضبطَ لـ`ws.sheet_view.rightToLeft = True`** (grep = 0 في `core/export_utils.py` و`reports/export_builders.py` و`core/exports/`) — فتفتح الأوراق العربيّة من اليسار في Excel، والعمود الأوّل (الاسم) يقع في أقصى اليسار خلافاً لاتّجاه القراءة. إصلاحٌ بسطرٍ واحد لكلّ ورقة.\n- **Django admin**: ثيم مخصّص `admin_theme.css` + `admin_a11y.js` + `admin_i18n.js` + اختبارات `test_admin_js_arabic.py`، `test_admin_password_arabic.py`.\n\n---\n\n## 9. جدول SWOT — محور تجربة الاستخدام\n\n### نقاط القوّة (مرتّبة بالأثر)\n1. **هندسة جودة الواجهة كحرّاس CI**: 843 ملفّ اختبار، منها سقّاطات axe حيّ ومصدر وجوال وLighthouse وتباين وليليّ وRTL وطباعة؛ خطّ أساس axe `{}` وا11y-ratchet صفر (`tests/a11y_axe_ratchet_baseline.json`, `tests/a11y_ratchet_baseline.json`).\n2. **RTL منطقيّ شبه كامل**: 436 خاصّيّة منطقيّة مقابل 1 فيزيائيّة في CSS الشاشة، 0 في قوالب الشاشة، نظام أيقونات يعكس الاتّجاهيّ (`core/icons.py` mirror، `10-foundation.css:97`).\n3. **أهداف اللمس 44px على الجوال بنسبة 0% مخالفة** في 25 صفحة × محرّكين (`tests/mobile_audit_baseline.json`، K1 = 0.0%) وقاعدة 24px لسطح المكتب (K3 = 0%).\n4. **نظام رموز موثّق بالنِّسب ومُختبَر**: 252 متغيّراً، تعليقٌ يُحرَس بأن يطابق النسبة المحسوبة (`test_contrast_ratios.py:269`)، وضع ليليّ كامل بـ`test_dark_parity.py`.\n5. **مكوّنات مركزيّة ترفض الخطأ**: `field` يفرض `label for` + `aria-describedby` + `aria-invalid` (`ui.py:541-626`)، `filter_bar` يفرض `role=search aria-label` ويرفض شريطاً بلا حقل (`ui.py:640-660`)، `page_layout` يرفض النمط المجهول.\n6. **شبكة الحضور للمعلّم** (`teacher/class_grid.html`): جدول دلاليّ كامل، خلايا بأسماء، مسودّة محلّيّة بلا بيانات شخصيّة، تأكيدٌ مركزيّ، إجراءات في `<dialog>`، وضع تصحيح — أنضج تدفّقٍ في المنصّة.\n7. **WCAG 2.2 المعايير الجديدة محروسة بالاسم** (2.4.11، 2.5.7، 2.5.8، 3.3.8) في `tests/test_wcag22_mobile.py` مع `scroll-padding-block` محسوب.\n8. **التغذية الراجعة الدلاليّة**: توست `alert` للخطر و`status` للنجاح (`base.js:516`)، رسائل Django بدور مشتقّ، أخطاء شبكة عربيّة، نافذة تأكيد مركزيّة بدل `confirm()`.\n9. **سياسة طباعة/تصدير موحّدة**: لا `window.print`، إطار مطبوع مركزيّ بترويسة الوزارة، وسقّاطات تقيس A4 فعليّاً؛ سلسلة محرّكات PDF مع احتياط.\n10. **الطباعة العربيّة**: Tajawal محلّيّ بـ`unicode-range` وpreload، `letter-spacing: 0` و`hyphens: none` للعربيّة، نسخة Tashkeel بلوحة ألوان للحركات، حدّ 12px محروس.\n11. **خصوصيّة بالبنية**: RUM بلا هويّة، مسودّة الحضور بمعرّفاتٍ فقط، استبانة تجربةٍ منفصلة الجدولين (`ux_survey/models.py`)، موافقة الأولياء، تحذير PDPPL قبل تنزيل بيانات السلوك.\n12. **لوحة إدارة Django معرَّبة وموصولة**: `admin_a11y.js` يسمّي 620 عقدة، ثيم بهويّة المنصّة.\n\n### نقاط الضعف (مرتّبة بالأثر)\n1. **ميزانيّة CSS على بعد 287 بايتاً من الانفجار** (469.7 KB من 470؛ `web_vitals.py:140`) بعد ستّ رفعاتٍ في خمسة أسابيع — أيّ ميزة تالية تكسر CI أو ترفع السقف مجدّداً؛ `32/33-modules` وحدهما 227 KB.\n2. **أداء الجوال المقيس ضعيف**: Lighthouse أداء 54–69، LCP 5.4–6.6 ث، TBT 545ms على لوحة المدير (`tests/lighthouse_baseline.json`)؛ Chart.js 200 KB متزامن (`dashboard/main.html:41`).\n3. **اختيار الطالب في العيادة `<select>` بكلّ طلبة المدرسة** بلا بحثٍ ولا ترتيب (`clinic/views.py:162-164`, `record_visit.html:26-33`) — أبطأ خطوةٍ في «الإدخال السريع» وأصعبها على الجوال.\n4. **تغطية axe الحيّ ≈ 6% من الصفحات** (`test_a11y_live_pages.py:88-100`)؛ الدخول والأولياء وشبكة الحضور خارجها، فخطّ الأساس الصفريّ يعكس العيّنة لا المنصّة.\n5. **لا احترامَ لتفضيل النظام الداكن ولا للتباين العالي**: `prefers-color-scheme` و`forced-colors` = 0 في CSS/JS المنصّة؛ `meta color-scheme` ثابتٌ على `light`.\n6. **صيغ الجمع العربيّة غير معالَجة** («3 طالباً»، `record_panel.html:49`) و13 صيغة تاريخ متنافسة بلا تقويمٍ هجريّ — مساسٌ بالمصداقيّة اللغويّة لمنصّةٍ رسميّة.\n7. **تنقّل SPA بلا إدارة تركيز**: `page-nav.js` يبدّل المحتوى ويحدّث العنوان لكن لا ينقل التركيز إلى `<main>` ولا يُعلن العنوان؛ إعلان HTMX عامّ «تم تحديث المحتوى» (`base.js:610-616`).\n8. **لا ملخّص أخطاء أعلى النماذج** و52 نموذج Django يُعرض `form.errors` في 4 منها فقط؛ رسائل التحقّق العميل قد تأتي بلغة المتصفّح (`app.js:200`).\n9. **تحذيرات الحالة مخفيّة خلف أيقونات** (`callout warning` بلا `show`) و39 `span title` غير قابلة للوصول (نقاط الحصص) — معلوماتٌ تشغيليّة لا تصل للمس ولا لقارئ الشاشة.\n10. **اتّساق المصطلحات والتشكيل**: «المعلّم/المعلم» 113/61، «الطلاب/الطلبة» 137/50، «الرئيسية/لوحة التحكم» 37/4، ثلاثة أسماء لبوّابة الأولياء، «← رجوع» بسهمٍ معاكسٍ للأيقونة 17 مرّة.\n11. **تبنّي أنماط الصفحات 44.6%** و102 صفحة في `page_layout_baseline.json`؛ بوّابة الأولياء (7 قوالب) و`behavior/` (9) خارج النظام.\n12. **الجداول**: `th scope` 41.6% و`caption` 1.6% من 183 جدولاً؛ `aria-sort` 8.\n13. **Excel يفتح LTR** (لا `rightToLeft`)، و`export_status.html` يعيد التحميل كلّ ثانيتين بـ`meta refresh`.\n14. **سلّم الخطّ مائل للصغر**: `--text-xs` 12px هو الأكثر استعمالاً (221) و≈60 حجماً خارج الرموز؛ `--lh-ar 1.8` مهجور (استعمال واحد).\n\n### الفرص\n1. **ترقية htmx 1.9.12 → 2.x** وتقليل `base.js` (62 KB) و`session-guard.js` (23 KB) بتقسيمٍ كسول؛ يحرّر ≥ 40 KB من ميزانيّة JS.\n2. **تفعيل RUM** (`rum.js` جاهزٌ ومطابقٌ لـPDPPL) لقياس LCP/INP الميدانيّ على أجهزة المعلّمين الفعليّة بدل تقديرات CI.\n3. **إعادة استعمال combobox السلوك** كمكوّن `{% field type=\"combobox\" %}` للعيادة والأولياء والتبديل — يحلّ 3 تدفّقاتٍ بمكوّنٍ واحد.\n4. **مرشّح جمعٍ عربيّ ومرشّح تاريخٍ موحّد** (`|ar_count:\"طالب\"`، `|ar_date` بصيغةٍ واحدة + هجريّ اختياريّ عبر `hijri-converter`) — تحسينٌ لغويٌّ عابرٌ للمنصّة بكلفةٍ صغيرة.\n5. **استبانة التجربة الموجودة** (`ux_survey`) تتيح قياس SUS/UMUX فعليّاً وتحديد أولويّات التدفّقات بالبيانات لا بالتخمين.\n6. **توسيع axe إلى الأدوار الخمسة** باستعمال نفس `_signed_in_state` في `test_mobile_audit.py` (25 صفحة جاهزة) — يرفع التغطية من 6% إلى ≈ 20% بلا بنيةٍ جديدة.\n7. **تقسيم CSS بحسب الوحدة** (modules-3/4 = 227 KB تُحمَّل لصفحاتٍ لا تستعملها) مع `{% block extra_css %}` الموجود أصلاً لعارض الوثائق — يحرّر مئات الكيلوبايتات ويحلّ أزمة الميزانيّة جذريّاً.\n8. **دعم `prefers-color-scheme` بسطرٍ واحد** في السكربت المبكّر (`base.html:17`) مع إبقاء التجاوز اليدويّ، و`forced-colors` لحلقة التركيز والحدود.\n9. **بوّابة الأولياء**: إدخال أعذار الغياب وطلب موعدٍ من البوّابة يغلق حلقة الحضور ويقلّل مكالمات المشرفين.\n10. **مركز قيادة التصدير** يملك بنية الوظائف الخلفيّة؛ إضافة «تصديراتي الأخيرة» وإشعار push عند الجاهزيّة يحوّله إلى تجربةٍ غير حاجبة.\n\n### التهديدات\n1. **قفل الميزانيّات بالاستثناءات**: سجلّ الرفع في `web_vitals.py:116-132` و`test_css_budget.py:24-37` يُظهر أنّ السقف يتحرّك مع كلّ ميزة؛ إن استمرّ فقد الحارس معناه.\n2. **اعتماد CSS حديث بلا احتياط** (`color-mix`, `:has`, `dvh`) على أجهزة لوحيّة مدرسيّة قديمة (iPadOS ≤ 16.3) → فقدان حلقة التركيز والألوان المشتقّة بصمت.\n3. **بنية «بلا تمرير» على اللوحيّ** (641–1024px) تخلق مناطق تمريرٍ متداخلة تخفي المحتوى تحت الطيّ وتربك إيماءات اللمس.\n4. **تعدّد المحرّكات في PDF** (WeasyPrint/Playwright/xhtml2pdf) يعني ثلاثة أشكالٍ محتملة للمستند الواحد بحسب بيئة النشر؛ عكس الأعمدة اليدويّ هشّ.\n5. **الانجراف اللغويّ**: بلا معجمٍ محروس (كما `core/labels.py` للصفّ) ستستمرّ ازدواجيّة التشكيل والمصطلحات مع كلّ مساهمٍ جديد.\n6. **Chart.js المتزامن + fetch بعد التحميل** على شبكة 3G/4G مدرسيّة يُطيل TBT ويجعل لوحة المدير — أوّل ما يُرى صباحاً — أبطأ الصفحات.\n7. **التحقّق اليدويّ بـ`request.POST.get`** في تدفّقاتٍ حسّاسة (العيادة) بلا `forms.Form` يعني غياب رسائل خطأ حقليّة ثابتة؛ خطأٌ في درجة الحرارة أو طالبٍ ناقص قد يمرّ بصمت أو يسقط بـ500.\n8. **الفرع المحلّيّ `claude/verify-tour-manual` متأخّر 663 التزاماً** عن `origin/main`؛ أيّ تحليلٍ أو قرارٍ على الشجرة المحلّيّة يصف واقعاً عمره شهر.\n9. **لوحة المفاتيح في الأجزاء المخصّصة بـJS** (combobox السلوك، مصفوفة الجدول، تبويبات الحضور) خارج تغطية axe وتعتمد على اختباراتٍ نصّيّة؛ انحدارٌ في `keydown` لا يُكشف.\n10. **`meta refresh` و`title`-only** أنماطٌ قديمة قد تتكاثر بالقياس على الموجود ما لم يُحرَسا كما حُرس `window.print`.\n\n---\n\n## 10. أهمّ 10 توصيات قابلة للتنفيذ\n\n| # | التوصية | الدليل | الأثر | الجهد |\n|---|---|---|---|---|\n| 1 | تقسيم CSS الوحدات: تحميل `32-modules-3` و`33-modules-4` (227 KB) فقط في صفحات وحداتها عبر `extra_css`، وخفض `css_kb` إلى 300 مع هامشٍ حقيقيّ | `core/css_files.py`, `web_vitals.py:140` هامش 287 بايتاً | أداء + استدامة الحارس | متوسّط (يومان–ثلاثة) |\n| 2 | تأجيل Chart.js (`defer` + `IntersectionObserver`) أو رسم المصغّرات SVG من الخادم؛ هدف TBT < 200ms على لوحة المدير | `dashboard/main.html:41`, `lighthouse_baseline.json` TBT 545 | أداء الجوال، أوّل انطباع يوميّ | صغير (نصف يوم) |\n| 3 | استبدال `<select>` الطلاب في العيادة بـcombobox بحثيّ مُعاد استعماله من السلوك، مع ترشيحٍ افتراضيّ «الحصّة الحاليّة/الجناح» وترتيبٍ بالاسم | `clinic/views.py:162-164`, `behavior/report_form.html:82-92` | أسرع تدفّقٍ حرجٍ (العيادة) | متوسّط (يومان) |\n| 4 | إدارة التركيز في `page-nav.js` وHTMX: بعد التبديل `main.focus()` (مع `tabindex=-1`) وإعلان `document.title` في `#sr-live` بدل «تم تحديث المحتوى»؛ وفي الجزئيّات إعلان عدد النتائج | `page-nav.js:283-287`, `base.js:610-616` | وصوليّة قا ة ثانية على الرأس 6f7ec0608، تستبدل النسخة الأولى)\n\n# SchoolOS: تحليل تغطية المجال وتحليل SWOT (الإصدار الثاني)\n\nتاريخ التقرير: 2026-10-21\nالأساس: الشجرة `C:\\Users\\mesue\\wt_swot` عند الرأس 6f7ec0608 (تطابق origin/main). قراءة فقط، لا تعديل ولا git write.\nلم تُقرأ شجرة `D:\\shschool_mvp` الرئيسية لأنها قديمة. وثائق الوزارة في `D:\\shschool_mvp\\AAdocs\\ministry_data\\2026_2027\\`.\nهذا التقرير يستبدل `swot_domain_coverage.md` (مبنيّ على رأس بتاريخ 2026-09-23). كلّ استنتاج هنا أُعيد التحقّق منه على الرأس الحالي بدليل ملف:سطر.\n\n## 0. تحفّظات منهجية\n\n1. قيمة `VERDICT_ENGINE_ENABLED` و`EMAIL_BACKEND` في الإنتاج لا يمكن معرفتها من الشيفرة؛ المعروف هو الافتراضي فقط.\n2. إحصاءات خارطة الطريق مستخرجة من ملفات الهجرة (`roadmap/migrations/0001..0082`) وليست من قاعدة الإنتاج؛ هي حدّ أدنى جزئي (213 بنداً سليم البنية).\n3. المقارنة مع المنصات المنافسة تقدير مبنيّ على معرفة عامة بتلك المنتجات، لا على اختبار مباشر.\n4. طلبات أولياء الأمور (PR #1218) مفتوحة وغير مدمجة في main؛ تُعامَل كغير موجودة على main.\n\n## 1. مقاييس الحجم (على 6f7ec0608)\n\n- 28 تطبيق مشروع في `INSTALLED_APPS` (التقرير القديم: 23). `api/` وحدة وليست تطبيقاً.\n- نحو 173.8 ألف سطر Python دون الاختبارات والهجرات (نحو 357 ألفاً بها).\n- 350 قالب HTML، 790 ملف اختبار، 419 هجرة.\n- 1677 commit إجمالاً، منها 661 منذ 2026-09-23.\n- 37 دوراً (`core/models/access.py`, `Role.ROLES`)؛ 99 صلاحية في `tests/capabilities_registry_snapshot.json`.\n\n## 2. جرد متطلبات الوزارة\n\nالحالة: مكتمل / جزئي / غائب. «مكتمل» تعني وجود التدفق المطلوب في الشيفرة على main، لا تشغيله في الإنتاج.\n\n### 2.1 الحضور والغياب: جزئي متقدّم\n\n- الموجود: `operations/absence_policy.py` فيه بوّابات الغياب `GATES_1_11` (سطر 71) و`GATES_12` (80) و`GATES_ESE` (87)، و`TARDIES_PER_ABSENCE_DAY=7` (149). `AbsenceAlert` بحالات held/issuing/pending/notified/resolved. سجلات إلحاقية `AbsenceContactLog` و`AbsenceActionLog` (`operations/models/absence_followup.py`) مع طباعة متابعة. `TardinessExcuse` (`operations/models/attendance.py:320`). `ClassExit n- الموجود (`staff_affairs/`): `LeaveRequest` (`models.py:186`) و`LEAVE_TYPES` (سطر 24، نحو 28 نوعاً بينها العارضة وبدون راتب والحج والأمومة والعدّة وإصابة العمل) ومراحل `LEAVE_STAGES` (سطر 76) مع `leave_flow.py`. `PermitRequest` (439) و`PERMIT_STAGES` (429). `StaffAttendance` اليومي مع استيراد البصمة، `AttendanceException`, `StaffAssignment`, `StaffAttendanceExemption`. إشعارات الخصم بداية الشهر (`notices.py`). نظرة ترخيص تصنّف منتهٍ/قارب/ساري/لا شيء فقط. `appointments.py` للتعيين والمغادرة.\n- الغائب (لا نتائج في الشيفرة): مباشرة العمل (النموذج 04)، تحديث بيانات الموظف (05)، محضر إفادة (06)، العودة من الإجازة (09)، إخلاء الطرف (10)، التحقيق (11)، سجلات التطوير المهني والتدريب.\n\n### 2.7 التجربة: انتهاء الفترة (Probation): مكتمل، والجزاءات غائبة\n\n- الموجود: `EmploymentContract` (`staff_affairs/models.py:143`) بأشهر التجربة والتمديد والنتيجة (`PROBATION_RESULTS`). `staff_affairs/probation.py` يمدّد التجربة للمرضية (مادة 72)، يستثني الأمومة والعدّة، ويمنع السنوية ومرافقة الزوج أثناء التجربة؛ `record_result` (~107) يرفض نتيجة قبل تاريخ الانتهاء الفعلي. #1203 (d5603b107، دُمج 2026-10-21) أضاف `views_probation.py` ومحدّدات `pending_results` وإجراء إدارة وقالباً وتسجيل نتيجة مُدقَّق.\n- الغائب: الجزاءات التأديبية للموظفين. `quality/evaluation_services.py:276` يوثّق أن `year_facts()` تُرجع None لأن `StaffDisciplinaryAction` لم يُبنَ؛ فسقف التقدير للمادتين 17/18 (ثوابت 69-73) لا يعمل أبداً.\n\n### 2.8 الاختبارات (exam_control + assessments): جزئي\n\n- الموجود: `exam_control` بـ 7 نماذج و10 مسارات. `core/domain/grades.py`: `PASS_MARK=50` (447)، `FINAL_GRADE=12` (137)، `MAX_FAILED_FOR_SECOND_ROUND=3` (448)، حالات promoted وsecond_round.\n- محرك الحكم `VERDICT_ENGINE_ENABLED`: `shschool/settings/base.py:846` يقرأ البيئة ويفترض الإيقاف (`in {\"1\",\"true\",\"yes\"}`). تعليق (نحو 840-845) يطلب ضبطه على web وworker وbeat معاً. لا ذكر له في `.railway/railway.ts` ولا `.env.example` ولا `.env.railway.example` ولا ملفات docker-compose. `docs/schedule_live_readiness_2026-10-10.md:26` يدرجه مطفأً. `core/verdict_read.py` فيه نحو 30 موضع استدعاء تتبع العلم. آخر تعديلات المحرك قديمة (#439 و#408). قيمة الإنتاج مجهولة من الشيفرة.\n- فجوة موثّقة: `ExamDeprivation` و`ExamMisconduct` (`assessments/models.py:695,745`) لا تُستعمل إلا في `verdict_engine.py` (554, 560) و`governance/erasure_service.py`؛ لا عرض ولا نموذج ولا admin. فلا واجهة لتسجيل الحرمان أو الغش، فالمحرك لو فُعّل سيقرأ جداول بلا مصدر إدخال.\n\n### 2.9 الجدول المدرسي: جزئي متقدّم\n\n- التصدير: `schedule.pdf` و`schedule.xlsx` و`schedule.pages_pdf` عبر سجلّ التصدير؛ عرض الجدول لولي الأمر (`schedule.day`, `schedule.view`). وثيقة الجاهزية `docs/schedule_live_readiness_2026-10-10.md`. مشروع جودة الجدول (wave1) قيد العمل.\n- الفجوة: بنود ساعة المدرسة CLK-01..03 وجدول المناوبة DUT-01 لا تزال todo.\n\n### 2.10 أولياء الأمور: جزئي ومجمَّد\n\n- الموجود: بوابة (`parents/urls.py`, `parents/views.py`): درجات، حضور، سلوك، إدارة روابط الأبناء، موافقة، PWA، دفع. `/api/v1/parent/children/` في API (30 مساراً).\n- الفجوة: لا تقديم عذر ولا طلب ولا شكوى ولا رسائل من البوابة. والمنصة كلها مجمَّدة لأولياء الأمور افتراضياً (القسم 8).\n\n### 2.11 المكتبة: جزئي ضعيف\n\n- `library`: 3 نماذج و6 مسارات. لا غرامات ولا جرد. الدور `librarian` له 3 صلاحيات.\n\n### 2.12 النقل: جزئي ضعيف\n\n- `transport`: نموذجان و8 مسارات. `tracking_map` (`transport/views.py:167`) لا يعرض خريطة بل أزرار نسخ لمعرّف Karwa ورابط GPS. الدوران `bus_supervisor` (صلاحية واحدة) و`transport_officer` (2).\n\n### 2.13 الأنشطة: جزئي ضعيف\n\n- `StudentActivity` و`StudentNote` موجودان. لا مجلس طلبة ولا إدارة فعاليات أو رحلات.\n\n### 2.14 التقارير الدورية: جزئي\n\n- `reports/urls.py` فيه 11 مساراً: نتائج الصف PDF/Excel، الشهادات، حضور PDF/Excel، نتيجة الطالب والنتيجة السنوية PDF، سلوك Excel. `analytics`: 13 مساراً ولوحة مؤشرات وPDF شهري.\n- الفجوة: لا مسار ترقية أو نهاية عام (`create_year_sections` أمر إداري فقط)، ولا حالة تخرّج، ولا تسريع.\n\n### 2.15 الإخلاء والطوارئ: شبه غائب\n\n- لم تُوجد في الشيفرة تدريبات إخلاء ولا سجلها. الموجود هو `emergency_broadcast` (`notifications/views.py:392`) عبر WebSocket للمتصلين فقط.\n\n### 2.16 الجودة والتقييم المؤسسي: جزئي جيّد\n\n- `quality`: 17 نموذجاً و50 مساراً، 7 نماذج تقييم من الوزارة (`quality/ministry_appraisal_forms.json`)، ملاحظات صفية، لجان، تظلمات.\n- `academic_management/views.py`: 7 صفحات `_stub_view` في الأسطر 41, 46, 51, 56, 61, 66, 71 (تقييمات، أقسام، تحليل اختبارات، تقارير أقسام، تعلّم إلكتروني، أداء الصف، التعثر).\n\n### 2.17 الإرشاد والخدمات النفسية والتعليم الخاص: غائب غالباً\n\n- لم توجد نماذج الأخصائي النفسي أو الاجتماعي (18 في الكتالوج 07d)، ولا نماذج المرشد الأكاديمي، ولا تسهيلات اختبارية، ولا IEP. الدوران `speech_therapist` و`occupational_therapist` بصلاحيتين لكل منهما.\n\n## 3. تغطية الأدوار\n\n37 دوراً. الصلاحيات من حزمة `core/capabilities/` (21 ملفاً) وأرقامها من اللقطة.\n\n| الدور | الصلاحيات | ملاحظة |\n|---|---|---|\n| principal | 92 | تغطية كاملة تقريباً |\n| vice_admin | 78 | |\n| vice_academic | 71 | |\n| coordinator | 41 | |\n| student_affairs_coordinator | 39 | جديد |\n| admin_supervisor | 31 | |\n| teacher | 28 | |\n| secretary | 12 (6 خاصة) | |\n| student | 4 | |\n| parent | 4 | schedule.day وschedule.view وparents.portal وdashboard.open |\n| nurse | 3 | clinic.access وclinic.write وstudent_info.read |\n| librarian، teacher_assistant، ese_assistant | 3 لكل | |\n| transport_officer، speech_therapist، occupational_therapist | 2 لكل | |\n| it_technician، bus_supervisor | 1 لكل | |\n\nتسعة أدوار بصلاحيات عامة فقط (dashboard.open وstaff_affairs.own_* وux_survey.respond وsot.read وstudents.search): `support_companion`, `receptionist`, `student_observer`, `lab_technician`, `storekeeper`, `accountant`, `canteen_supervisor`, `services_worker`, `messenger`. أي أن ربع الأدوار تقريباً أسماء بلا عمل مدعوم في المنصة.\n\nالتغيّر عن القديم: 35 دوراً صارت 37، و~70 صلاحية صارت 99، و`core/capabilities.py` صار حزمة.\n\n## 4. دورة حياة الطالب والموظف\n\nالطالب:\n- التسجيل: استيراد سجل الوزارة (`core/ministry_import.py`، 26 عموداً) + طلب قبول `AdmissionApplication`.\n- النقل داخلاً وخارجاً: سلسلة أربع مراحل، تغيير الصف الداخلي بمستوى واحد.\n- الحضور والسلوك والعيادة والدرجات: موجود بدرجات متفاوتة.\n- الترقية/الرسوب/الدور الثاني: قواعد المجال موجودة (`core/domain/grades.py`) لكن محرك الحكم مطفأ افتراضياً ولا مسار نهاية عام.\n- التخرّج والتسريب والمحو: محو عبر `governance/erasure_service.py`؛ لا حالة تخرّج.\n\nالموظف:\n- التعيين والتجربة وانتهاؤها: موجود (القسم 2.7).\n- الإجازات والتصاريح والحضور والخصم: موجود.\n- مباشرة العمل، العودة من الإجازة، إخلاء الطرف، التحقيق، الجزاءات، التطوير المهني: غائب.\n- لا مسار تهيئة مدرسة جديدة (onboarding)؛ بذور وأوامر إدارية فقط.\n\n## 5. التقارير والتصدير للوزارة\n\n- سجلّ التصدير المركزي (`core/exports/registry.py`) فيه 6 أنواع فقط: `schedule.pdf`, `schedule.xlsx`, `schedule.pages_pdf`, `operations.absence_followup_pdf`, `reports.class_certificates`, `student_affairs.students_pdf`. بقية التقارير (11 في `reports/`) خارج السجلّ.\n- الاستيراد من الوزارة موجود، لكن لا تصدير ولا رفع إلى الوزارة أو نظام نور. تقرير الغياب P1+P2 في `wings/ministry_response.py` ملف يُسلَّم يدوياً.\n\n## 6. الإشعارات وبوابة الأولياء\n\n- `notifications/hub.py` `DEFAULT_CHANNELS` يغطي 25 نوع حدث بقنوات in_app وpush وwhatsapp وemail وsms، مع ساعات هدوء وDLQ وموافقة وتفضيلات.\n- `NOTIFICATION_HUB_DELIVERY_PIPELINE_ENABLED` مطفأ في الإنتاج (`notifications/hub.py:448-450`, `base.py:576`).\n- لا حقل لغة في الإشعارات.\n- البريد في الإنتاج: `shschool/settings/production.py:14` يفترض `UndeliveredEmailBackend` ما لم يُضبط `EMAIL_BACKEND`، و`staff_affairs/notices.py` يذكر أنه لا مزوّد بريد مضبوطاً في الإنتاج اليوم.\n- مسار العيادة يتجاوز Hub.\n- البث الطارئ عبر WebSocket للمتصلين فقط.\n- البوابة للقراءة غالباً (درجات، حضور، سلوك، جدول، موافقة، دفع) دون أي إدخال من ولي الأمر.\n\n## 7. خارطة الطريق والقرارات\n\nاشتقاقاً من الهجرات (حدّ أدنى جزئي): 213 بنداً سليماً: 109 مُنجز، 65 قيد التنفيذ، 33 todo، 5 محجوب، 1 مؤجّل.\n- المحجوب: MAE-04 وMAE-06 وMAE-13 وN-095 وN-107.\n- مخطط للمنتج: PUL-01..05 (السؤال الأسبوعي)، CLK-01..03 (ساعة المدرسة)، DUT-01 (مناوبة)، PRP-02a وPRP-04a، وعائلة السلوك N-126..N-134، وعائلة العيادة CLN-00..19.\n- آخر هجرة: `0082_sync_items_2026_10_21` (N-152, #1178).\n- القرارات: تسجّل بصيغة D-xxxم في `C:\\Users\\mesue\\delivery_manager_work\\decisions.md` (نحو 438 قراراً، آخر ما قُرئ D-452م).\n  - D-268م (2026-10-08، مدير المدرسة): تجميد كل ما يتعلق بأولياء الأمور وإخفاء بياناتهم دون حذف. D-272م تكملة. مفتاح مركزي واحد.\n  - D-343م/D-405م: اعتماد النقل الداخلي بجهة واحدة.\n  - D-443م: اعتماد PR #1218.\n- متعثر: N-095 (إغلاق ثغرة البحث عن المستخدم بين المدارس) محجوب.\n\n## 8. تجميد أولياء الأمور (قيد حاكم)\n\n`PARENTS_FROZEN` مجمَّد افتراضياً (`shschool/settings/base.py:781`, `core/parents_freeze.py`; runbook `docs/governance/parents_freeze_runbook.md`). مواضع التطبيق الموثّقة بالبحث: `notifications/frozen.py:36,49`، `notifications/services.py:398,485`، `notifications/tasks.py:590,1095`، `notifications/views.py:157`، `behavior/digest.py:243`، `clinic/services.py:415`، `wings/absence_notice_services.py:160`، `core/context_processors.py:36`. الأثر: كل إرسال موجَّه لولي أمر يُتخطّى، وإشعارات الموظفين تستمر. أي ميزة أولياء أمور (إخطار غياب، بريد مخالفة، إخطار عيادة، بوابة) غير فعّالة عملياً إلى أن يفكّ المالك التجميد، مهما اكتملت شيفرتها. هذا قرار ملكي لا قصور هندسي، لكنه يحدّد قيمة المنتج للأسرة اليوم.\n\n## 9. مقارنة تقديرية مع منصات أخرى (تقدير)\n\nتنبيه: هذا تقدير مبنيّ على معرفة عامة، لا على اختبار.\n\n| البعد | SchoolOS | Classera | Skolera | PowerSchool | نور (الوزارة) |\n|---|---|---|---|---|---|\n| الامتثال للوائح الوزارة القطرية (حضور، سلوك، أعذار) | عميق ومحلّي | عام/خليجي | عام | عام عالمي | هو المرجع الرسمي |\n| التعلّم الإلكتروني LMS | غائب | قوي | قوي | قوي (عبر شركاء) | محدود |\n| بوابة وتطبيق الأولياء | موجود لكن مجمَّد، قراءة فقط | قوي | قوي | قوي | محدود |\n| الجدول المدرسي المؤتمت | قوي (قيد التحسين) | متوسط | متوسط | قوي | غير موجود |\n| الإرشاد والعيادة | بدايات (العيادة جزئية) | محدود | محدود | متوسط | غير موجود |\n| تعدد المدارس | RLS لكن دون onboarding | قوي | قوي | قوي جداً | وطني |\n| الامتثال PDPPL | تشفير حقول ومحو وتدقيق | غير مؤكد | غير مؤكد | يتطلب ضبطاً | وطني |\n| التكامل مع الوزارة | استيراد فقط | غير مؤكد | غير مؤكد | غير موجود | هو النظام |\n\nالخلاصة التقديرية: SchoolOS يتفوق في عمق الأنظمة الوزارية القطرية وفي الحوكمة وخصوصية البيانات، ويتأخر عن المنافسين في تجربة الأسرة وLMS وجاهزية التشغيل الفعلي.\n\n## 10. تعدد المستأجرين\n\n- RLS مدفوع بدور الاتصال (هجرة `core/0037`)، و`RLSMiddleware` مغلق عند الفشل، و`tests/test_tenant_surface_coverage.py`.\n- `core/tenancy.py` يصنّف DIRECT_SCHOOL محسوباً، وPARENT_DERIVED وGLOBAL_INFRASTRUCTURE وSPECIAL_UNRESOLVED مصرَّحاً؛ وفي SPECIAL_UNRESOLVED الجدولان `core_healthrecord` و`core_storedfile`.\n- تدقيق `docs/privacy/tenant_isolation_audit_2026-10-05.md`: `core_customuser` عام بلا RLS.\n- بحث مستخدم بلا مرشّح مدرسة قائم: `behavior/views.py:867` (`get_object_or_404(CustomUser, pk=sid)` بعد `_require_in_wing` الذي يفحص نطاق الجناح فقط)، و`api/views.py:193,258,712,762`. البند N-095 لإغلاقها محجوب.\n- لا onboarding لمدرسة جديدة. «الشحانية» مدينة افتراضية في `core/models/school.py:71` وتظهر في تعليقات قليلة.\n\n## 11. تحليل SWOT\n\n### نقاط القوة\n\n| # | البند | الدليل |\n|---|---|---|\n| S1 | عمق قواعد الوزارة القطرية مرمَّزة في الشيفرة | `behavior/conduct_2026.py` (41 مخالفة، 23 سلّماً)، `operations/absence_policy.py:71-149`، `core/domain/grades.py:137,447,448` |\n| S2 | نموذج صلاحيات دقيق وقابل للاختبار | 99 صلاحية في اللقطة، حزمة `core/capabilities/` من 21 ملفاً، 37 دوراً |\n| S3 | عزل مستأجرين على مستوى قاعدة البيانات | هجرة `core/0037`، `RLSMiddleware` مغلق عند الفشل، `tests/test_tenant_surface_coverage.py` |\n| S4 | حماية بيانات حساسة (PDPPL) | حقول مشفّرة في `clinic/models.py:20`، `governance/erasure_service.py`، سجلات إلحاقية |\n| S5 | سلاسل اعتماد متعددة المراحل موثّقة | `transfer_chain.py`، `leave_flow.py`، مراحل `AbsenceExcuse`، `PermitRequest` |\n| S6 | انضباط الاختبارات والتغيير | 790 ملف اختبار، 661 commit في شهر، فحوص CI ناجحة (42 فحصاً على #1218

<title>تقرير SWOT SchoolOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: ترويسة لاصقة بتنقّل خماسي، صفحة «نظرة عامة» بمؤشّرات وجدول زمني وقرارات تفاعلية، وصفحات قراءة بفهرس يتتبّع موضع القارئ. */
:root{
  --bg:#f1f2f6; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#141a28; --muted:#586075; --line:#dcdfe8;
  --accent:#8a1538; --accent-ink:#ffffff; --accent-soft:#f7e7ec;
  --good:#1b6a43; --good-soft:#e2f2e9; --warn:#8a5a00; --warn-soft:#fbf0d8; --bad:#b0261e; --bad-soft:#fbe4e1;
  --code-bg:#eceff5; --track:#e4e7ef; --scrim:rgba(20,26,40,.5);
  --hero-bg:#182036; --hero-ink:#eef1f8; --hero-muted:#a9b3c9; --hero-card:rgba(255,255,255,.06); --hero-line:rgba(255,255,255,.14);
  --hero-good:#7fd6a4; --hero-warn:#f1bb52; --hero-bad:#f58a80; --hero-accent:#f08aa5;
  --display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d111b; --surface:#151b29; --surface-2:#1a2132; --ink:#e9ecf3; --muted:#9ba5ba; --line:#29324a;
  --accent:#ec7a97; --accent-ink:#2b0a15; --accent-soft:#3b1b28;
  --good:#6fcf9a; --good-soft:#163325; --warn:#e7ba5b; --warn-soft:#352b12; --bad:#f4938b; --bad-soft:#3a1c1a;
  --code-bg:#1b2335; --track:#242d43; --scrim:rgba(0,0,0,.6);
  --hero-bg:#1a2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d111b; --surface:#151b29; --surface-2:#1a2132; --ink:#e9ecf3; --muted:#9ba5ba; --line:#29324a;
  --accent:#ec7a97; --accent-ink:#2b0a15; --accent-soft:#3b1b28;
  --good:#6fcf9a; --good-soft:#163325; --warn:#e7ba5b; --warn-soft:#352b12; --bad:#f4938b; --bad-soft:#3a1c1a;
  --code-bg:#1b2335; --track:#242d43; --scrim:rgba(0,0,0,.6);
  --hero-bg:#1a2340; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.bleed{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1180px;margin-inline:auto}

/* الترويسة */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px}
.top .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:6px;align-items:center}
.ib{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-weight:600}
.ib:hover{background:var(--surface-2)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
@media (max-width:760px){.ib .lbl,.ib kbd{display:none}.brand span.nm{display:none}.nav{order:3;flex-basis:100%}.tools{margin-inline-start:auto}}
.prog{position:absolute;inset:auto 0 -1px;height:3px;background:transparent}
.prog i{display:block;height:100%;background:var(--accent);transform-origin:right;transform:scaleX(0)}

/* البحث */
.srch{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.srch-p{width:min(720px,100%);max-height:calc(100vh - 110px);background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.srch-h{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.srch-h input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
.srch-b{overflow:auto;padding:6px}
.srch-m{padding:18px;color:var(--muted)}
.rs{display:block;width:100%;text-align:start;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;line-height:1.6}
.rs:hover,.rs:focus-visible{background:var(--accent-soft)}
.rs b{display:inline-block;font-size:.76rem;font-weight:600;color:var(--accent);margin-inline-end:8px}
.rs mark{background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.rs small{display:block;color:var(--muted)}

/* نظرة عامة */
.hero{background:var(--hero-bg);color:var(--hero-ink);padding-block:34px 40px}
.eyebrow{font-family:var(--mono);font-size:.78rem;color:var(--hero-muted);direction:ltr;text-align:start;margin:0 0 10px}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,4.2vw,2.6rem);line-height:1.35;margin:0 0 6px;text-wrap:balance}
.hero p.sub{margin:0 0 22px;color:var(--hero-muted);max-width:68ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hero-line);background:var(--hero-card);border-radius:999px;padding:4px 14px;font-size:.88rem}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--hero-warn)}
.chip.bad i{background:var(--hero-bad)}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.gc{display:flex;gap:20px;align-items:center;background:var(--hero-card);border:1px solid var(--hero-line);border-radius:16px;padding:20px}
@media (max-width:520px){.gc{flex-direction:column;text-align:center}}
.gauge{flex:0 0 150px;width:150px}
.gauge svg{width:150px;height:150px;display:block}
.g-track{fill:none;stroke:var(--hero-line);stroke-width:10}
.g-arc{fill:none;stroke-width:10;stroke-linecap:round}
.g-tgt-track{fill:none;stroke:var(--hero-line);stroke-width:2}
.g-tgt{fill:none;stroke:var(--hero-ink);stroke-width:4;opacity:.85}
.g-num{font-family:var(--display);font-weight:600;font-size:40px;fill:var(--hero-ink)}
.g-den{font-size:11px;fill:var(--hero-muted)}
.gc.warn .g-arc{stroke:var(--hero-warn)} .gc.bad .g-arc{stroke:var(--hero-bad)} .gc.good .g-arc{stroke:var(--hero-good)}
.gc h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0 0 6px}
.tier{display:inline-block;font-size:.84rem;font-weight:600;border-radius:999px;padding:2px 12px;margin-bottom:8px;border:1px solid currentColor}
.gc.warn .tier{color:var(--hero-warn)} .gc.bad .tier{color:var(--hero-bad)} .gc.good .tier{color:var(--hero-good)}
.gc p{margin:0 0 6px;color:var(--hero-muted);font-size:.93rem;line-height:1.65}
.gc .tg{color:var(--hero-ink);font-size:.88rem}
.gc .tg b{font-family:var(--display);font-variant-numeric:tabular-nums}
.gc a.more{color:var(--hero-accent);font-weight:600;text-decoration:none;display:inline-block;margin-top:4px}
.gc a.more:hover{text-decoration:underline}
.legend-g{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;color:var(--hero-muted);font-size:.82rem}
.legend-g span::before{content:"";display:inline-block;vertical-align:middle;margin-inline-end:6px}
.legend-g .a::before{width:18px;height:6px;border-radius:3px;background:var(--hero-warn)}
.legend-g .t::before{width:18px;height:4px;background:var(--hero-ink)}

.sec{padding-block:40px 8px}
.sec h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0 0 4px;text-wrap:balance}
.sec>.in>p.lead{margin:0 0 20px;color:var(--muted);max-width:72ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.panel h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h3 em{font-style:normal;font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;font-size:.9rem}
.bars{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.bar .nm{font-size:.92rem;line-height:1.5}
.bar .vl{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted)}
.bar .tr{grid-column:1/-1;justify-self:start;height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:6px}
.bar.good .fl{background:var(--good)} .bar.warn .fl{background:var(--warn)} .bar.bad .fl{background:var(--bad)}
.bar.bad .vl{color:var(--bad);font-weight:600}
.note-s{font-size:.82rem;color:var(--muted);margin:14px 0 0}

.risks{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:r}
.risks li{counter-increment:r;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.risks li:last-child{border-bottom:0}
.risks li::before{content:counter(r);font-family:var(--display);font-weight:600;color:var(--accent);background:var(--accent-soft);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:.88rem}
.risks b{display:block;font-weight:600;line-height:1.5}
.risks span{display:block;color:var(--muted);font-size:.92rem;line-height:1.65}
.risks a{font-size:.82rem;font-weight:600;text-decoration:none}
.risks a:hover{text-decoration:underline}

.gantt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.g-axis,.g-row .trk{display:grid;grid-template-columns:repeat(11,minmax(0,1fr)) minmax(0,2.6fr);gap:0}
.g-axis{color:var(--muted);font-size:.78rem;font-family:var(--display);padding-inline-start:230px;margin-bottom:6px}
.g-axis span{text-align:start;border-inline-start:1px solid var(--line);padding-inline-start:4px}
.g-row{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:center;gap:0;padding-block:6px;border-top:1px solid var(--line)}
.g-row .lb{font-size:.92rem;line-height:1.45;padding-inline-end:12px}
.g-row .lb b{font-family:var(--display);font-weight:600;display:block}
.g-row .lb small{color:var(--muted);font-size:.8rem}
.g-row .trk{position:relative;min-height:34px}
.g-row .cl{grid-row:1;border-inline-start:1px solid var(--line)}
.g-bar{grid-row:1;z-index:1;margin-inline:2px;border:0;cursor:pointer;border-radius:8px;height:30px;align-self:center;color:#fff;font-weight:600;font-size:.82rem;padding:0 10px;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--accent)}
.g-bar:hover{filter:brightness(1.12)}
.g-bar.w0{background:#b0261e} .g-bar.w1{background:#9a3b2f} .g-bar.w2{background:#8a1538} .g-bar.w3{background:#6d2a52} .g-bar.w4{background:#4b3a6e}
.mile{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:.92rem}
.mile b{font-family:var(--display);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .g-bar{font-size:0;padding:0}
  .g-axis{padding-inline-start:0}
  .g-row{grid-template-columns:minmax(0,1fr);gap:4px}
  .g-row .lb{padding-inline-end:0}
}

.dec{display:grid;gap:12px}
.dq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.dq fieldset{border:0;margin:0;padding:0;min-width:0}
.dq legend{font-weight:600;padding:0;margin-bottom:8px;line-height:1.55}
.dq legend small{display:block;font-weight:400;color:var(--muted)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt label{display:block;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2);min-height:44px;line-height:1.55;font-size:.95rem}
.opt input:checked+label{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.opt .rec{display:inline-block;font-size:.74rem;font-weight:600;color:var(--good);background:var(--good-soft);border-radius:999px;padding:0 8px;margin-inline-start:6px}
.dout{margin-top:6px}
.dout pre{white-space:pre-wrap;font-family:var(--body);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px 18px;margin:0 0 10px;font-size:.93rem;line-height:1.8;overflow-wrap:anywhere}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.row-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-b .st{color:var(--good);font-weight:600;font-size:.9rem}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.dc{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.dc:hover{border-color:var(--accent)}
.dc b{font-family:var(--display);font-weight:600;display:block;margin-bottom:2px}
.dc span{color:var(--muted);font-size:.9rem;line-height:1.6;display:block}
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:6px}
.scale div{border-radius:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;line-height:1.55}
.scale b{font-family:var(--display);display:block;font-variant-numeric:tabular-nums}
.limits{margin:14px 0 0;color:var(--muted);font-size:.9rem;padding-inline-start:20px;max-width:80ch}
.pad-b{padding-bottom:64px}

/* صفحات القراءة */
.wrap{max-width:1240px;margin-inline:auto;padding-block:24px 72px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:32px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);gap:16px}}
.toc{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:.88rem;padding-inline-end:12px}
@media (max-width:900px){.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface)}}
.toc summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none;display:flex;justify-content:space-between;font-family:var(--display)}
.toc summary::-webkit-details-marker{display:none}
@media (min-width:901px){.toc summary{pointer-events:none}.toc summary::after{display:none}}
.toc summary::after{content:"+";color:var(--muted)}
.toc details[open]>summary::after{content:"−"}
.toc ul{list-style:none;margin:0;padding:0}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:8px;line-height:1.5;border-inline-start:3px solid transparent}
.toc a:hover{background:var(--surface-2);color:var(--ink)}
.toc a.on{color:var(--accent);background:var(--accent-soft);border-inline-start-color:var(--accent);font-weight:600}
.toc .l1>a{font-weight:600;color:var(--ink);margin-top:4px}
.toc .l1>a.on{color:var(--accent)}
.toc .sub{display:none;padding-inline-start:10px}
.toc .l1.open>.sub{display:block}
.toc .sub a{font-size:.82rem}
.doc-t{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.doc-t .nm{font-family:var(--display);font-weight:600;color:var(--muted);font-size:.92rem}
.doc-t .row-b .btn{min-height:40px;padding:0 14px;font-size:.88rem}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,44px);font-size:calc(1rem*var(--fz,1))}
article>div>h1:first-child{margin-top:0}
article h1{font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1.4;margin:1.4em 0 .6em;text-wrap:balance}
article h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:1.9em 0 .5em;text-wrap:balance;padding-top:.9em;border-top:1px solid var(--line)}
article h2.sub-title{border-top:0;padding-top:0;margin-top:1em}
article h3{font-family:var(--display);font-weight:600;font-size:1.08rem;margin:1.6em 0 .4em;color:var(--accent)}
article h4{font-size:1rem;margin:1.2em 0 .3em}
article p,article li{max-width:78ch}
article ul,article ol{padding-inline-start:1.4em}
article blockquote{margin:1em 0;padding:.4em 1em;border-inline-start:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
article hr{border:0;border-top:1px solid var(--line);margin:2em 0}
article code{font-family:var(--mono);font-size:.84em;background:var(--code-bg);padding:.1em .35em;border-radius:4px;direction:ltr;unicode-bidi:isolate}
article pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;direction:ltr;text-align:left}
article pre code{background:none;padding:0}
.tw{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:540px}
th,td{padding:9px 13px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line);line-height:1.65}
thead th{background:var(--surface-2);font-weight:700;white-space:nowrap}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
article #doc-body *{scroll-margin-top:150px}
.tg{display:inline-block;font-size:.74rem;font-weight:600;border-radius:999px;padding:0 8px;line-height:1.7;vertical-align:baseline;margin-inline:2px;font-family:var(--body)}
.tg.v{color:var(--good);background:var(--good-soft)} .tg.e{color:var(--warn);background:var(--warn-soft)}
.tg.c{color:var(--accent);background:var(--accent-soft)} .tg.u{color:var(--muted);background:var(--track)}

<script>
const DATA = {"rating": "# التقييم الاحترافي من 100: المنصّة والفلو المؤتمت\n\nالتاريخ: 2026-10-21. أعدّه 0101 بطلب المالك، ومبنيّ على تقريري SWOT وملاحقهما (قراءة ساكنة للشيفرة على origin/main عند 6f7ec060 وللأدوات على الشجرة المحلية، دون تشغيل الاختبارات ودون فحص الإنتاج).\n\n## النتيجة\n\n| الموضوع | الدرجة | الوصف |\n|---|---|---|\n| المنصّة SchoolOS | 61 / 100 | منتج قوي هندسياً يعمل بمعايير مشروع واعد، لكنه دون عتبة الاعتماد المؤسسي في الأمن والتوسّع والتشغيل |\n| الفلو المؤتمت | 48 / 100 | حوكمة مبتكرة وسريعة في الوسيط، لكن الأتمتة نفسها لم تبلغ الصلابة المطلوبة لتُترك بلا إشراف |\n\n## سلّم الدرجات ومعيار الصرامة\n\n- 90 فما فوق: مستوى الأفضل عالمياً، قابل للاعتماد المؤسسي (ISO 27001، DORA Elite في كل المقاييس، WCAG 2.2 AA مُثبَت بفحص حيّ).\n- 75 إلى 89: ناضج، فجواته محدودة ومعروفة وعليها خطط.\n- 60 إلى 74: جيّد لمرحلة نموّ، يعمل لكن بدين تقني وفجوات يجب سدّها قبل التوسّع.\n- 40 إلى 59: واعد لكنه يعتمد على المشغّلين أكثر من اعتماده على الضوابط.\n- دون 40: غير جاهز.\n\nقاعدة الصرامة: لا تُمنح درجة كاملة على عنصر إلا إن كان مضبوطاً بحارس آلي ومُثبَتاً بقياس، لا بالنية ولا بالتوثيق وحده. وما لا يمكن قياسه من الشيفرة يُعامل بحذر، ولا يُعدّ ميزة.\n\n## أولاً: المنصّة، 61 من 100\n\n| المحور | الوزن | الدرجة | الدليل الأهم |\n|---|---|---|---|\n| الأمن والامتثال | 20 | 11 | رصيد: 53 سياسة RLS، 31 حقلاً مشفّراً Fernet، وCodeQL وBandit وpip-audit وdetect-secrets في CI. خصم: رقم الهوية والهاتف نصاً صريحاً بجوار النسخة المشفّرة، واستضافة خارج قطر بلا تقييم أثر موثّق، وعزل المدارس يقف على آلية واحدة، وثغرة بحث المستخدمين بلا مرشّح مدرسة في عدة مواضع. |\n| جودة الشيفرة والاختبار | 15 | 12 | رصيد: 10,213 دالة اختبار بنسبة 1.1 إلى الشيفرة، وعتبة تغطية 70%، وحرّاس AST. خصم: اختبارات SQLite تتخطّى RLS، وفحص axe يفشل حالياً في الطلب 1204، ولم تُشغَّل الاختبارات في هذا التقييم. |\n| المعمارية وقابلية الصيانة | 10 | 6 | خصم: 189 عرضاً من 549 (34%) تخترق حارس الطبقات، وأكبر ملف عروض 2,821 سطراً، وخدمة سلوك نحو 805 أسطر. |\n| الأداء والبيانات والتوسّع | 15 | 8 | رصيد: فهارس جيدة للحضور والدرجات، ونسخ احتياطي يومي مشفّر مع تمرين استعادة أسبوعي. خصم: Celery متزامن افتراضياً، ونحو 35 عملية تصدير ثقيلة متزامنة، وتصميم مدرسة واحدة لكل دور قاعدة بيانات، ولا تقسيم ولا أرشفة، وهجرتان فقط من 419 تستعملان CONCURRENTLY. |\n| تجربة الاستخدام والوصولية | 15 | 10 | رصيد: 252 رمزاً تصميمياً بنسب تباين موثّقة، وRTL شبه مثالي (436 خاصية منطقية مقابل واحدة فيزيائية)، وWCAG 2.2 محروس بالاسم. خصم: فحص axe الحيّ يغطي نحو 6% من 175 صفحة، والجداول بلا caption في 98%، وميزانية CSS عند الحافة (469.7 من 470). |\n| تغطية المجال الوظيفي | 15 | 8 | رصيد: قواعد الوزارة القطرية مرمّزة بعمق، و99 صلاحية، و37 دوراً. خصم: الأولياء مجمّدون بلا مزوّد بريد، ومحرك الحكم مطفأ افتراضياً، ولا ترقية ولا نهاية عام، ولا جزاءات للموظفين، ولا تصدير للوزارة، وتسعة أدوار بصلاحيات عامة فقط. |\n| التسليم والتشغيل | 10 | 6 | رصيد: نحو 23 دمجاً يومياً ووسيط 1.83 ساعة من الطلب إلى الدمج (مستوى Elite). خصم: النشر يدوي منذ 18 سبتمبر، والتراجع لم يُجرَّب، والإنتاج متأخر نحو 14 إيداعاً، وبناء Railway موقوف، وإعداد النشر لا يسرد متغيرات S3 التي يشترطها الإنتاج. |\n| المجموع | 100 | 61 | |\n\n### لماذا ليست الدرجة أعلى\n- أعلى ثلاث فجوات أثراً: الخصوصية (PDPPL)، وعزل المدارس بآلية واحدة، والعمل الثقيل المتزامن.\n- القوة الحقيقية هي الانضباط الهندسي (الاختبارات والحرّاس والسرعة)، وهي نادرة لهذا الحجم، لذلك لم تنزل الدرجة دون 60.\n\n### ما يرفعها (تقدير، لم يُقَس)\n| الإجراء | الارتفاع المتوقع |\n|---|---|\n| تشفير رقم الهوية والهاتف وإنهاء النص الصريح، وقرار الاستضافة وتقييم الأثر | 4 |\n| worker مستقل وإيقاف التنفيذ المتزامن الافتراضي | 3 |\n| تقسيم CSS الوحدات بدل رفع السقف، وتوسيع axe الحيّ | 3 |\n| مدير ORM مقيّد بالمدرسة كشبكة ثانية واختبار RLS على Postgres | 2 |\n| تجربة تراجع موثّقة ونشر آلي | 2 |\n| إغلاق فجوات المجال الأولى (الأولياء، محرك الحكم، الترقية) | 3 |\nبعد هذه الستة يُتوقع نحو 78، أي مستوى «ناضج».\n\n## ثانياً: الفلو المؤتمت، 48 من 100\n\n| المحور | الوزن | الدرجة | الدليل الأهم |\n|---|---|---|---|\n| سلامة البوابات والاعتماد | 20 | 11 | رصيد: الاعتماد مربوط بالرأس في الشيفرة، وال دات دون العتبة |\n| 3.7 | اختبار حمل لعشر مدارس وعشرة آلاف طالب | 3 أيام | تقرير أزمنة وعنق زجاجة |\n| 3.8 | رصد سجلّ الدفتر والمراقبة: تدوير السجلات وإنذار حقيقي واحد بدل الدائم | 3 أيام | اللقطة تتحول من أحمر شامل إلى حالة قابلة للقراءة |\n\n## الموجة 4: الاعتماد المؤسسي (الربع التالي)\n\n- تعدد المدارس بنشر واحد: تصميم تهيئة مدرسة جديدة، ودور قاعدة بيانات لكل مستأجر أو بديله.\n- تصدير للوزارة وتكامل نور، والمكتبة والنقل والإرشاد والتعليم الخاص.\n- جزاءات الموظفين وستة نماذج موظفين غائبة.\n- تقسيم وأرشفة جداول الحضور وسجل التدقيق.\n- تقييم فجوات ISO/IEC 27001 تمهيداً لاعتماد.\n\n## الاعتماديات (ما يسبق ما)\n\n- 1.4 (قرار الاستضافة) يسبق 1.5 و2.2.\n- 1.6 يسبق 2.2، و2.2 يسبق أي حذف للنص الصريح.\n- 2.1 يسبق 3.2 و3.7.\n- 2.4 يسبق أي نشر آلي تلقائي من main.\n- 0.2 و0.3 و0.4 تسبق إعادة تشغيل المضخّة كاملة.\n- 1.7 يسبق تفعيل إشعارات الأولياء في 3.4.\n\n## المخاطر والتحكّم\n\n| الخطر | التحكّم |\n|---|---|\n| ترحيل الهوية يفسد بيانات | كتابة مزدوجة، وملء رجعي على نسخة أولاً، ونافذة صيانة، ونسخة احتياطية مُجرَّبة |\n| فصل worker يكشف أخطاء كانت مبتلَعة | إطلاق تدريجي بطابور واحد ومراقبة Sentry |\n| استنزاف الحصة | Sonnet للتنفيذ، ووكيل واحد لكل موجة، وسقف أسبوعي مسجّل |\n| تضارب عدة جلسات على ملفات واحدة | كاتب واحد لكل مجموعة ملفات، وفروع منفصلة |\n| تجميد الأولياء يخفي إخفاقات الإشعار | اختبار شهري لقناة بريد تجريبية بعد 1.7 |\n\n## مواءمة الخطة مع توصيات Anthropic لتنظيم الجلسات المتوازية\n\nوصلت التوصيات من فريق الدعم (إيبن) بعد مشكلة التكرار واستنزاف الحصة. هذا ما تغيّر في الخطة بسببها.\n\n| التوصية | وضعنا الحالي | ما أُضيف أو عُدّل |\n|---|---|---|\n| 1. مصدر حقيقة واحد خارج الجلسات | موجود جزئياً: الدفتر وdecisions.md وowner_confirmations.md. لكن الدفتر بلا قفل ولا نسخة احتياطية، وشجرة الميسترو المحلية متباعدة عن origin، ومذكرات موزعة بين مجلدين | البنود 0.4 و0.6 تصير شرطاً مسبقاً لكل شيء. وجديد 0.7: مجلد مذكرات واحد معتمد، وقاعدة مكتوبة أن الجلسة تقرأ الدفتر وapproval_check قبل أي فعل حاسم |\n| 2. نقطة قرار واحدة لكل نوع فعل | معظمه قائم: الاعتماد عند 0101، ودمج الهجرات عند 0601، لكن الدفع جرى من جلسة والمضخّة معاً (حالة 019 حين اختلف ما أُبلغ عنه عمّا على الخادم) | عُدّل 2.6: توزيع أنواع القرار لا تكرار القرار الواحد. وجديد 0.8: الدفع من المضخّة وحدها، ومنع الدفع اليدوي للبطاقات المعتمدة |\n| 3. تسلسل الخطوات المتعلقة | آلة الحالات في الدفتر تفرض التسلسل، لكن الرسائل بين الجلسات ضاعت أحياناً (سقف 10 رسائل، وجلسة «انتهت قبل القراءة») | جديد 0.9: الاستغناء عن الرسالة كناقل للقرار، ويُكتب القرار ملاحظةً في الدفتر والرسالة مجرد تنبيه. الإيقاظ يتتبع الحالة لا الحدث، وهذا قائم في المهمة المعلّقة |\n| 4. إعادة التأكيد الأمني خطوة مخططة | وكلاء أُوقفوا بحماية Fable وأعيد إطلاقهم، فتكرر الاستهلاك | قاعدة جديدة: إعادة محاولة واحدة فقط على نموذج أدنى، وبلا إعادة متوازية، وتُسجَّل في الدفتر |\n| 5. ملفات مشتركة في Project واحد | المذكرات داخل المستودع وخارجه | يندمج مع 0.7: مكان واحد، وكل جلسة تحيل إليه ولا تعيد بناء السياق |\n\nملاحظة: البنود 0.7 و0.8 و0.9 تضاف إلى الموجة 0 (نحو يومين إضافيين)، ولا تغيّر الأهداف الرقمية.\n\n## تحديث بعد ردّ المالك: الألم الفعلي يغيّر الأولويات\n\nما قاله المالك: الألم هو نفاد التوكنز، والأخطاء، وكثرة الرسائل مع سقف عشر رسائل لكل جلسة، وعدد الجلسات الذي يخنق الذاكرة مع Docker وWSL، وكثرة الأسئلة الموجهة إليه. وطلب أتمتة اعتماد الرأس والدفع والدمج والنشر وغيرها.\n\n### ما قِيس اليوم (قراءة فقط)\n\n| البند | القيمة |\n|---|---|\n| ذاكرة الجهاز | 32 غيغابايت (شريحتان 16+16؛ المرئي لويندوز 31.7). تصحيح 2026-10-22: القياس الأول «15.7» كان خطأً |\n| عمليات claude | 14 عملية تستهلك نحو 2.2 غيغابايت |\n| WSL | يستهلك نحو 2 غيغابايت الآن، وسقفه الفعلي في .wslconfig هو 12 غيغابايت (37% من الجهاز) مع processors=20 وautoMemoryReclaim=gradual |\n| جلسات غير مؤرشفة | 20، كلها متوقفة الآن، ومعظمها طلباتها مدموجة |\n| جلسات «Wake send 10min» | 4 جلسات متراكمة، كل واحدة وُلدت من مهمة الإيقاظ المجدولة |\n\nاستنتاج: الضغط يظهر حين تعمل جلسات كثيرة معاً مع Docker وWSL، لا حين تكون متوقفة. وسقف WSL المرتفع يترك لويندوز والجلسات أقل مما يلزم.\n\n### الإصلاحات المضافة إلى الموجة 0\n\n| # | الإجراء | الأثر | ملاحظة |\n|---|---|---|---|\n| 0.10 | أرشفة (لا حذف) الجلسات التي دُمجت طلباتها ولا بطاقة مفتوحة لها، وأرشفة جلسات الإيقاظ الأربع | ذاكرة وحصة | الأرشفة تراجعية، والحذف يبقى بيدك |\n| 0.11 | دمج الأدوار المتشابهة: الجودة 0701 و0702 و0703 في جلسة، والمعاينة 0501 و0502 في جلسة | جلسات أقل | يحتاج تحديث الميثاق |\n| 0.12 | (معدَّل بقرار المالك 2026-10-22) إبقاء سقف WSL عند 12 غيغابايت من 32، وتشغيل Docker عند الطلب فقط؛ الخفض إلى 10 خطوة لاحقة إن ضاقت الذاكرة مع عشر جلسات أو أكثر | ذاكرة | لا تعديل على جهازك الآن |\n| 0.13 | سقف تزامن: لا أكثر من 6 جلسات تعمل معاً | ذاكرة وحصة | تفرضه المضخّة بطابور |\n| 0.14 | إلغاء مهمة الإيقاظ التي تولّد جلسة جديدة كل مرة، والاستعاضة بالمضخّة | حصة | المهمة معطّلة الآن |\n\n### سقف الرسائل العشر\n\n- السقف من النظام لا من أدواتنا، ويعود إلى الصفر عند كتابتك أنت.\n- الحل الدائم: عدم استعمال الرسائل ناقلاً للقرار. القرار ملاحظة في الدفتر (0.9)، والمضخّة توقظ الجلسة حسب الحالة لا حسب رسالة.\n- النتيجة المتوقعة: الرسائل بين الجلسات تقتصر على التنبيه النادر، فلا تبلغ السقف.\n\n### سياسة التفويض الآلي المقترحة (مسودة تحتاج قرارك)\n\n| المستوى | ما يشمله | من يقرر | المراقبة |\n|---|---|---|---|\n| أ: آلي كامل | دفع الرأس المعتمد، ودمج الطلب حين يكون CI أخضر والاعتماد مسجَّلاً، ونقل الحالات، والمزامنة، والرؤوس التي هي دمج main نظيف أو اختبارات فقط (D-451م قائم) | المضخّة والحرّاس | ملخص يومي واحد لك |\n| ب: اعتماد آلي بقاعدة | اعتماد رأس لتغيير غير أمني وغير هجرة وغير ملف حاكم، بشرط: CI أخضر، وحجم الفرق تحت حدّ يُحدَّد، وفحص approval_check ناجح، ومراجِع مستقل على نموذج أرخص لا يجد عائقاً | قاعدة مكتوبة | ملخص يومي، ونافذة اعتراض لك قبل الدمج للفئات الأعلى أثراً |\n| ج: المالك فقط | الحذف، والمال، والصلاحيات، والملفات الحاكمة وبوابات الفلو، والرؤوس الموسومة أمنياً، وتغييرات الخصوصية وPDPPL، وأي هجرة على بيانات حساسة | أنت | سؤال واحد مجمّع لا أسئلة متفرقة |\n| نشر | النشر الآلي بعد الدمج حين تنجح فحوص /health/، مع تراجع آلي | المضخّة | لا يُفعَّل قبل نجاح تجربة التراجع (2.4) |\n\nشرطان للتفعيل:\n1. إصلاح فحص الاعتماد الذي يعدّ نص الرفض موافقة (0.2)، وإلا تمرّر الأتمتة رفضاً على أنه قبول.\n2. تغيير D-443م وD-451م بقرار مكتوب منك، لأنهما يحصران اعتماد الرؤوس بك أو بتكليفك.\n\n### أثر ذلك على الدرجات المتوقعة\n\nالفلو: عبء المالك والحوكمة (7 من 15) وسلامة البوابات (11 من 20) هما الأكثر استفادة، بشرط ألا يضعف الإنفاذ. تقدير الأثر الإضافي +3 إلى 4 على الفلو، ويُقاس بعد الموجة 2.\n\n## ما أحتاجه منك الآن\n\nأربعة قرارات تحدّد ترتيب الموجات، وأسئلتها في الرسالة التالية.\n\n## حالة الموجة 0 (محدَّثة 2026-10-22 ~12:45 UTC، من git log على origin/main 3c643c3)\n\n| البند | الحالة | الدليل |\n|---|---|---|\n| 0.2 اتجاه القول في approval_check | تم | #93 و#97 و#98 |\n| 0.3 مفتاح الإيقاف داخل المضخّة | تم | #94 (ثم #116 لمفتاح منع الدمج وحده) |\n| 0.4 قفل وfsync ونسخة يومية للدفتر | تم | #95، وفحص السلامة #109 |\n| 0.5 msg_counter وUTF-8 | تم | #96 |\n| 0.6 مزامنة الشجرة | تم | #99 |\n| 0.7 و0.9 مرجع المذكرات وقراءة الدفتر والقرار ملاحظة | تم | #105 (D-461م) |\n| 0.1 مطابقة متغيرات S3 | لم يُتحقق من إغلاقه | مذكرة wave0_s3_vars_2026-10-21.md موجودة؛ يؤكده 0201 |\n| 0.8 و0.13 و0.14 | مؤجَّل مع المضخّة | D-461م |\n| 0.10 و0.11 | معلّق | |\n| 0.12 | محسوم: إبقاء 12 غيغابايت من 32 | قرار المالك 2026-10-22 |\n| حادثة Railway (طارئ خارج الخطة) | جارية | تتولاها 0101-ب |\n\nالخطوة التالية: إغلاق الموجة 0 بالبروتوكول (wave_close_protocol_2026-10-21.md) حين تنتهي الحادثة وتُحسم 0.1 و0.10 و0.11، ثم الموجة 1: 1.2 (تقسيم CSS ثم دمج 1204، عند 0421) و1.3 (1218) و1.5 (DPIA، عند 0301). 1204 متوقف خلف النشر وفشل axe.\n\n## ملاحظات اختناق الذاكرة (للمالك لقرارها، قياس 2026-10-22 ~13:00 UTC، قراءة فقط)\n\n### ما قِيس الآن\n| البند | القيمة |\n|---|---|\n| ذاكرة الجهاز | 31.7 غيغابايت مرئية، الحرّ منها 12.3 |\n| عمليات claude | 17 عملية، نحو 3.5 غيغابايت (كلها جلسات سطح المكتب) |\n| PyCharm | 2.3 غيغابايت (عملية واحدة) |\n| Memory Compression (ضغط ويندوز) | 2.1 غيغابايت |\n| vmmemWSL | 1.4 غيغابايت فعلية من سقف 12 |\n| Edge | 0.9 غيغابايت (14 عملية) |\n| node | 0.75 غيغابايت (12 عملية) |\n| Docker Desktop والخلفية | نحو 0.5 غيغابايت، ولا حاويات تعمل (0) |\n| داخل WSL | مستعمل 1.9 من 12 غيغابايت (مخزَّن مؤقتاً 0.8) |\n| ملف الصفحات | 37.5 غيغابايت مخصَّص، المستعمل 189 ميغابايت فقط |\n| توزيعات WSL | docker-desktop يعمل؛ PCMClawUbuntu متوقف |\n\n### الملاحظات\n1. لا اختناق حالياً: الحرّ 12.3 من 31.7 غيغابايت (39%)، وملف الصفحات شبه فارغ. الجهاز يختنق فقط عند ذروة التزامن، ولم أقس ذروة اليوم.\n2. الرقم الذي بُنيت عليه الخطة (15.7 وسقف 8) كان خطأً، فاستنتاج «الضغط من حجم الذاكرة» غير مسنود. السقف الفعلي لـWSL هو 12 لا 8.\n3. سقف WSL 12 غيغابايت مبالغ فيه نسبياً: الاستهلاك الفعلي 1.4 (والمخصَّص داخلياً 1.9)، لكنه سقف لا حجز، و`autoMemoryReclaim=gradual` يعيد الفائض. الخطر الحقيقي هو عند تشغيل بناء Docker أو اختبارات ثقيلة (اثنتان معاً قد تبلغ 12).\n4. Docker Desktop يعمل بلا حاويات، ويكلّف نحو 0.5 غيغابايت زائداً بلا فائدة الآن. تشغيله عند الطلب يوفّر هذا فقط (قليل).\n5. أكبر مستهلك منفرد هو claude نفسه (3.5 غيغابايت لـ17 عملية، أي نحو 200 ميغابايت للواحدة)، فكل جلسة إضافية تضيف هذا القدر تقريباً. عشرون جلسة تعمل معاً تعني نحو 4 غيغابايت، وهذا لا يخنق جهازاً بـ32.\n6. PyCharm 2.3 غيغابايت ثابتة؛ ويمكن خفضها بسقف heap إن لزم (غير لازم الآن).\n7. Memory Compression 2.1 غيغابايت علامة ضغط سابق، لكنها طبيعية على ويندوز 11 ولا تدل وحدها على نقص.\n8. ما قد يخنق فعلاً: بقاء جلسات كثيرة غير مؤرشفة (20 كانت متوقفة)، وتراكم node (12 عملية) من خوادم المعاينة، وحاويات المعاينة 8500 وغيرها حين تُشغَّل معاً. هذه تُعالَج بالأرشفة (0.10) وبسقف التزامن (0.13، مؤجَّل مع المضخّة).\n9. عبء الجلسات على الحصة (التوكنز) لا الذاكرة هو الألم الأكبر كما قلتَ؛ فالأرشفة والدمج (0.10 و0.11) أنفع من أي تعديل للذاكرة.\n\n### القرارات المطلوبة منك\n| # | القرار | توصيتي |\n|---|---|---|\n| م1 | سقف WSL | إبقاء 12، أو خفضه إلى 10 إن رأيتَ ضغطاً عند الذروة |\n| م2 | Docker Desktop | تشغيل عند الطلب (يوفّر نحو 0.5 غيغابايت) |\n| م3 | أرشفة الجلسات المنتهية (0.10) | نعم، تراجعية؛ هي الأنفع للحصة والذاكرة معاً |\n| م4 | دمج الأدوار المتشابهة (0.11) | نعم، بعد تحديث الميثاق |\n| م5 | سقف تزامن 6 جلسات (0.13) | يبقى مؤجَّلاً؛ مع 32 غيغابايت لا حاجة ملحّة |\n| م6 | قياس ذروة التزامن فعلاً | أقترح قياساً مرة عند ذروة اليوم قبل أي قرار خفض |\n\n## تصحيح ملاحظات الذاكرة بعد بيانات MonitorWidget (2026-10-22 ~16:00 قطر؛ قراءة فقط من نسخة لقاعدة monitor.db)\n\nالمصدر: `C:\\Users\\mesue\\Documents\\Scripts\\MonitorWidget\\monitor.db`، عيّنات كل نحو دقيقة (live وguard وcollector) من 3 أكتوبر، وتفصيل العمليات منذ 16 أكتوبر. نسختُ القاعدة إلى مجلد مؤقت وقرأتها هناك، فلم يُمسّ الأصل.\n\n### ما تصحّح مما كتبته قبل ساعة\nقلتُ إنه لا اختناق. هذا صحيح لـ«اليوم» فقط، وخاطئ للتاريخ:\n\n| البند | القيمة |\n|---|---|\n| ذاكرة الجهاز عبر الزمن | 15.7 غيغابايت حتى 20 أكتوبر، ثم صارت 32 (31.7 مرئية) بين 21 و22 أكتوبر |\n| أدنى متاح مسجَّل | 0.05 غيغابايت (20 أكتوبر 19:42، 36 عملية claude) |\n| عيّنات المتاح فيها دون 2 غيغابايت قبل الترقية | 7.6% من العيّنات الحيّة |\n| عيّنات المتاح فيها دون 3 غيغابايت | 5035 عيّنة إجمالاً |\n| أعلى التزام (commit) | 96–99% في سبعة أيام من أصل أحد عشر |\n| متوسط المتاح يومياً (16–20 أكتوبر) | 3.4 إلى 6.4 غيغابايت |\n| اليوم بعد الترقية | أدنى متاح 8.2، ومتوسطه 14.9، وأعلى استعمال 74% |\n| تقليم الذاكرة الآلي (trims) | 568 مرة، متوسط المحرَّر 3.1 غيغابايت، أعلاه 6.8 |\n\n### من يأكل الذاكرة (من جدول العمليات)\n| العملية | المتوسط (خاص) | الذروة |\n|---|---|---|\n| claude.exe | 9.2 غيغابايت، بمتوسط 25.6 عملية | 16.3 غيغابايت و41 عملية |\n| docker-scout.exe | 2.8 غيغابايت (17 أكتوبر فقط) | |\n| pycharm64 | 2.3 | 4.6 |\n| node.exe | 1.8، بمتوسط 17.8 عملية | 5.1 |\n| msedge | 1.2 | 8.1 |\n| pwsh | 0.8، بمتوسط 11.8 عملية | 1.9 |\nعند أسوأ لحظة (20 أكتوبر 19:42): claude 36 عملية = 11.7 غيغابايت، وnode 32 عملية = 3.3، وpwsh 17 = 0.9.\n\n### الاستنتاجات\n1. الاختناق كان حقيقياً قبل الترقية، وسببه الأول جلسات claude (نحو 60% من المستعمل عند الذروة) لا WSL. فمقياس تكلفة الجلسة: نحو 0.2 إلى 0.4 غيغابايت للعملية، وأساس الجهاز بلا جلسات نحو 6 غيغابايت (انحدار على 5875 عيّنة، تقريبي).\n2. عند الاختناق كان متوسط عمليات claude 31 (الأدنى 11). على 32 غيغابايت يتسع الجهاز نظرياً لنحو 50 إلى 60 عملية قبل الضيق، أي ضعف أعلى ذروة سُجّلت (41).\n3. أي رفع لعدد الجلسات مقبول حتى نحو 50 عملية claude معاً، بشرط ألا يجتمع معه بناءان ثقيلان في Docker ولا docker-scout (2.8 غيغابايت).\n4. سقف WSL 12 يبقى مناسباً؛ WSL ليس سبب الاختناق في أي بيان.\n5. تقليم الذاكرة الآلي كان يخفي جزءاً من المشكلة (3 غيغابايت في المرة)، وهو يعمل الآن بإعداد `trim.auto = true`.\n6. ملاحظة تشغيلية من المراقب نفسه: تنبيه BURST للأغلفة (shells=57، conhost=70) تكرر 72 مرة، أي أن عدد pwsh وconhost يتراكم ويستحق المعالجة عند منبعه.\n\n### قرارات المالك اليوم (يلغي ما سبق في م1 إلى م6)\n- م1: سقف WSL يبقى 12.\n- م2: Docker Desktop عند الطلب.\n- م3 وم4: لا أرشفة ولا دمج الآن؛ تبقى الأدوار كما هي، ويجوز زيادة عدد الجلسات، بشرط مراجعة ميثاق كل جلسة وتوزيع الأعمال عليها توزيعاً صحيحاً ومتساوياً كما حدث في 0101-أ وب وج ود (التفاصيل في بند جديد 0.15).\n- م5 وم6: تُتخذ قرارات التزامن من بيانات MonitorWidget (كل 10 ثوانٍ تقريباً)، لا من قياس يدوي.\n\n### بند جديد\n| # | الإجراء | الجهد | المسؤول | معيار الإنجاز |\n|---|---|---|---|---|\n| 0.15 | مراجعة ميثاق كل جلسة وتوزيع الأعمال بينها بتوازن (على نمط تفكيك 0101 إلى أ وب وج ود)، ثم زيادة عدد الجلسات في حدود 50 عملية claude | يومان | 0101 | جدول حمل لكل جلسة قبل/بعد، وميثاق محدَّث لكل جلسة، وقياس MonitorWidget بعد أسبوع |\n\n## تعديل الخطة بعد حادثة Railway وقرارات المالك (2026-10-22 ~16:10 قطر)\n\nحُذف مفتاح ledger/flow_pump.nomerge بأمر المالك، فاستؤنف الدمج الآلي للمضخّة. الإنتاج 2b67c2d سليم، و«Wait for CI» أُعيد تفعيله (بقول المالك، لم يُتحقق من اللوحة).\n\nقرارات المالك:\n1. الموجة 1 تبدأ بفكّ النشر: فصل الكنار عن بوابة النشر وإصلاح Nightly (فاشل منذ 18 أكتوبر)، ثم تقسيم CSS ودمج #1204 (0421). المسار الخصوصي يمضي بالتوازي عند 0301.\n2. 1.6 (تشفير الرقم الشخصي والهاتف): يبدأ التصميم الآن (ADR وهجرة تجريبية على نسخة). التنفيذ على الإنتاج بإذن المالك لأنه هجرة على بيانات حساسة.\n3. Celery المتزامن وعمل الطلبات الثقيل: يبقى في الموجة 2.\n4. 2.4 (تجربة التراجع الموثَّقة وحالة «Wait for CI» العالقة) تُقدَّم من الموجة 2 إلى الموجة 1.\n5. عدد الجلسات: يزاد بعد البند 0.15 وفي حدود 50 عملية claude.\n\nبنود الموجة 1 بعد التعديل: 1.0 (جديد: فصل الكنار + إصلاح Nightly) ثم 1.2 و1.3 و1.5 و1.6 و2.4 (مقدَّم)، والمالك: 1.4 (الاستضافة قرارها صدر: إبقاء مع تقييم أثر) و1.7 (مزوّد بريد الأولياء، لم يُحسم).\n\n### تحقق «Wait for CI» (2026-10-22 ~16:50 قطر)\nلقطة من المالك لإعداد خدمة shschool_mvp: مفتاح «Wait for CI» مفعّل (ON). نصّ الإعداد في Railway: يُطلق النشر بعد اكتمال كل إجراءات GitHub بنجاح، أي كل الفحوص لا الفحصَين المطلوبَين فقط، وهذا يؤكد الحلقة التي عطّلت النشر. قرار المالك اليوم: فصل الفحوص المجدولة عن البوابة (مسجّل في owner_confirmations.md)، وتتولاه 0101-د.\n\n## تحديث الخطة (2026-10-22 ~17:50 قطر، من الدفتر وGitHub)\n\n### ما أُنجز منذ آخر تحديث\n| البند | الحالة | الدليل |\n|---|---|---|\n| المضخّة: حارس الحصة والتحقق والدمج بطلب واحد | تم | maestro-v2 #121 (007) و#122 (009) و#123 (008) و#128 (019: دفع بطلبين فقط) و#129 (020: لا --auto إن كان على main طلب آخر) |\n| تقليل التوكنز (أوامر المالك) | تم | #124 فهرس القرارات (73% أصغر)، #126 إيقاظ wake_monitor بالتغيير، #127 كنس المذكرات (نقل بلا حذف)، #125 صيغة الرسائل ومرادفات (وثائق)؛ جدول النماذج معتمد ويسري على الجلسات الجديدة |\n| 1.2 جزء 1204 | تم | هبط #1226 (524abe99) وظهر على الإنتاج 14:35 UTC، /health/ سليم |\n| 0.15 نواة المواثيق | تم (D-476م) | البطاقات الخمس عشرة ≤4,037 بايتاً |\n| تحقيق بطء النشر | تم | الزمن الكلي ≈24 دقيقة: انتظار CI 12.8 + بناء وتبديل 11؛ الجذر: حساب GitHub مجاني (20 وظيفة متزامنة) وكل طلب 17 وظيفة؛ التطبيقات الخارجية الخمس لا تحجب |\n\n### قيد التنفيذ (طابور 0601، طلب واحد لكل نشر مع /health/ بعد كل منها)\n1. #1223 (في الطابور الآن).\n2. #1236 (018: تخفيف التفريخ؛ أحرجه الدمج لأنه يسرّع كل ما بعده، ملفات CI معتمدة من المالك بالرأس 2dbd376f).\n3. #1233 (011: مجمِّع تعطّل الدمج؛ يلزم تعطيل auto عنه قبل دوره).\n4. #1230 (هجرة 0083) و#1232 (ADR-0010): وسم مراجعة أمنية عند 0601.\n5. #1231 (006: فصل الفحوص المجدولة عن بوابة النشر، البند 1.0): فحوصه أُعيدت بعد مهلة axe.\n6. #1234 (038، هجرتا clinic.0013/0014) و#1235 (013، تقسيم CSS quality، البند 1.2): ألغيتُ تشغيلات ف 0108 | اعتمده المالك بالرأس 7816c13 (فصل من 0301)؛ لا PR له بعد | owner_confirmations |\n| أسماء الجلسات الفرعية | «0101-أ · السجل» و«-ب · الحادثة» و«-ج · التنظيف» و«-د · الصحة»؛ و«0108 · التقييم والعصف» | واجهة الجلسات |\n\n### قيد التنفيذ\n1. #1230 (خارطة 0083، بيانات فقط، مراجعة أمنية 0601 تمت: لا إقرار إضافي): ينتظر اكتمال فحوصه ثم الطابور.\n2. #1234 (038 إحالات العيادة): أحمر حقيقي لقطتان بصريتان (nurse--clinic_dashboard)؛ يلزم وسم «تغيير-بصريّ» وتسمية الصفحتين (0601)، وتغطية pytest؛ صاحبه 0421.\n3. 042 عند 0409 محلية بانتظار دمج 038 ثم ترحيل هجرتها بعد clinic.0014.\n\n### التالي، بالترتيب\n1. دمج #1230 ونشره، ثم #1234 بعد وسمه.\n2. توجيه W-20261022-021 وW-20261022-022 (بعد خلوّ الطابور، حتى لا يزداد حمل CI).\n3. 1.3: بقي #1218 أُنجز؛ تُغلق الهجرات بمراجعة 0601 لـ#1234.\n4. 1.6: تجربة هجرة التشفير على نسخة مستعادة (ADR-0010 مدموج)؛ إذن التنفيذ على الإنتاج منفصل من المالك.\n5. 2.4: تجربة التراجع على جزأين: التطبيق بإعادة نشر commit سابق بلا فرق هجرات بعد 19:00، والقاعدة بـpg_restore محلياً؛ لم يُقَس وجود نسخ احتياطية صالحة.\n6. إغلاق الموجة 0 بالبروتوكول بعد حسم 0.1 (مطابقة S3 عند 0201).\n7. عرض فرق أسماء الجلسات (session_names.json وtabs.json، ملف حاكم) وحسم تكرار 0401/0409.\n\n### ينتظر المالك\n1.7 مزوّد بريد الأولياء؛ 1.5 أسئلة DPO والقانوني (موعد إخطار Railway الأحد 10-25 02:58)؛ لقطة لوحة Railway (الخطة والكلفة ومدة Pre-Deploy) عند الحاجة لقرار staging.\n", "platform": "# تقرير SWOT شامل للمنصّة (SchoolOS) من الشيفرة الحالية\n\nالتاريخ: 2026-10-21 — أعدّه 0101 بأمر المالك المباشر، ويضمّ تقارير 0201 و0301 وثلاثة محلّلين.\nالأساس: origin/main عند الرأس 6f7ec060 (#1221، 2026-10-21 12:51 UTC)، قراءة فقط، بلا تعديل ولا إيداع (التجميد قائم).\nالمعايير المرجعية: ISO/IEC 25010 (جودة المنتج)، ISO/IEC 27001 Annex A وNIST CSF (الأمن)، ISO/IEC 29119 (الاختبار)، OWASP Top 10 وCWE Top 25، WCAG 2.2 AA وNielsen وAPCA (تجربة الاستخدام)، DORA وSRE (التسليم)، قانون PDPPL القطري رقم 13 لسنة 2016.\n\n## ما لم يكتمل (بصدق)\n- محور الأداء وقواعد البيانات: لم يكتمل (أُوقف عند نفاد الحصّة). تغطيه جزئياً بنود الأداء في تقريري المعمارية و0201.\n- محور تغطية المجال الوظيفي: النسخة الثانية على الرأس الحالي حلّت محل الأولى في الملحق هـ (28 تطبيقاً، 37 دوراً، 99 صلاحية). أبرز فجواتها: تجميد الأولياء مع غياب مزوّد بريد، ومحرك الحكم مطفأ افتراضياً، وطلبات الأولياء #1218 غير مدمجة، ولا ترقية ولا نهاية عام، وجزاءات الموظفين غائبة. لم تُقدَّر نسبة امتثال جديدة.\n- محور الأداء والبيانات (الملحق و): أخطر ما فيه أن رقم الهوية والهاتف ما زالا نصاً صريحاً بجوار النسخة المشفّرة، وأن التصميم عملياً مدرسة واحدة لكل دور قاعدة بيانات فلا يتسع لمئة مدرسة في نشر واحد، وأن Celery متزامن افتراضياً، وأن إعداد النشر لا يسرد متغيرات التخزين S3 التي يشترطها الإنتاج. الأرقام المقتبسة من تعليقات الشيفرة موسومة [تعليق] والتقديرات موسومة [تقدير].\n- أرقام الاختبار والتغطية والأداء مأخوذة من قراءة الشيفرة وملفّات CI لا من تشغيل المنصّة، ولم تُفحص قاعدة الإنتاج.\n\n## الأرقام الهيكلية (مقيسة على origin/main)\n| البند | القيمة |\n|---|---|\n| ملفّات بايثون | 2,207 (منها 814 ملفّ اختبار و419 هجرة) |\n| أسطر الشيفرة | نحو 405 آلاف إجمالاً، منها نحو 184 ألفاً اختبارات، وشيفرة المنتج نحو 170 ألفاً |\n| دوال الاختبار | 10,213 في 861 ملفّاً (نسبة 1.1 إلى الشيفرة) |\n| التطبيقات والنماذج | 20 تطبيقاً بنماذج، 156 نموذجاً، 1,872 حقلاً |\n| القوالب | 350 |\n| سير عمل CI | 18 |\n| الإيداعات | 1,677 في 7 أشهر (431 في أكتوبر وحده)، 703 دمجاً في آخر 30 يوماً، مؤلّفان |\n\n## الخلاصة التنفيذية\nالمنصّة هندسياً أقوى بكثير من عمرها: اختبارات بنسبة تفوق الشيفرة، وحرّاس آلية على الطبقات والهجرات والأسرار والوصولية والتباين، وعزل مدارس بسياسات RLS، وتشفير حقول حسّاسة، وتسليم بإيقاع Elite بمقاييس DORA. وضعفها الأكبر في أربع طبقات: عمل ثقيل متزامن داخل الطلبات، وهوامش ضيّقة جداً في ميزانيّات الأداء، واعتماد العزل على آلية واحدة، وفجوات خصوصية موثَّقة أمام قانون PDPPL.\n\n## المخاطر العابرة للمحاور (ما أجمعت عليه التقارير)\n1. **عمل ثقيل متزامن داخل الطلب.** مهامّ Celery تعمل متزامنة افتراضياً في الإنتاج مع ابتلاع الأخطاء، وتوليد الحصص يجري داخل أوّل طلب، وحلّال الجدول داخل الطلب، ونحو 35 عملاً ثقيلاً متزامناً (0201 والمعمارية). يهدّد الاستجابة عند أيّ نموّ.\n2. **ميزانية CSS عند الحافة.** 469.7 كيلوبايت مقابل سقف 470، بهامش 287 بايتاً بعد ست رفعات في خمسة أسابيع (تجربة الاستخدام و0201). هذا سبب فشل فحص axe في #1204 حالياً، والحلّ الدائم تقسيم CSS الوحدات لا رفع السقف.\n3. **عزل المستأجرين يقف على آلية واحدة.** سياسات RLS في Postgres (53 سياسة)، بينما مديرو ORM المقيِّدون بالمدرسة نادرون واختبارات SQLite تتخطّى RLS (المعمارية). أيّ خلل في سياسة يصير تسرّباً بين المدارس بلا شبكة أمان ثانية.\n4. **النشر نقطة فشل واحدة.** النشر يدوي خارج Actions منذ 18 سبتمبر، والتراجع لم يُجرَّب قطّ، والإنتاج متأخّر عن main نحو 14 إيداعاً، وبناء Railway موقوف الآن (0201 وقياس الفلو).\n5. **فجوات خصوصية أمام PDPPL.** تحقّقتُ بنفسي من اثنتين على main: الرقم الشخصي محفوظ نصّاً صريحاً في عمود المستخدم (مع نسخة مشفّرة وHMAC حسب تعليق الشيفرة)، وإشعار الخصوصية نفسه يقرّ بالاستضافة خارج قطر ويترك بنود النقل والاحتفاظ معلَّقة بقرارات لم تصدر، ولم أجد وثيقة تقييم أثر (DPIA). بلاغ 0301 عن إرسال تفاصيل مخالفات الأطفال بالرسائل النصّية لم أتحقّق منه: وجدتُ في كتالوج السلوك قناة SMS لإشعار الوليّ فقط، ولا دليل على محتوى الرسالة.\n6. **الطبقات.** 189 عرضاً من 549 (34%) تخترق حارس الطبقات، وأكبر ملفّ عروض 2,821 سطراً، وخدمات ضخمة (BehaviorService نحو 805 أسطر).\n7. **الوصولية.** بنية قوية (WCAG 2.2 محروس بالاسم، skip link، أهداف لمس سليمة)، لكنّ فحص axe الحيّ يغطّي نحو 6% من 175 صفحة، والجداول بلا caption في 98%، ولا دعم لتفضيل النظام الداكن ولا التباين العالي.\n8. **التوسّع.** عند 10 مدارس و10 آلاف طالب: نحو 12.6 مليون صفّ حضور سنوياً بفهارس تُبنى بقفل، ولوحة مدير بـ188 استعلاماً، وملفّات في BinaryField، وعام دراسي عالمي لا لكلّ مدرسة.\n\n## أهمّ نقاط القوّة\n- 10,213 اختباراً، وعتبة تغطية 70% مُنفَّذة، وحرّاس AST وسقّاطات على الطبقات والمصدّرين والإطار المطبوع والتباين.\n- نظام تصميم ناضج: 252 رمزاً موثّقاً بنسب التباين، ووضع ليلي بحارس تكافؤ، وRTL شبه مثالي (436 خاصية منطقية مقابل واحدة فيزيائية في CSS الشاشة).\n- أمن مبني داخلياً: 31 حقلاً مشفّراً Fernet في 11 نموذجاً (العيادة 14)، وسجلّ تدقيق بمعرّفات فقط، وCodeQL وBandit وpip-audit وdetect-secrets في CI.\n- تسليم Elite بمقاييس DORA: نحو 23 دمجاً في اليوم، ووسيط فتح الطلب إلى الدمج 1.83 ساعة.\n- مركز تصدير موحّد بقدرة وتدقيق وسقف حجم ومهمّة خلفية.\n\n## أولويات العمل المقترحة (مرتّبة بالأثر ثمّ الجهد)\n| # | الإجراء | الجهد التقريبي | المحور |\n|---|---|---|---|\n| 1 | worker مستقلّ وثلاثة طوابير وإعادة محاولة بتراجع، وإيقاف التنفيذ المتزامن الافتراضي في الإنتاج | 3–5 أيام | الأداء والتشغيل |\n| 2 | تقسيم CSS الوحدات بدل رفع السقف، وتأجيل Chart.js في لوحة المدير | أيام قليلة | تجربة الاستخدام |\n| 3 | قرار المالك في نقل البيانات خارج قطر وتقييم الأثر (DPIA) وإغلاق البنود المعلَّقة في إشعار الخصوصية | قرار ثمّ أسبوع | الامتثال |\n| 4 | SchoolScopedManager كشبكة ثانية لعزل المدارس، واختبارات RLS على Postgres | 5–10 أيام | الأمن |\n| 5 | نقل توليد الحصص إلى مهمّة ليلية، وCP-SAT إلى خلفية | 2–3 أيام | الأداء |\n| 6 | تجربة تراجع Railway موثَّقة، وإعادة النشر الآلي حين يُحلّ توقّف البناء | يوم | التسليم |\n| 7 | إدخال أوامر الاستيراد في بوّابة radon (فيها أعلى خمسة تعقيدات) وتفكيكها | 5–8 أيام | الجودة |\n| 8 | توسيع axe الحيّ لصفحات الأدوار الخمسة، وcaption وscope للجداول، وتفضيل النظام الداكن والتباين العالي | أيام قليلة | الوصولية |\n| 9 | حملة خفض العروض المخالفة للطبقات من 189 إلى 120 | 10–15 يوماً | المعمارية |\n| 10 | AddIndexConcurrently إلزامي في الهجرات، وPROTECT وحذف ناعم للنماذج الحسّاسة | 2–5 أيام | البيانات |\n\n---\n# الملحق أ — محور الأمن والامتثال والحوكمة (0301، مفصَّل كما سُلِّم)\n# تقرير SWOT — محور الأمن والامتثال والحوكمة في منصّة SchoolOS\n\nمن: 0301 · الحوكمة: حراسة القواعد — إلى: 0101 (المايسترو) — بأمر المالك 2026-10-21 (~16:50) عبر 0101.\nالرأس المفحوص: `origin/main` = `6f7ec060` (شجرة قراءة `C:/Users/mesue/wt_swot`، detached). قراءة فقط تحت تجميد 16:10: لا إيداع ولا دفع ولا تعديل ملفّات.\n\n## 0. المنهج ونطاق الحكم\n\n- المصدر: الشيفرة على `origin/main` وحدها، لا الوثائق ولا الذاكرة. كلّ بندٍ يحمل دليله (ملفّ:سطر). ما لم أجده في الشيفرة سمّيته «لم يُوجد» لا «غير موجود».\n- أداة القراءة: ستّ عمليّات قراءة متوازية (الإعدادات، المصادقة والصلاحيّات، التشفير والتدقيق، PDPPL، سلسلة التوريد والنشر، OWASP) ثمّ تحقّقٌ مباشرٌ منّي على الأسطر الأعلى أثراً (القسم 11).\n- المعايير المرجعيّة: OWASP Top 10 (2021)، CWE Top 25 (2024)، ISO/IEC 27001:2022 Annex A، NIST CSF 2.0، PDPPL (القانون 13/2016 ولائحته). التقييم لكلّ بند: الدليل → التقييم (قوّة/ضعف/فرصة/تهديد) → الخطورة (حرجة/عالية/متوسّطة/منخفضة) → التوصية.\n- ما لم يُفحص: الإنتاج الحيّ (متغيّرات Railway الفعليّة، إعدادات PostgreSQL على Railway، سياسات R2)، والاختبارات لم تُشغَّل من هذه الشجرة. حيث يعتمد الحكم على متغيّر بيئةٍ لا أراه قلتُ «معلّق على البيئة».\n\n## 1. أرقام عامّة (قياسٌ على 6f7ec060)\n\n| المقياس | القيمة |\n|---|---|\n| ملفّات Python | 2207 |\n| ملفّات اختبار | 790 |\n| حرّاس ثابتون موثَّقون (`docs/governance/guards/invariants`) | 97 |\n| قوالب | 350 |\n| تطبيقات Django | 44 |\n| هجرات | 419 |\n| `csrf_exempt` | 2 (واحد فعليّ: `command_center/rum_views.py:18`) |\n| `\\|safe` في القوالب | 10 |\n| `mark_safe` | 20 |\n| استدعاءات `AuditLog.log` | ~90 |\n| حقول `EncryptedTextField` | 40 |\n| سير عمل GitHub Actions | 18 |\n| قدرات (capabilities) مسجَّلة | 99 (`core/capabilities/registry.py:24`) |\n| جداول عليها RLS / سياسات | 53 / 53 |\n| استثناءات detect-secrets في baseline | 46 |\n| اعتماديّات مثبّتة `==` | 147 (كلّها عدا `sentry-sdk>=`) |\n\n## 2. الإعدادات والجلسات وترويسات النقل\n\n### 2.1 ملفّات تعريف الجلسة وCSRF\n- الدليل: `shschool/settings/base.py:345-353` (HttpOnly + SameSite=Lax للجلسة وCSRF)؛ `production.py:156-157` (Secure)؛ `production.py:161-163` (`SESSION_COOKIE_AGE` = 8 ساعات، `SESSION_EXPIRE_AT_BROWSER_CLOSE=False`)؛ `core/session_policy.py:274` (`cycle_key()` عند تبديل الدور).\n- التقييم: قوّة في HttpOnly/Secure/SameSite وتدوير المفتاح عند تبديل الدور (يقطع session fixation). ضعف: الجلسة تعيش 8 ساعات بعد إغلاق المتصفّح على أجهزةٍ مشتركةٍ في المدرسة (مختبرات، أجهزة الإداريّين المشتركة).\n- الخطورة: متوسّطة (ISO A.8.5 المصادقة الآمنة؛ NIST PR.AA-03؛ OWASP A07).\n- التوصية: `SESSION_EXPIRE_AT_BROWSER_CLOSE=True` للأدوار غير الإداريّة أو خمول 30 دقيقة عبر `session_policy`؛ إبقاء 8 ساعات مطلقةً سقفاً.\n\n### 2.2 النقل: SSL وHSTS\n- الدليل: `production.py:148-155` (`SECURE_SSL_REDIRECT`، HSTS سنة + includeSubDomains + preload)؛ `production.py:428-431` (الإقلاع يفشل إن فرغ `ALLOWED_HOSTS`).\n- التقييم: قوّة. ملاحظة: لم يُوجد `CSRF_TRUSTED_ORIGINS` ولا `USE_X_FORWARDED_HOST`؛ وراء وكيل Railway يعمل بفضل `SECURE_PROXY_SSL_HEADER`، لكن أيّ نطاقٍ مخصّصٍ ثانٍ (مثل نطاق الوزارة) سيُسقط CSRF على POST.\n- الخطورة: منخفضة الآن، متوسّطة عند إضافة نطاق.\n- التوصية: تعريف `CSRF_TRUSTED_ORIGINS` من البيئة مع فحصٍ في `check --deploy`.\n\n### 2.3 سياسة أمن المحتوى (CSP)\n- الدليل: `base.py:462-484` (django-csp 4: `script-src` = self + nonce + jsdelivr + cdnjs + unpkg؛ `style-src` فيه `'unsafe-inline'`؛ `connect-src` فيه `ws:` و`wss:` بلا تقييد مضيف؛ `frame-src self`؛ `object-src none`)؛ `production.py:386-390` (`CSP_ENFORCE` افتراضيّاً True ويقلبه متغيّر بيئة إلى report-only)؛ لم يُوجد `report-uri`/`report-to` افتراضيّ.\n- التقييم: قوّة في اعتماد nonce وobject-src none وتبنّي django-csp 4. ضعف: ثلاث شبكات CDN في script-src تجعل nonce شبه عديم الجدوى (أيّ حزمةٍ على jsdelivr/unpkg تصبح gadget)، و`unsafe-inline` في الأنماط (732 سمة style في القوالب) يفتح CSS injection/exfiltration، و`ws:` غير المشفَّر مسموح في الإنتاج، ولا تقارير تنتهك فلا رؤية.\n- الخطورة: عالية (OWASP A05 سوء التهيئة؛ CWE-79؛ ISO A.8.9 إدارة التهيئة).\n- التوصية: تخديم المكتبات محلّياً (vendoring) وإسقاط الـCDN الثلاث؛ `connect-src` = self + `wss://<المضيف>` فقط؛ `report-to` إلى Sentry؛ خطّة تدريجيّة لخفض الـ732 نمطاً المضمَّنة ثمّ إسقاط `unsafe-inline` (حارس سقفٍ تنازليّ يناسب نمط `regression_guards.md`).\n\n### 2.4 ترويسات أخرى\n- الدليل: `production.py:164-168` (nosniff، X-Frame DENY، Referrer-Policy، COOP). `Permissions-Policy` في `nginx.conf:30` فقط؛ وعلى Railway لا تمرّ الطلبات عبر nginx هذا (الخدمة daphne مباشرةً).\n- التقييم: ضعف صغير: ترويسة موثَّقة لا تصل الإنتاج.\n- الخطورة: منخفضة.\n- التوصية: نقل `Permissions-Policy` إلى middleware في Django (`SecurityMiddleware` لا يدعمها؛ middleware صغير أو django-permissions-policy).\n\n### 2.5 الأسرار في الإعدادات\n- الدليل: `base.py:250-260` (`SECRET_KEY` إلزاميّ، يرفض القيمة «dev-secret-key-change-in-production» لكن لا يرفض قيمة `.env.example` الفعليّة)؛ `.env.example` فيه `DEBUG=True`؛ `base.py:264-271` (`FERNET_KEY` + `FERNET_OLD_KEYS` للتدوير).\n- التقييم: قوّة في فشل الإقلاع بلا مفتاح. ضعف: قائمة الرفض لا تطابق القالب المنسوخ فعلاً، فنسخ `.env.example` كما هو يمرّ.\n- الخطورة: منخفضة (الإنتاج على Railway بمتغيّراته؛ الخطر في staging/preview).\n- التوصية: رفض كلّ قيمةٍ تطابق ما في `.env.example` بحارسٍ يقرأ الملفّ.\n\n### 2.6 كلمات المرور والتجزئة\n- الدليل: `base.py:236-245` (4 مدقّقات + `StrongPasswordValidator` بحدّ 12)؛ لم يُوجد `PASSWORD_HASHERS` في الإنتاج (الافتراضيّ PBKDF2-SHA256، 2025 المعياريّ لـDjango 5.2)؛ `testing.py:84` MD5 للاختبار فقط (سليم).\n- التقييم: قوّة مقبولة. فرصة: Argon2id (توصية OWASP الأولى) بإضافة `argon2-cffi` وترقية شفّافة عند أوّل تسجيل دخول.\n- الخطورة: منخفضة.\n\n### 2.7 الحدّ من المحاولات (brute force)\n- الدليل: `base.py:527-561` (django-axes: 5 محاولات / 5 دقائق على [username, ip])؛ staging 20.\n- التقييم: قوّة. ضعف خفيف: القفل على الزوج (اسم، IP) يسمح بتوزيع المحاولات من عناوين كثيرة على اسمٍ واحد (credential stuffing)، والعكس لا يعطّل مستخدماً بريئاً (مقصود).\n- الخطورة: منخفضة.\n- التوصية: حدٌّ ثانٍ على username وحده أعلى (مثلاً 30/ساعة) مع إشعار.\n\n### 2.8 السجلّات والمراقبة\n- الدليل: `production.py:255-293` (`PIIMaskingFilter` على كلّ المعالجات)؛ `production.py:120` (Sentry `send_default_pii=False`)؛ ملفّات السجلّ داخل الحاوية (تضيع عند إعادة النشر)؛ حصّة Sentry المجّانيّة مستنفدة (`error_counter` بحسب فحص المراقبة).\n- التقييم: قوّة في الإخفاء بالمرشّح. ضعف: لا احتفاظ خارجيّ بسجلّات الأمن (ISO A.8.15 يطلب حفظاً وحماية؛ PDPPL م.11 تدقيق داخليّ)، وإنذارات Sentry معطّلة فعليّاً بنفاد الحصّة.\n- الخطورة: عالية (كشف الحوادث واستقصاؤها؛ NIST DE.CM).\n- التوصية: شحن السجلّات إلى Railway logs/Logtail أو ملفّ على R2 يوميّاً مع احتفاظ 365 يوماً؛ تصفية ضجيج Sentry (`before_send`) أو ترقية الخطّة.\n\n### 2.9 واجهة DRF وCORS\n- الدليل: `base.py:373-391` (مصادقة الجلسة فقط، `IsAuthenticated` افتراضيّاً، throttles anon 30 / user 120 / sensitive 10)؛ `API_JWT_ENABLED=False`؛ CORS من البيئة.\n- التقييم: قوّة واضحة: سطح API مغلق افتراضيّاً.\n- الخطورة: لا شيء.\n\n### 2.10 بيئتا staging وpreview\n- الدليل: staging: HSTS ساعة، CSP report-only، AXES 20، `ALLOWED_HOSTS` افتراضيّ ثابت؛ preview: SSL off وكوكيز غير Secure.\n- التقييم: مقبول لبيئاتٍ غير إنتاجيّة بشرط ألّا تحمل بياناتٍ حقيقيّة. تهديد: قاعدة staging/preview تُنسخ من الإنتاج (نمط `session_server.md`) فتصبح نسخةً من بيانات الطلبة تحت حمايةٍ أضعف.\n- الخطورة: متوسّطة (PDPPL م.13 أمن المعالجة).\n- التوصية: إخفاء (pseudonymization) إلزاميّ عند نسخ قاعدةٍ لغير الإنتاج (أمر إدارةٍ يُشغَّل بعد النسخ ويفشل إن وجد رقماً شخصيّاً صريحاً).\n\n## 3. المصادقة والصلاحيّات وعزل البيانات\n\n### 3.1 سجلّ القدرات المركزيّ\n- الدليل: `core/capabilities/registry.py:24` (99 قدرة)، snapshot test يثبّتها؛ `core/capabilities/access.py:28-38` (`has_capability`: developer مستثنى → superuser/unrestricted → role → grant → acting)؛ `core/capability_grants.py` (`GRANTER_ROLES`، سبب ≥ 5 أحرف، `PermissionAuditLog`، لا حذف)؛ `active_role` في الجلسة؛ `tests/test_every_route_is_guarded.py`.\n- التقييم: قوّة بنيويّة من الطراز الأوّل: RBAC مركزيّ + منح مؤقّتة مسبَّبة مدقَّقة + اختبار يفرض حراسة كلّ مسار. ضعف: قائمة `GUARDED_INSIDE` (عشرات المسارات محميّة داخل الدالّة لا بالمزخرِف) لا يضمنها الاختبار ثابتاً، فيكفي تعديل سطرٍ داخل view لفتح المسار دون أن يسقط اختبار.\n- الخطورة: متوسّطة (OWASP A01 كسر التحكّم بالوصول).\n- التوصية: اختبار تكامليّ يطلب كلّ مسارٍ في `GUARDED_INSIDE` بمستخدمٍ مجهولٍ وبدورٍ أدنى ويتوقّع 302/403؛ وسقّاطة تمنع نموّ القائمة.\n\n### 3.2 المسارات المفتوحة بالتصميم\n- الدليل: `OPEN_BY_DESIGN` في `tests/test_every_route_is_guarded.py`: academic stubs، `status/`، `api/v1/library/books/`، `schema/`، `docs/`، `redoc/`، `rum/collect/`.\n- التقييم: `schema/` و`redoc/` يكشفان بنية API كاملةً لغير المصادَق (استطلاع). `rum/collect/` مع `csrf_exempt` (`command_center/rum_views.py:18`، `require_POST`، يردّ 204) نقطة كتابةٍ عامّة بلا throttle مرئيّ.\n- الخطورة: منخفضة إلى متوسّطة (A05؛ إغراق RUM).\n- التوصية: إغلاق `schema/redoc` خلف `IsAuthenticated` أو إزالتهما من الإنتاج؛ throttle على `rum/collect/` وحدّ حجم جسم الطلب.\n\n### 3.3 أمن الصفّ (RLS) في PostgreSQL\n- الدليل: 53 `ENABLE ROW LEVEL SECURITY` و53 `CREATE POLICY`؛ الهجرة 0037 تشتقّ هويّة المستأجر من `session_user` مع `app_rls_bypass=false`؛ `core/middleware_rls.py` fail-closed (503) بلا استثناء superuser؛ لم يُوجد `FORCE ROW LEVEL SECURITY`؛ لا `SchoolScopedManager`؛ `CustomUser` بلا `school_id`؛ ~20 جدولاً بلا `school_id` (`test_tenant_surface_coverage`).\n- التقييم: قوّة في وجود RLS fail-closed على 53 جدولاً وفي حارس التغطية. ضعف جوهريّ: مالك الجداول (دور الهجرات) يتجاوز RLS ما لم يُفرض `FORCE`، فأيّ اتّصالٍ بدور المالك (الأوامر الإداريّة، الطابور، النسخ) يرى كلّ شيء؛ والتصميم يعزل «النشر» (deployment) لا «المدارس» داخل نشرٍ واحد، فإن استُضيفت مدرستان في قاعدةٍ واحدة يوماً فلا عزل. 20 جدولاً خارج النطاق + المستخدم نفسه بلا مدرسة.\n- الخطورة: متوسّطة الآن (مدرسة واحدة/نشر)، حرجة عند التعدّد (A01؛ ISO A.8.3 تقييد الوصول).\n- التوصية: `ALTER TABLE … FORCE ROW LEVEL SECURITY` في هجرةٍ واحدة مع فصل دور التطبيق عن دور المالك؛ قرار معماريّ (ADR) صريح: «مستأجرٌ واحد لكلّ نشر» مُسجَّل، أو إكمال `school_id` على الـ20 جدولاً وعلى `CustomUser`.\n\n### 3.4 المصادقة الثنائيّة\n- الدليل: `core/views_auth.py:140-142` (`requires_two_factor`: superuser أو كادر)؛ `base.py:216` (`TWO_FACTOR_REQUIRED_FOR_STAFF` راية بيئيّة)؛ `mfa_session` يغلق `/admin/login`؛ لا MFA لأولياء الأمور/الطلبة.\n- التقييم: قوّة في TOTP للكادر وإغلاق باب admin. ضعف: الإلزام معلّق على متغيّر بيئة (قابل للإطفاء بلا نشر ولا أثر في المستودع)؛ لا بديل استعادة (recovery codes) ظاهر؛ أولياء الأمور يرون بياناتٍ صحّيّةً وسلوكيّةً عن أطفالهم بكلمة مرورٍ وحدها.\n- الخطورة: متوسّطة (A07؛ ISO A.8.5؛ NIST PR.AA).\n- التوصية: جعل الإلزام للكادر ثابتاً في الشيفرة في الإنتاج (لا متغيّر) مع حارس اختبار؛ MFA اختياريّ لأولياء الأمور بالبريد/التطبيق؛ رموز استعادة.\n\n### 3.5 دورة حياة الحساب\n- الدليل: كلمات مرور أوّليّة 14 خانةً تُعرض مرّةً واحدة؛ لا «نسيت كلمة المرور» بالبريد (إعادة إداريّة `it_admin.reset_passwords`)؛ `logout` POST + `Clear-Site-Data`.\n- التقييم: قوّة: إغلاق ناقل إعادة التعيين بالبريد يحذف فئةً كاملةً من الهجمات؛ `Clear-Site-Data` ممتاز. ضعف: عبء إداريّ واعتمادٌ على بشرٍ للتحقّق من الهويّة (هندسة اجتماعيّة على مسؤول الـIT).\n- الخطورة: منخفضة.\n- التوصية: إجراء مكتوب للتحقّق من الهويّة قبل إعادة التعيين + تسجيل كلّ إعادةٍ في `AuditLog` (تحقّق أنّها مسجَّلة).\n\n### 3.6 دور المطوّر\n- الدليل: `access.py:28-38` (developer مستثنى من الحظر؛ D-118م)؛ تدقيق المطوّر على 4 بادئات مسارٍ فقط «يسجَّل ولا يمنع».\n- التقييم: تهديد داخليّ: حساب واحد يرى كلّ صفحةٍ (سجلّات صحّيّة وسلوكيّة) وأثره في التدقيق جزئيّ. PDPPL م.12 (تقليل) وم.13، وISO A.5.15/A.8.2 (الامتيازات) تطلب تقييداً وتسجيلاً كاملاً.\n- الخطورة: عالية (سلطة المالك أقرّتها لكن الواجب تدقيقها كاملاً).\n- التوصية: تسجيل كلّ قراءةٍ للمطوّر على كلّ مسارٍ (لا 4 بادئات)، مع لوحة مراجعةٍ أسبوعيّة؛ وفصل «حساب المطوّر» عن «حساب المالك الإداريّ».\n\n### 3.7 واجهة الإدارة Django admin\n- الدليل: ~75 نموذجاً مسجَّلاً بلا قيود صلاحيّة خاصّة؛ `has_delete_permission` على `AuditLog` = `is_superuser` (`core/admin.py:642-643` و`:798-799`).\n- التقييم: ضعف: الواجب على سجلّ التدقيق أن يكون الحذف `False` مطلقاً حتى للـsuperuser (الزناد في 0014 يمنع على مستوى القاعدة، فالأثر عمليّاً رسالة خطأ، لكن القصد يجب أن يُقرأ في الشيفرة).\n- الخطورة: منخفضة (محميّ بالزناد).\n- التوصية: `return False` صريح + اختبار.\n\n### 3.8 الإشارة المباشرة إلى الكائنات (IDOR)\n- الدليل: `api/views.py:193` و`:258` (مسار `is_admin` يتخطّى فحص الإسناد وكائن الطالب غير مقيَّد بالمدرسة).\n- التقييم: ضعف محدود (المدير يرى طلبة مدرسته أصلاً؛ الأثر الحقيقيّ عند التعدّد).\n- الخطورة: منخفضة إلى متوسّطة (A01؛ CWE-639).\n- التوصية: تقييد كلّ `get_object_or_404(Student…)` بـ`school=request.school`؛ حارس grep يمنع `Student.objects.get(pk=` خارج selectors.\n\n## 4. التشفير وسجلّ التدقيق\n\n### 4.1 حقل التشفير\n- الدليل: `core/fields.py:14` (`EncryptedTextField` وحده)؛ `get_prep_value` fail-closed (يرفض الحفظ بلا مفتاح في غير DEBUG)، `from_db_value` fail-open (يعيد النصّ المشفَّر عند فشل الفكّ)؛ `core/models/crypto.py:31-62` (`MultiFernet` للتدوير)؛ في DEBUG بلا مفتاح = نصّ صريح.\n- التقييم: قوّة: MultiFernet مع fail-closed على الكتابة. ضعف: fail-open على القراءة يخفي فشل مفتاحٍ خاطئ (يظهر كـ«نصّ مشوّه» لا كخطأ) فيمرّ بلا إنذار؛ لا حقل مشفَّر رقميّ/تاريخيّ فتُجبر الحقول الحسّاسة الرقميّة على البقاء صريحة.\n- الخطورة: متوسّطة (ISO A.8.24 التشفير).\n- التوصية: `from_db_value` يسجّل خطأً في Sentry مع عدّاد، وحارس يفشل إن تجاوز العدّاد صفراً في الاختبارات.\n\n### 4.2 الرقم الشخصيّ والجوّال نصّاً صريحاً (الأعلى أثراً)\n- الدليل: `core/models/user.py:32-36` (تعليق صريح: «national_id plaintext kept as USERNAME_FIELD (Django requirement)»، `national_id = CharField`) إلى جانب `national_id_encrypted`/`national_id_hmac`؛ `user.py:44` phone صريح؛ المصادقة عبر `HMACAuthBackend`.\n- التقييم: تهديد مباشر: الجدول الأكثر قراءةً في النظام يحمل الرقم القطريّ (معرّف وطنيّ = بيانات ذات طبيعة خاصّة عمليّاً) نصّاً في عمودٍ مفهرس، مع أنّ البنية البديلة (HMAC للبحث + Fernet للتخزين) موجودة وتعمل. أيّ تسريبٍ لنسخة قاعدة (backup artifact على مستودعٍ عامّ، انظر 6.6) أو حقن SQL مستقبليّ يكشف كلّ الأرقام الشخصيّة للطلبة والكادر دفعةً.\n- الخطورة: حرجة (PDPPL م.13 وم.16؛ ISO A.8.24؛ CWE-312).\n- التوصية: جعل `USERNAME_FIELD` عموداً معتماً (`username` = HMAC أو UUID)، إفراغ `national_id` الصريح بهجرة «توسيع ثمّ تقليص» (`.claude/rules/migrations.md`)، والإبقاء على HMAC للبحث. حارس `test_national_id_never_bulk` يبقى. المدّة التقديريّة: بطاقة واحدة متوسّطة الحجم مع اختبار الـbackends.\n\n### 4.3 حقول حسّاسة أخرى صريحة\n- الدليل: `email`، `nationality` (`user.py:63`)، `residence_area`، `municipality`، `region`، `employer_*`، `Profile.birth_date` (`:440`)، `Profile.notes` (`:445`)، `LeaveRequest.reason` (`:209`، يحمل تشخيصاً عند الإجازة المرضيّة)؛ `staff_affairs` بلا تشفير؛ العيادة (`HealthRecord`/`ClinicVisit`) مشفَّرة كاملاً.\n- التقييم: قوّة في العيادة. ضعف: `LeaveRequest.reason` بياناتٌ صحّيّةٌ (م.16) نصّاً؛ `nationality` بلا مبرّرٍ معالجةٍ موثَّق (م.12 تقليل)؛ `Profile.notes` حقل حرّ يستقبل أيّ شيء.\n- الخطورة: عالية لـ`reason`، متوسّطة للبقيّة.\n- التوصية: تشفير `LeaveRequest.reason` و`Profile.notes` فوراً (حقل موجود)؛ قرار حذف `nationality` أو توثيق أساسه القانونيّ.\n\n### 4.4 تدوير مفتاح Fernet\n- الدليل: `governance/management/commands/rotate_fernet_key.py` (اكتشاف تلقائيّ للحقول + CustomUser وTwilio يدويّاً)؛ `test_encrypted_fields_covered_by_rotation` (تغطية كاملة)؛ بلا دفعات ولا معاملة؛ خطر إعادة تشفير قيمةٍ لم تُفكّ (بسبب fail-open في 4.1).\n- التقييم: قوّة في وجود التدوير وحارس تغطيته. ضعف: تدوير على جدولٍ كبيرٍ بلا `iterator()`/دفعات = ذاكرة وقفل طويل؛ وإن فشل فكّ صفٍّ أعاد تشفير النصّ المشفَّر القديم بالمفتاح الجديد (فساد صامت).\n- الخطورة: متوسّطة.\n- التوصية: التدوير يتوقّف على أوّل فشل فكّ، يعمل بدفعات 500 في معاملة لكلّ دفعة، ويكتب تقريراً؛ اختبار تجريبيّ (dry-run) إلزاميّ.\n\n### 4.5 سجلّ التدقيق\n- الدليل: `core/models/audit.py:184` (`AuditLog` ثابت: `save`/`delete` يرفضان التعديل) + زناد قاعدة 0014 مع 4 استثناءات (0059/0078/0082/0083)؛ لا hash-chain؛ لا سياسة احتفاظ (ينمو بلا حدّ)؛ `object_repr` نصّ حرّ محروس باختبار؛ `exports/services.py:120,172` يكتب `kind?query` (قد يحوي رقماً شخصيّاً في الاستعلام)؛ تسجيل القراءة يدويّ (clinic/student_info/behavior)؛ `core/audit_export.py:22` (`log_export`) محروس بـ`test_national_id_never_bulk` (≥25 مصدّراً نصّيّاً، لا يرى `runner.py` ولا أوامر الإدارة).\n- التقييم: قوّة متميّزة: ثبات على مستوى ORM والقاعدة، وتسجيل التصدير، وحرّاس ضدّ التسريب الجماعيّ. ضعف: (أ) لا دليل سلامة (hash-chain/توقيع) فمن يملك القاعدة يعدّل الزناد ثمّ السجلّ؛ (ب) لا احتفاظ: PDPPL م.10 يطلب حدّاً، و`data_retention.md` يستثني السجلّ، فسيحمل أسماء طلبةٍ إلى الأبد؛ (ج) الاستعلام الخامّ في السجلّ قد يحمل بيانات؛ (د) تسجيل القراءة يدويّ: أيّ صفحةٍ جديدةٍ تعرض سجلّاً صحّيّاً بلا سطرٍ `AuditLog.log` لا تُسجَّل، والاختبار لا يفرضه.\n- الخطورة: متوسّطة إلى عالية (ISO A.8.15/A.8.16؛ NIST DE.AE؛ PDPPL م.11).\n- التوصية: hash-chain بسيط (`prev_hash` + `sha256`) يُحقّق أسبوعيّاً بأمر إدارة؛ احتفاظ 5 سنواتٍ مع أرشفةٍ باردةٍ مشفَّرة؛ تعقيم `query` قبل التسجيل؛ mixin `AuditedDetailView` يفرض تسجيل القراءة على كلّ view لنموذجٍ موسومٍ «حسّاس» + حارس يعدّ الـviews غير الموسومة.\n\n## 5. PDPPL (القانون 13/2016)\n\n### 5.1 الاحتفاظ والمحو (م.10)\n- الدليل: `docs/privacy/data_retention.md` (730 يوماً)؛ `enforce_data_retention` أسبوعيّ؛ `governance/retention.py:203-264` (`RULES`): يُحذف جلسات/JWT/axes/7 جداول إشعارات/`autoinfractionnotice`/`importlog`؛ يُحفظ `auditlog`/`consent`/`breach`/`erasure`/سجلّات الطالب/`healthrecord`؛ `clinicvisit` 730 «لم تُنفَّذ بعد».\n- التقييم: قوّة: سياسة مكتوبة ومنفَّذة آليّاً على الجداول التقنيّة. ضعف: السجلّات الجوهريّة (الصحّيّة والسلوكيّة والأكاديميّة) بلا حدٍّ فعليّ، و`clinicvisit` معلَّق.\n- الخطورة: متوسّطة.\n- التوصية: تفعيل قاعدة `clinicvisit`؛ قرار مالكٍ موثَّق لمدد الاحتفاظ بعد مغادرة الطالب (مثلاً سنتان ثمّ إخفاء الهويّة) + أمر `anonymize_departed_students`.\n\n### 5.2 الموافقة (م.4)\n- الدليل: `core/models/audit.py:297` (`ConsentRecord`: health/behavior/…)؛ الفحص عند الإشعارات فقط (`notifications/hub.py:525-560`) والإشعارات الإلزاميّة تتجاوزه.\n- التقييم: ضعف: الموافقة تُفحص في قناةٍ واحدة لا عند المعالجة نفسها (التخزين/العرض/التصدير)، فلا أثر للسحب (م.5) على ما يُعرض للكادر.\n- الخطورة: متوسّطة.\n- التوصية: تحديد الأساس القانونيّ لكلّ معالجة (واجب قانونيّ للمدرسة الحكوميّة في معظمها، فالموافقة لا تلزم إلّا للإشعارات الاختياريّة والصور) وتوثيقه في سجلّ المعالجة (RoPA).\n\n### 5.3 حقوق أصحاب البيانات (م.5–م.9)\n- الدليل: `ErasureRequest` (`audit.py:565`) + `api/views_erasure.py` + `governance/erasure_service.py` (هجين حذف/إخفاء)؛ لا تصدير «بياناتي» ولا تصحيح ذاتيّ؛ `privacy_notice_ar.md` مسوّدة v0.1 غير معروضة؛ لا صفحة خصوصيّة منشورة.\n- التقييم: قوّة في المحو المنظَّم. ضعف: حقّ الاطّلاع والنسخ وحقّ التصحيح غير مؤتمتين؛ إشعار الخصوصيّة (م.9) غير منشورٍ داخل التطبيق.\n- الخطورة: عالية (التزام قانونيّ مباشر؛ أوّل ما يطلبه المفتّش).\n- التوصية: صفحة `/privacy/` تعرض الإشعار من الملفّ؛ زرّ «طلب نسخة بياناتي» يولّد JSON/PDF عبر `log_export`؛ طلب تصحيحٍ يذهب لسجلّ الشؤون.\n\n### 5.4 إخطار الخرق (م.14)\n- الدليل: `BreachReport` (`audit.py:366`، مهلة 72 ساعة)، `breach/services.py` (`NCSA_TEMPLATE`)؛ إرسال يدويّ؛ لا ربط بأحداث `security/` أو Sentry؛ تعارض م.11/م.14 في `data_retention.md:90`.\n- التقييم: قوّة: نموذج وقالب جاهزان. ضعف: لا مسار من «كشف» إلى «بلاغ»: الحوادث الأمنيّة (axes lockouts الكثيفة، فشل RLS 503، أخطاء Sentry) لا تُنشئ `BreachReport` مرشَّحاً.\n- الخطورة: متوسّطة.\n- التوصية: قاعدة ربطٍ واحدة: حدث أمنيّ فوق عتبة → `BreachReport(status=suspected)` + إشعار DPO؛ تصحيح تعارض الوثيقة.\n\n### 5.5 تقليل البيانات والأطفال (م.12، م.17)\n- الدليل: السلوك يرسل «السبب/المخالفة» نصّاً لأولياء الأمور (`behavior/services.py:322-329`) ويُخزَّن في `NotificationLog` 730 يوماً عبر قنواتٍ خارجيّة (SMS/Twilio)؛ العيادة لا تسرّب السبب (`clinic/services.py:428-436`).\n- التقييم: ضعف: تفاصيل مخالفة طفلٍ تمرّ بمزوّد SMS أجنبيّ وتُحفظ نصّاً سنتين، بينما العيادة تُحسن الصنع.\n- الخطورة: عالية (أطفال + طرف ثالث + تخزين).\n- التوصية: نمط العيادة نفسه: رسالة عامّة «لديكم إشعار سلوكيّ، افتحوا التطبيق» والتفاصيل داخل جلسةٍ مصادَقة.\n\n### 5.6 النقل عبر الحدود والمعالِجون (م.15)\n- الدليل: الاستضافة Railway us-west2 (`docs/DEPLOYMENT-RAILWAY.md:168`)، PITR في sjc، SMTP عبر gmail، Twilio، Sentry؛ لا DPIA ولا قرار نقلٍ موثَّق؛ لا DPO معيَّن (المالك بصفته).\n- التقييم: تهديد تنظيميّ: بيانات أطفالٍ قطريّين وصحّتهم وسلوكهم كلّها خارج قطر عند خمسة معالِجين بلا تقييم أثرٍ ولا اتّفاقيّات معالجةٍ موثَّقة في المستودع. هذا أكبر خطرٍ قانونيٍّ في المنصّة ولا تحلّه شيفرة.\n- الخطورة: حرجة (قانونيّاً)، وتقديرها التقنيّ خارج نطاقي.\n- التوصية: DPIA مكتوب (قالب في مهارة `pdppl-compliance`)، قائمة المعالِجين واتّفاقيّاتهم في `docs/privacy/processors.md`، قرار المالك في النقل أو الاستضافة داخل قطر/الخليج، تعيين DPO رسميّ.\n\n## 6. سلسلة التوريد والنشر والنسخ\n\n### 6.1 الفحص الثابت\n- الدليل: `.github/workflows/security-scan.yml`: Bandit بمستوى HIGH/HIGH فقط، `scripts/` مستثنى، تخطّي B101/B601؛ لا CodeQL (لم يُوجد في `.github/`)؛ DAST أُزيل 2026-09-14.\n- التقييم: ضعف: Bandit بأعلى عتبةٍ يصمت عن MEDIUM (مثل `yaml.load`، تجزئة ضعيفة، `requests` بلا timeout)، و`scripts/` حيث أدوات النشر والنسخ خارج الفحص تماماً؛ غياب CodeQL يفقد تحليل تدفّق البيانات (taint) الذي يكشف XSS/IDOR الحقيقيّة.\n- الخطورة: عالية (ISO A.8.8 إدارة الثغرات؛ NIST ID.RA).\n- التوصية: CodeQL (python + javascript) على PR؛ Bandit MEDIUM/MEDIUM مع baseline؛ إدخال `scripts/`؛ ZAP baseline أسبوعيّاً على staging.\n\n### 6.2 الاعتماديّات\n- الدليل: pip-audit (PyPI + OSV) يفشل البناء؛ استثناء `GHSA-8pqf-f4m5-798g` بانتهاء 2026-11-15 محروس بـ`test_vuln_ignore_expiry`؛ requirements 147 `==` بلا `--hash`؛ `sentry-sdk>=` غير مثبّت؛ Dependabot أسبوعيّ؛ Actions مثبّتة بالـSHA؛ لا `npm audit` (المكتبات من CDN).\n- التقييم: قوّة قويّة: pip-audit حاجب + استثناءات بتاريخ انتهاءٍ محروس + Actions بالـSHA. ضعف: بلا `--require-hashes` يبقى هجوم استبدال الحزمة (typosquat/مرآة) ممكناً؛ `sentry-sdk` يتحرّك بصمت؛ شيفرة JS من CDN بلا SRI ولا فحص.\n- الخطورة: متوسّطة.\n- التوصية: `pip-compile --generate-hashes`؛ تثبيت `sentry-sdk==`؛ vendoring الـJS مع SRI (يخدم CSP أيضاً).\n\n### 6.3 الأسرار\n- الدليل: detect-secrets 1.5.0 مع baseline 46 استثناء؛ لا أسرار في المستودع (فحص)؛ `.env` مستبعد من Docker.\n- التقييم: قوّة. فرصة: مراجعة الـ46 استثناءً سنويّاً.\n- الخطورة: منخفضة.\n\n### 6.4 بوّابات CI\n- الدليل: `check --deploy --fail-level WARNING` في CI؛ لكن `scripts/railway-predeploy.sh:65` يشغّله بـ`|| echo` (لا يوقف النشر)؛ `ci_needs_gate.py` + `test_ci_gates_are_honest`؛ فحصان مطلوبان فقط في حماية main («ملخّص بوّابة الجودة»، «Security Summary») strict + enforce_admins؛ EXEMPT لـmypy/axe/e2e على push.\n- التقييم: قوّة فريدة: بوّابة «صدق CI» تمنع خضرةً كاذبة، وحماية main على المسؤولين. ضعف: فحص النشر في الإنتاج نفسه لا يحجب.\n- الخطورة: منخفضة (CI يحجبه قبلاً).\n- التوصية: إزالة `|| echo` أو جعله يحجب على ERROR فقط.\n\n### 6.5 الحاويات والشبكة\n- الدليل: `Dockerfile` `python:3.12-slim-bookworm` بالوسم لا الـdigest، `appuser`، `HEALTHCHECK`؛ compose بلا `secrets:` وشبكات بلا `internal: true`؛ nginx TLS 1.2/1.3 بلا `server_tokens off`؛ لا `railway.toml`؛ migrate تلقائيّ في predeploy.\n- التقييم: قوّة: مستخدم غير جذر وفحص صحّة. ضعف: الصورة الأساس غير مثبّتة بالـdigest؛ migrate تلقائيّ بلا بوّابة تفحص الأقفال (مهارة `schoolos-migration-guard` موجودة لكن لا تُشغَّل في predeploy).\n- الخطورة: متوسّطة.\n- التوصية: `FROM python@sha256:…` بتحديث Dependabot؛ تشغيل فاحص الهجرات في CI على كلّ هجرةٍ جديدة.\n\n### 6.6 النسخ الاحتياطيّ والاستعادة\n- الدليل: `backup.yml` يوميّ 01:00، gpg AES256، R2 اختياريّ، artifact 90 يوماً على مستودع (عامّ؟) GitHub، اختبار استعادة أسبوعيّ، `backup.sh` بلا تشفير، لا RTO/RPO موثَّقان، لا تنبيه عند فشل النسخ.\n- التقييم: قوّة: تشفير النسخة واختبار استعادةٍ دوريّ (نادر في مشاريع بهذا الحجم). ضعف: النسخة على GitHub artifacts (حتى مشفَّرةً) خارج قطر وفي منصّةٍ ثالثة؛ `backup.sh` اليدويّ ينتج ملفّاً صريحاً؛ فشل النسخ صامت (NIST RC.RP؛ ISO A.8.13).\n- الخطورة: عالية (مع 4.2: نسخة قاعدةٍ تحمل الأرقام الشخصيّة صريحةً داخل dump مشفَّر بمفتاحٍ واحد).\n- التوصية: R2 إلزاميّ لا اختياريّ، إلغاء artifact GitHub، تشفير `backup.sh`، تنبيه فشل إلى المالك، وثيقة RTO/RPO مع تمرين استعادةٍ ربع سنويّ موثَّق.\n\n### 6.7 التراجع والكناري والمراقبة\n- الدليل: `rollback.yml` = revert-pr فقط (لا `RAILWAY_TOKEN`)؛ الكناري يُتخطّى إن غاب `PRODUCTION_URL`؛ `deploy_window.py` يفرض نافذة النشر في `merge_group`؛ monitor كلّ 15 دقيقة، worker-heartbeat 10؛ قرار المالك «لا تجربة تراجع على الإنتاج».\n- التقييم: قوّة: نافذة نشرٍ مفروضة آليّاً ومراقبة دوريّة. ضعف: التراجع الفعليّ غير مجرَّب (قرار مالك)، والكناري قابل للتخطّي الصامت.\n- الخطورة: متوسّطة.\n- التوصية: الكناري يفشل إن غاب المتغيّر (fail-closed كما في بقيّة النظام)؛ تمرين تراجعٍ على staging لا الإنتاج.\n\n## 7. OWASP Top 10 وCWE Top 25 (مطابقة)\n\n| البند | الحالة | الدليل | الخطورة |\n|---|---|---|---|\n| A01 التحكّم بالوصول | قويّ مع ثغرات محدَّدة | 3.1، 3.3، 3.8 | متوسّطة |\n| A02 إخفاقات التشفير | ضعيف في المستخدم | 4.2، 4.3 | حرجة |\n| A03 الحقن | سليم: لا SQL خامّ غير مربوط (`clinic/encryption_audit.py:132` أسماء من `_meta`)؛ لا `subprocess`/`eval`/`pickle`/`yaml.load` | — | منخفضة |\n| A03 XSS | `\\|safe` على `chart_labels_json` داخل `<script>` (`attendance_overview.html:106-108`، `behavior_overview.html:78,81`؛ المصدر `json.dumps` في `views.py:1377/1655`): آمن اليوم لأنّ المصدر JSON، هشّ غداً | → `json_script` | منخفضة |\n| A03 Markdown | `docs_viewer` يصيّر Markdown بلا تعقيم (المحتوى من المستودع لا المستخدم) | — | منخفضة |\n| A04 التصميم غير الآمن | ضعيف في PDPPL (5.5، 5.6) | — | عالية |\n| A05 سوء التهيئة | CSP، ترويسات، schema مفتوح | 2.3، 2.4، 3.2 | عالية |\n| A06 مكوّنات ضعيفة | pip-audit جيّد، JS من CDN بلا فحص | 6.2 | متوسّطة |\n| A07 المصادقة | جيّد، MFA معلّق على البيئة | 3.4 | متوسّطة |\n| A08 سلامة البرمجيّات والبيانات | لا hashes، لا SRI، صورة بالوسم | 6.2، 6.5 | متوسّطة |\n| A09 إخفاق التسجيل | سجلّات تضيع، Sentry مستنفد، قراءة يدويّة | 2.8، 4.5 | عالية |\n| A10 SSRF | **WeasyPrint بلا `url_fetcher` مقيَّد** (`core/pdf_utils.py:679-680`: `HTML(string=…, base_url=…)` يجلب أيّ `<img src>`/`@import` من الشبكة الداخليّة إن دخل محتوى مستخدمٍ في القالب) | CWE-918 | متوسّطة |\n| رفع الملفّات | 17 حقل رفع؛ 5+ بـ`FileTypeValidator`؛ `school.py:99/111/118` و`staff_affairs:210/654` بلا مدقّق؛ `views_media.py:55-80` fail-closed + attachment لـSVG/HTML | CWE-434 | متوسّطة |\n| استنزاف الموارد | `staging/views.py:334` `load_workbook` بلا `read_only` ولا حدّ حجم (قنبلة XML/ذاكرة)؛ `base.py:564-565` حدّ 5MB عامّ يخفّفه | CWE-400 | متوسّطة |\n| حقن الصيغ Excel | `excel_safety` 101 موضعاً؛ `daily.py:739-761` `ws.append` بلا تعقيم (مرشَّح) | CWE-1236 | منخفضة |\n| إعادة التوجيه

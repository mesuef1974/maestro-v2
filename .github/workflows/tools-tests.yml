name: اختبارات أدوات الحوكمة

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tools-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    # الأدوات مكتوبة وتُشغَّل على Windows (مسارات ومحارف)؛ فالفحص على بيئتها نفسها
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      # مستودعٌ يوجد في CI بدل المسار المحلّي المطلق D:/shschool_mvp الذي تفترضه الأدوات
      SCHOOLOS_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bash الخاصّ بـGit قبل bash الخاصّ بـWSL (اختبارات release_follow)
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\Git\bin"
      - name: تثبيت pytest وtzdata وtiktoken (منطقة Asia/Qatar على Windows)
        run: python -m pip install pytest tzdata tiktoken
      - name: اختبارات tools
        run: python -m pytest tools -q -p no:cacheprovider
